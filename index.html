function optBtn(i,label,R,k,rv){ const q=R.items[k].q, a=R.A[k]; let cls='opt'; if(a.c===i) cls+=' sel'; if(rv){ if(i===q.kunci) cls+=' good'; else if(a.c===i) cls+=' wrong'; }
  const why=rv&&q.alasan&&q.alasan[i]&&i!==q.kunci&&!/^kunci\.?$/i.test(q.alasan[i])?'<span class="why">'+mx(q.alasan[i])+'</span>':'';
  return '<button class="'+cls+'" data-action="pick" data-v="'+i+'"'+(rv?' disabled':'')+'><span class="lt">'+'ABCDE'[i]+'</span><span class="grow">'+txt(label)+why+'</span></button>'; }
function viewRun(){
  const R=V.run, k=R.cur, n=R.items.length, it=R.items[k], q=it.q, a=R.A[k], rv=a.done&&R.cek==='langsung', left=timeLeft(R);
  const g=q.stim?(it.set.stimulus||[]).find(x=>x.id===q.stim):null;
  let h='<header class="top run"><button class="btn sm" data-action="keluar">‹ Keluar</button><span class="grow mid"><span class="lbl">'+esc(R.label)+'</span></span><span class="cd" id="tm">'+(left!=null?mmss(left):mmss(R.T[k]))+'</span></header>';
  h+='<div class="dots">'+R.items.map((x,i)=>'<button data-action="ke" data-v="'+i+'" class="'+(i===k?'cur ':'')+(R.A[i].done&&R.cek==='langsung'?(R.A[i].ok?'ok':'no'):(R.A[i].done||isAns(x.q,R.A[i])?'ans':''))+'">'+(i+1)+'</button>').join('')+'</div>';
  h+='<div class="qhd">'+badge(q.sub)+'<span class="sm">Soal '+(k+1)+' dari '+n+' · target '+SUB[q.sub].dtk+' detik</span></div>';
  if(g) h+='<div class="card stim">'+(g.judul?'<b>'+esc(g.judul)+'</b>':'')+g.teks.map(p=>'<p>'+txt(p)+'</p>').join('')+tabel(g.tabel)+'</div>';
  h+='<div class="card q">'+q.teks.map(p=>'<p>'+txt(p)+'</p>').join('')+tabel(q.tabel)+'<p class="ask">'+txt(q.perintah)+'</p>';
  if(a.prev) h+='<p class="sm">Soal ini sudah dijawab sebelumnya ('+(a.ok?'benar':'salah')+').</p>';
  else if(q.tipe==='pg') h+=q.opsi.map((o,i)=>optBtn(i,o,R,k,rv)).join('');
  else if(q.tipe==='pq') h+='<div class="pq"><div><span class="sm">P</span>'+txt(q.p)+'</div><div><span class="sm">Q</span>'+txt(q.q)+'</div></div>'+pqList(q).map((o,i)=>optBtn(i,o,R,k,rv)).join('');
  else if(q.tipe==='cukup') h+='<div class="pern">'+q.pern.map((p,i)=>'<p><b>'+ckLab(q)[i]+'</b> '+txt(p)+'</p>').join('')+'</div>'+ckList(q).map((o,i)=>optBtn(i,o,R,k,rv)).join('');
  else if(q.tipe==='bs') h+='<div class="bs">'+q.bs.map((b,i)=>'<div class="bsr'+(rv?(a.bs[i]===b.benar?' good':' wrong'):'')+'"><span class="grow">'+txt(b.teks)+'</span>'+[true,false].map(v=>'<button data-action="bs" data-v="'+i+':'+(v?1:0)+'" class="'+(a.bs[i]===v?'sel':'')+(rv&&b.benar===v?' key':'')+'"'+(rv?' disabled':'')+'>'+(v?'Benar':'Salah')+'</button>').join('')+'</div>').join('')+'</div>';
  else h+='<div class="isi"><input id="isian" inputmode="decimal" autocomplete="off" placeholder="jawaban angka" value="'+esc(a.is)+'"'+(rv?' disabled':'')+'><span class="sm">Desimal pakai koma, tanpa satuan.</span></div>';
  h+='</div>';
  if(rv||a.prev) h+=pembahasan(q,a);
  const last=k===n-1, allDone=R.A.every(x=>x.done);
  h+='<div class="btns foot">'+(k>0?'<button class="btn" data-action="prev">Sebelumnya</button>':'');
  if(R.cek==='langsung') h+=a.done?'<button class="btn pri grow" data-action="'+(last&&allDone?'selesai':'next')+'" id="pbtn">'+(last?(allDone?'Lihat hasil':'Ke soal yang belum'):'Lanjut')+'</button>':'<button class="btn pri grow" data-action="periksa" id="pbtn"'+(isAns(q,a)?'':' disabled')+'>Periksa</button>';
  else h+='<button class="btn pri grow" data-action="'+(last?'selesai':'next')+'" id="pbtn">'+(last?'Selesai dan periksa':'Lanjut')+'</button>';
  h+='</div>';
  return h;
}
function pembahasan(q,a){
  let key=q.tipe==='pg'?'ABCDE'[q.kunci]+'. '+q.opsi[q.kunci]:q.tipe==='pq'?pqList(q)[q.kunci]:q.tipe==='cukup'?ckList(q)[q.kunci]:q.tipe==='bs'?q.bs.map((b,i)=>(i+1)+' '+(b.benar?'Benar':'Salah')).join(' · '):fmt(q.kunciNum);
  let h='<div class="card pb '+(a.ok?'good':'wrong')+'"><b>'+(a.ok?'Benar':'Belum tepat')+'</b><p class="kunci">Kunci: '+mx(key)+'</p>';
  if(q.langkah.length) h+='<ol class="steps">'+q.langkah.map(s=>'<li>'+mx(s)+'</li>').join('')+'</ol>';
  if(q.jebakan) h+='<p class="sm"><b>Jebakan:</b> '+mx(q.jebakan)+'</p>';
  h+='<p class="meta">'+jbadge(q.jenis)+' Kemampuan: '+esc(q.kem||'–')+(q.bl?' · Bentuk lama terdekat: '+esc(q.bl):'')+(q.diubah&&q.diubah!=='-'?' · Yang diubah: '+esc(q.diubah):'')+'</p></div>';
  return h;
}
function viewHasil(){
  const R=V.hasil, n=R.items.length, ok=R.A.filter(a=>a.ok).length, tot=R.T.reduce((s,x)=>s+x,0), tg=R.items.reduce((s,it)=>s+SUB[it.q.sub].dtk*1000,0);
  let h='<header class="top run"><a class="btn sm" href="#beranda">‹ Beranda</a><span class="grow mid"><span class="lbl">'+esc(R.label)+'</span></span><span class="cd" style="visibility:hidden">0</span></header>';
  h+='<div class="card score"><div><b class="big">'+ok+'/'+n+'</b><span class="sm">benar ('+pct(ok,n)+'%)</span></div><div><b class="big">'+mmss(tot)+'</b><span class="sm">waktu · target '+mmss(R.limit||tg)+'</span></div></div>';
  const js=['lama','geser','baru','varian'].map(j=>({j,l:R.items.map((it,i)=>({it,a:R.A[i]})).filter(x=>x.it.q.jenis===j)})).filter(x=>x.l.length);
  if(js.length>1) h+='<div class="card">'+js.map(x=>'<div class="srow"><div class="grow">'+jbadge(x.j)+bar(pct(x.l.filter(y=>y.a.ok).length,x.l.length))+'</div><div class="sv"><b>'+x.l.filter(y=>y.a.ok).length+'/'+x.l.length+'</b></div></div>').join('')+'</div>';
  h+='<h2>Pembahasan</h2>'+R.items.map((it,i)=>{ const q=it.q, a=R.A[i], slow=R.T[i]>SUB[q.sub].dtk*1500;
    return '<details class="card rev '+(a.ok?'good':'wrong')+'"><summary><span class="num">'+(i+1)+'</span>'+badge(q.sub)+'<span class="grow snip1">'+esc(q.perintah.slice(0,70))+'</span><span class="sm">'+(a.ok?'benar':'salah')+' · '+Math.round(R.T[i]/1000)+' dtk'+(slow?' (lambat)':'')+'</span></summary>'+
    q.teks.map(p=>'<p>'+txt(p)+'</p>').join('')+tabel(q.tabel)+'<p class="ask">'+txt(q.perintah)+'</p>'+
    (q.tipe==='pg'?'<ul class="ol">'+q.opsi.map((o,j)=>'<li class="'+(j===q.kunci?'k':a.c===j?'x':'')+'"><b>'+'ABCDE'[j]+'.</b> '+mx(o)+(q.alasan&&q.alasan[j]&&j!==q.kunci?'<span class="why">'+mx(q.alasan[j])+'</span>':'')+'</li>').join('')+'</ul>':q.tipe==='pq'?'<p>P: '+txt(q.p)+'<br>Q: '+txt(q.q)+'</p>':q.tipe==='cukup'?'<p>'+ckLab(q)[0]+' '+txt(q.pern[0])+'<br>'+ckLab(q)[1]+' '+txt(q.pern[1])+'</p>':q.tipe==='bs'?'<ul class="ol">'+q.bs.map(b=>'<li>'+mx(b.teks)+' <b>('+(b.benar?'Benar':'Salah')+')</b></li>').join('')+'</ul>':'<p class="sm">Jawabanmu: '+esc(a.is||'kosong')+'</p>')+
    pembahasan(q,a)+'</details>'; }).join('');
  h+='<div class="btns foot"><a class="btn pri grow" href="#beranda">Selesai</a>'+(R.A.some(a=>!a.ok)?'<a class="btn" href="#salah">Lihat soal salah</a>':'')+'</div>';
  return h;
}
function klLbl(K){ const g=K.game&&GMAP[K.game]; return '<span class="lbl'+(g&&!g.yk?' w':'')+'" style="--lc:'+(g?g.c:'var(--yellow)')+'">'+esc(K.title)+'</span>'; }
function klKey(it){ return it.opsi?LTR[it.kunci]+'. '+it.opsi[it.kunci]:fmt(it.kunci); }
function viewKilat(){
  const K=V.kl, tgt=K.limit||20, back=K.game?'#game':'#beranda';
  if(K.done){ const ok=K.res.filter(r=>r.ok).length, n=K.res.length, avg=n?K.res.reduce((s,r)=>s+r.ms,0)/n/1000:0;
    return '<header class="top run"><button class="btn sm" data-action="klclose">‹ Kembali</button><span class="grow mid">'+klLbl(K)+'</span><span class="cd" style="visibility:hidden">0</span></header><div class="card score"><div><b class="big">'+ok+'/'+n+'</b><span class="sm">benar</span></div><div><b class="big">'+avg.toFixed(1).replace('.',',')+'</b><span class="sm">detik per soal · target '+tgt+'</span></div></div>'+
    (K.res.some(r=>!r.ok)?'<h2>Yang salah</h2>'+K.res.filter(r=>!r.ok).map(r=>'<div class="card">'+(r.it.html||'<p class="ask">'+mx(r.it.perintah)+'</p>')+'<p class="kunci">Kunci: '+mx(klKey(r.it))+'</p><ol class="steps">'+r.it.langkah.map(s=>'<li>'+mx(s)+'</li>').join('')+'</ol></div>').join(''):'')+
    '<div class="btns foot"><button class="btn pri grow" data-action="klclose">Selesai</button><button class="btn" data-action="'+(K.game?'game':'kilat')+'" data-v="'+(K.game||'')+'">Main lagi</button></div>'; }
  const it=K.items[K.i], n=K.items.length, rv=!!K.fb;
  let h='<header class="top run"><button class="btn sm" data-action="klstop">‹ Selesai</button><span class="grow mid">'+klLbl(K)+'</span><span class="cd" id="kt">'+(K.limit?K.limit+' dtk':'0 dtk')+'</span></header>'+bar(pct(K.i,n));
  const gv=K.game&&GV[K.game];
  if(gv) h+='<div class="gstage">';
  h+='<div class="card kl'+(it.html||gv?' wide':'')+(K.game?' gm g-'+K.game:'')+(K.fb?(K.fb.ok?' good':' wrong'):'')+'"><span class="sm">Soal '+(K.i+1)+' dari '+n+(it.jenis&&it.jenis!=='maju'?' · '+(it.jenis==='balik'?'dibalik arah':'estimasi'):'')+'</span>'+(gv?gv(it,K,rv):it.html?'<div class="klh">'+it.html+'</div>':'<p class="klq'+(it.opsi?' sm2':'')+'">'+mx(it.perintah)+'</p>');
  if(it.opsi&&!gv){ h+='<div class="klo">'+it.opsi.map((o,i)=>{ let c='opt'; if(rv&&i===it.kunci) c+=' good'; else if(rv&&K.pick===i) c+=' wrong'; return '<button class="'+c+'" data-action="klpick" data-v="'+i+'"'+(rv?' disabled':'')+'><span class="lt">'+LTR[i]+'</span><span class="grow">'+mx(o)+'</span></button>'; }).join('')+'</div>'; }
  if(K.fb) h+='<p class="kunci">'+(K.fb.ok?'Benar':(K.fb.timeout?'Waktu habis. ':'')+'Kunci: '+mx(klKey(it)))+'</p>'+(K.fb.ok?'':'<ol class="steps">'+it.langkah.map(s=>'<li>'+mx(s)+'</li>').join('')+'</ol>')+'<button class="btn pri block" data-action="klnext" id="pbtn">Lanjut</button>';
  else if(gv&&it.kp) h+=keypad(K,it);
  else if(!it.opsi&&!gv) h+='<div class="isi"><input id="klans" inputmode="decimal" autocomplete="off" placeholder="jawaban" value="'+esc(K.ans)+'"><button class="btn" data-action="klneg" aria-label="Ganti tanda">±</button></div><button class="btn pri block" data-action="klcheck" id="pbtn"'+(isNaN(parseNum(K.ans))?' disabled':'')+'>Periksa</button>';
  return h+'</div>'+(gv?'</div>':'');
}

function render(){
  let r=route(), h, full=false;
  if(r==='main'){ if(V.run){ h=viewRun(); full=true; } else if(V.kl){ h=viewKilat(); full=true; } else if(V.hasil){ h=viewHasil(); full=true; } else { r='beranda'; } }
  if(!h) h=r==='game'?viewGame():r==='soal'?viewSoal():r==='salah'?viewSalah():r==='progres'?viewProgres():viewBeranda();
  $('#view').innerHTML=(full?'':appbar()+(hero(r)||'<div class="gap"></div>'))+h; $('#nav').hidden=full;
  document.querySelectorAll('#view .card').forEach(c=>{ if(c.tagName!=='DETAILS') c.insertAdjacentHTML('afterbegin',STUDS); });
  const LC=['','g','b','o']; let li=0;
  document.querySelectorAll('#view > h2').forEach(t=>{ const n=t.nextElementSibling; if(!n||n.tagName!=='DIV'||!n.classList.contains('card')||n.classList.contains('score')) return;
    const l=document.createElement('span'); l.className='lbl '+LC[li++%4]; l.innerHTML=t.innerHTML; n.insertBefore(l,n.querySelector(':scope > :not(.st)')); n.classList.add('has-lbl'); t.remove(); });
  const ns=salahList().length;
  $('#nav').innerHTML=NAV.map(x=>'<a href="#'+x[0]+'" class="'+(r===x[0]?'on ':'')+(x[0]==='beranda'?'yk':'')+'" style="--c:'+x[2]+'">'+svgI(x[3])+'<span>'+x[1]+'</span>'+(x[0]==='salah'&&ns?'<i>'+ns+'</i>':'')+'</a>').join('');
  const f=$('#klans')||(V.run&&!V.run.A[V.run.cur].done?$('#isian'):null); if(f&&!('ontouchstart' in window)) f.focus();
}

/* ---------- Aksi ---------- */
function act(a,v){
  const R=V.run, K=V.kl, Z=V.soal;
  if(a!=='reset') V.prog.reset=false;
  if(a==='kilat') startKilat();
  else if(a==='gosoal'){ Z.tab='harian'; Z.tgl=ymd(new Date()); Z.res=null; go('soal'); }
  else if(a==='gosim'){ Z.tab=v; Z.res=null; go('soal'); }
  else if(a==='mulai'){ const st=S.sets.find(x=>x.id===v); if(st) startSet(st); }
  else if(a==='resume'){ const o=loadSesi(); if(o){ V.run=o; V.hasil=null; go('main'); } }
  else if(a==='ulang') startUlang(salahList());
  else if(a==='ulang1'){ const it=findQ(v); if(it) startUlang([it]); }
  else if(a==='varian'){ const it=findQ(v); if(it) copyText(promptVarian(it.q,it.set),'Prompt varian disalin. Tempel hasilnya di Set soal.'); }
  else if(a==='paham'){ S.lunas[v]=Date.now(); save(); render(); }
  else if(a==='tab'){ Z.tab=v; Z.res=null; render(); }
  else if(a==='tgl'){ Z.tgl=v; render(); }
  else if(a==='copy'){ copyText($('#promptbox').value,'Prompt disalin. Jalankan di Claude.'); }
  else if(a==='acak'){ if(Z.tab==='harian') buildResep(Z.tgl,fromYmd(Z.tgl),PLAN.harian,'harian'); else resepSim(Z.tab,true); render(); toast('Resep diacak ulang.'); }
  else if(a==='simpan'){ Z.paste=$('#paste').value; const res=parseSet(Z.paste); if(res.err.length){ Z.res=res; } else { addSet(res.set); Z.paste=''; Z.res={ok:res.set.label+' tersimpan: '+res.set.soal.length+' soal.',warn:res.warn}; } render(); }
  else if(a==='hapus'){ if(V._del===v){ S.sets=S.sets.filter(x=>x.id!==v); V._del=null; save(); render(); } else { V._del=v; toast('Tekan × sekali lagi untuk menghapus set ini.'); } }
  else if(a==='cek'){ S.cek=S.cek==='langsung'?'akhir':'langsung'; save(); render(); }
  else if(a==='tema'){ S.tema=S.tema==='terang'?'gelap':S.tema==='gelap'?'auto':'terang'; applyTema(); save(); render(); }
  else if(a==='ulas'){ S.ulas=S.ulas===false; save(); render(); }
  else if(a==='semua'){ S.semua=!S.semua; save(); render(); }
  else if(a==='ekspor'){ copyText(JSON.stringify(S),'Data disalin.'); }
  else if(a==='reset'){ if(V.prog.reset){ S=Object.assign(fresh(),{tema:S.tema}); V.prog.reset=false; clearSesi(); save(); toast('Semua data dihapus.'); } else V.prog.reset=true; render(); }
  else if(R&&a==='pick'){ if(R.A[R.cur].done) return; R.A[R.cur].c=+v; persist(); render(); }
  else if(R&&a==='bs'){ if(R.A[R.cur].done) return; const [i,b]=v.split(':'); R.A[R.cur].bs[+i]=b==='1'; persist(); render(); }
  else if(R&&a==='periksa'){ tick(R); recordAt(R.cur); save(); persist(); render(); }
  else if(R&&(a==='next'||a==='prev'||a==='ke')){ tick(R); const n=R.items.length; let to=a==='ke'?+v:a==='prev'?R.cur-1:R.cur+1; if(a==='next'&&to>=n){ to=R.A.findIndex(x=>!x.done); if(to<0) to=n-1; } R.cur=Math.max(0,Math.min(n-1,to)); R.t0=Date.now(); persist(); render(); window.scrollTo(0,0); }
  else if(R&&a==='selesai'){ finishRun(); }
  else if(R&&a==='keluar'){ tick(R); persist(); V.run=null; go('beranda'); toast('Sesi disimpan. Lanjutkan dari Beranda.'); }
  else if(K&&a==='klcheck') kilatCheck();
  else if(K&&a==='klpick') kilatCheck(v);
  else if(K&&a==='kp') kpPress(v);
  else if(K&&a==='gx'){ if(K.fb) return; const f=GX[K.game]; if(f) f(K.items[K.i],K,v); if(!K.fb) render(); }
  else if(a==='game') startGame(v);
  else if(K&&a==='klnext') kilatNext();
  else if(K&&a==='klneg'){ const i=$('#klans'); K.ans=i.value.trim().startsWith('-')||i.value.trim().startsWith('−')?i.value.trim().slice(1):'−'+i.value.trim(); render(); }
  else if(K&&a==='klstop'){ if(K.res.length){ K.done=true; render(); } else { const g=K.game; V.kl=null; go(g?'game':'beranda'); } }
  else if(a==='klclose'){ const g=V.kl&&V.kl.game; V.kl=null; go(g?'game':'beranda'); }
}
document.addEventListener('click',e=>{ const b=e.target.closest('[data-action]'); if(!b||b.disabled) return; if(b.tagName!=='A') e.preventDefault(); act(b.dataset.action,b.dataset.v); });
document.addEventListener('input',e=>{ const t=e.target;
  if(t.id==='isian'&&V.run){ V.run.A[V.run.cur].is=t.value; const p=$('#pbtn'); if(p&&V.run.cek==='langsung') p.disabled=isNaN(parseNum(t.value)); persist(); }
  else if(t.id==='klans'&&V.kl){ V.kl.ans=t.value; const p=$('#pbtn'); if(p) p.disabled=isNaN(parseNum(t.value)); }
  else if(t.id==='paste') V.soal.paste=t.value; });
document.addEventListener('keydown',e=>{ if(V.kl&&!V.kl.fb&&route()==='main'&&document.querySelector('.kpad')&&e.target.tagName!=='INPUT'){ if(/^[0-9]$/.test(e.key)){ kpPress(e.key); return; } if(e.key==='Backspace'){ kpPress('⌫'); return; } if(e.key==='-'){ kpPress('±'); return; } }
  if(e.key!=='Enter'||e.target.tagName==='TEXTAREA') return; const p=$('#pbtn'); if(p&&!p.disabled&&route()==='main'){ e.preventDefault(); p.click(); } });
window.addEventListener('hashchange',()=>{ if(route()!=='main'){ if(V.run){ tick(V.run); persist(); V.run=null; } V.kl=null; V.hasil=null; } render(); });
setInterval(()=>{ const R=V.run, K=V.kl;
  if(R&&route()==='main'){ const el=$('#tm'), left=timeLeft(R); if(left!=null){ if(left<=0){ finishRun(); toast('Waktu habis.'); return; } if(el){ el.textContent=mmss(left); el.classList.toggle('late',left<60000); } }
    else if(el){ const a=R.A[R.cur], ms=R.T[R.cur]+(a.done?0:Date.now()-R.t0); el.textContent=mmss(ms); el.classList.toggle('late',!a.done&&ms>SUB[R.items[R.cur].q.sub].dtk*1000); } }
  if(K&&!K.done&&!K.fb&&route()==='main'){ const el=$('#kt'), s=(Date.now()-K.t0)/1000; if(K.limit){ if(s>=K.limit){ kilatCheck(null,true); return; } if(el){ el.textContent=Math.ceil(K.limit-s)+' dtk'; el.classList.toggle('late',K.limit-s<5); } } else if(el){ el.textContent=Math.round(s)+' dtk'; el.classList.toggle('late',s>20); } }
},500);
if(typeof module!=='undefined'&&module.exports) module.exports={get V(){return V;},startGame,kilatMix,GAMES,pqItem,ckItem,kisiItem,barisanItem,estimItem,mesinItem,balikItem,tahapInfo,poolUnits,oldUnits,openUnits,fokusUnits,kilatGens,tahap,S,buildResep,resepHarian,resepSim,promptSet,promptVarian,parseSet,addSet,tasksOn,kilatSet,PLAN,findQ,salahList,viewBeranda,viewSoal,viewSalah,viewProgres};
else { try{ $('#scene').innerHTML=sceneHTML(); }catch(e){} applyTema(); save(); render(); }
</script>
</body>
