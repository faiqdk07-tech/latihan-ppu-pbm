:root[data-theme="dark"] .gsheet{background:var(--surface);color:var(--ink)}
/* ===== v12: soal bentuk baru sebagai permainan ===== */
.gq{font-family:var(--f-disp);font-size:17px;color:#26304b;text-align:center;margin:0}
.gq em{font-style:normal;font-family:var(--f-ui);font-size:11px;font-weight:700;color:#fff;background:var(--orange);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.gq.sm{font-size:15px;color:var(--ink)}
.gstage.vx{display:flex;flex-direction:column;gap:12px;min-height:0}
.gstage,.strip,.pzp,.vgate,.vstrip{-webkit-user-select:none;user-select:none}
.gstage.vx.arena.lplate,.gstage.vx.mat,.gstage.vx.sky{min-height:0}
.gi-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.gi-chips span{font-size:12px;font-weight:700;background:var(--sunk);border-radius:6px;padding:3px 8px;color:var(--ink)}.gi-chips span.new{background:var(--orange);color:#fff}
.vlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.vlist li{display:flex;gap:8px;align-items:flex-start;background:#fff;border:2px solid var(--pl);border-radius:10px;padding:7px 9px;font-size:13.5px;line-height:1.45;color:#26304b}
.nbk{flex:none;min-width:24px;height:22px;border-radius:5px;background:var(--c);color:#fff;font-family:var(--f-disp);font-weight:400;font-size:13px;display:grid;place-items:center;border:2px solid color-mix(in srgb,var(--c) 60%,#1f2a4d)}
.vtw{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vtwr{display:flex;gap:4px;justify-content:center;padding:14px 6px 10px;background:rgba(255,255,255,.7);border:2px dashed #9fb6dc;border-radius:12px;cursor:pointer;font:inherit}
.vtwr i{position:relative;font-style:normal;width:30px;height:26px;border-radius:6px;background:var(--c);color:#fff;font-family:var(--f-disp);display:grid;place-items:center;border:2px solid color-mix(in srgb,var(--c) 60%,#1f2a4d);box-shadow:0 3px 0 color-mix(in srgb,var(--c) 65%,#1f2a4d)}
.vtwr i::before{content:"";position:absolute;top:-7px;left:50%;margin-left:-6px;width:12px;height:5px;background:var(--c);border:2px solid color-mix(in srgb,var(--c) 60%,#1f2a4d);border-bottom:0;border-radius:3px 3px 0 0}
.vtwr:active:not([disabled]){transform:translateY(2px)}
.vtwr.ok{border-style:solid;border-color:var(--green);background:#e2f2e8;animation:gpop .4s}
.vtwr.bad{border-style:solid;border-color:var(--red);background:#fff1f0}.vtwr.dim{opacity:.45}
.vtwr.fall i{animation:vfall .7s ease-in forwards}.vtwr.fall i:nth-child(even){--r:-30deg}
@keyframes vfall{to{transform:translateY(12px) rotate(var(--r,30deg));opacity:.55}}
.vnew{animation:bhop 2.2s ease-in-out infinite}
.vgap{width:100%;min-height:30px;border:2px dashed #9fb6dc;border-radius:9px;background:rgba(255,255,255,.6);color:#7088b5;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.vgap:active{background:#fff6bf;border-color:#c9971a}
.vgap.bad{border-color:var(--red);color:var(--red);background:#fff1f0;min-height:22px;display:grid;place-items:center}
.gfloor.vin{animation:gdrop .5s cubic-bezier(.3,1.4,.5,1)}
.vboard{background:#fffdf6;border:2px solid #c98b4e;border-radius:10px;padding:10px 11px;line-height:1.75;font-size:14.5px;color:#26304b;box-shadow:0 4px 0 #8a5a2b}
.vsent{display:inline;font:inherit;color:inherit;text-align:left;background:none;border:0;padding:1px 2px;border-radius:4px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
button.vsent:active{background:#ffe7e5}
.vsent.ok,.vsent.caught{background:#fde2e0;box-shadow:inset 0 -2px 0 var(--red)}
.vsent.bad,.vsent.wrong{text-decoration:line-through;text-decoration-color:var(--muted);color:#7a849b}
.vsent.leak{background:#fde2e0;outline:2px dashed var(--red)}
.vsent.wait{color:#a3aec6}
.vgate{--c:var(--sky);display:flex;gap:8px;align-items:flex-end;animation:gwalk .4s ease-out;touch-action:pan-y}
.vgate .vwho{flex:none;width:58px;height:62px}.vgate .bchar{width:58px;height:58px;animation:bhop 2.4s ease-in-out infinite}
.vgate .vbub{margin-bottom:10px}
.vqueue{display:flex;gap:5px;justify-content:center}.vqueue i{width:10px;height:10px;border-radius:3px;background:#fff;border:1.5px solid var(--line2)}.vqueue i.ok{background:var(--green)}.vqueue i.bad{background:var(--red)}.vqueue i.now{background:var(--yellow);transform:scale(1.3)}
.pzs{display:flex;flex-direction:column;gap:16px;transition:gap .3s}
.pz{position:relative;background:#fff;color:#26304b;border:2px solid var(--pl);border-radius:10px;padding:11px 12px;font-size:15px;font-weight:600;line-height:1.45;text-align:center}
.pz.a::after,.pz.b::before{content:"";position:absolute;left:50%;width:26px;height:13px;margin-left:-13px;background:inherit;border:2px solid var(--pl);z-index:1}
.pz.a::after{bottom:-13px;border-top:0;border-radius:0 0 13px 13px}
.pz.b::before{top:-13px;border-bottom:0;border-radius:13px 13px 0 0}
.pz.slot{border-style:dashed;border-color:#b9b0e8;background:rgba(255,255,255,.55);color:var(--purple);font-family:var(--f-disp);min-height:46px;display:grid;place-items:center}
.pz.slot.over{background:#efeaff;border-style:solid}
.pz.k{background:var(--purple);color:#fff;border-color:color-mix(in srgb,var(--purple) 60%,#1f2a4d);font-family:var(--f-disp);font-weight:400;font-size:17px;animation:gpop .35s}
.pz.k.key{background:var(--green);border-color:#2e8a52}
.pzs.locked{gap:0}
.pzs.locked .pz{border-radius:0;border-color:#2e8a52;animation:pzsnap .4s ease-out}
.pzs.locked .pz.a{border-radius:10px 10px 0 0;border-bottom-width:0}.pzs.locked .pz.b{border-radius:0 0 10px 10px;border-top-width:0}
.pzs.locked .pz.a::after,.pzs.locked .pz.b::before{display:none}
.pzs.locked .pz.k{background:var(--green)}
@keyframes pzsnap{0%{transform:scaleY(1.06)}100%{transform:none}}
.vtray{display:flex;flex-wrap:wrap;gap:16px 10px;justify-content:center;padding-top:8px}
.pzp{position:relative;min-width:92px;padding:10px 14px;border-radius:9px;background:var(--purple);color:#fff;border:2px solid color-mix(in srgb,var(--purple) 60%,#1f2a4d);box-shadow:0 4px 0 color-mix(in srgb,var(--purple) 65%,#1f2a4d);font-family:var(--f-disp);font-size:16px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.pzp::before,.pzp::after{content:"";position:absolute;left:50%;margin-left:-9px;width:18px;height:8px;background:inherit;border:2px solid color-mix(in srgb,var(--purple) 60%,#1f2a4d)}
.pzp::before{top:-10px;border-bottom:0;border-radius:9px 9px 0 0}.pzp::after{bottom:-10px;border-top:0;border-radius:0 0 9px 9px}
.pzp.lifted{opacity:.3}
.vrel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vrb,.vcard{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 10px;min-height:52px;background:#fff;border:2px solid var(--pl);border-radius:11px;box-shadow:0 3px 0 var(--sh);font:inherit;font-weight:700;font-size:14px;color:#26304b;cursor:pointer;text-align:center}
.vrb span{font-size:20px}
.vrb:active:not([disabled]),.vcard:active:not([disabled]){transform:translateY(3px);box-shadow:none}
.vrb.ok,.vcard.ok{background:#e2f2e8;border-color:var(--green)}.vrb.bad,.vcard.bad{background:#fbe7e6;border-color:var(--red)}.vrb.dim,.vcard.dim{opacity:.45}
.vcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vchain{display:flex;flex-direction:column;gap:8px}
.vlink{background:#fff;border:2px solid var(--pl);border-radius:10px;padding:9px 10px;font-size:14px;line-height:1.8;color:#26304b}
.pzk{display:inline-block;font:inherit;font-family:var(--f-disp);font-size:14.5px;line-height:1.5;color:#fff;background:var(--purple);border:2px solid color-mix(in srgb,var(--purple) 60%,#1f2a4d);border-radius:7px;padding:0 8px;cursor:pointer;box-shadow:0 2px 0 color-mix(in srgb,var(--purple) 65%,#1f2a4d);transition:transform .25s}
.pzk.broken{background:#8d97ad;border-color:#4d566b;transform:rotate(-8deg) translateY(-3px);text-decoration:line-through}
.pzk.ok{background:var(--green);border-color:#2e8a52;animation:gpop .4s}
.pzk[disabled]{cursor:default}
.lbk.one{--c:var(--blue);animation:lmerge .45s cubic-bezier(.3,1.5,.5,1)}
.lbk.one.g{--c:var(--green)}.lbk.n{--c:var(--blue)}
@keyframes lmerge{0%{transform:scaleX(.75)}60%{transform:scaleX(1.06)}100%{transform:none}}
.lset.res{display:flex;justify-content:center;gap:12px;padding:16px 0 4px}
.vsets{display:flex;flex-direction:column;gap:12px;width:100%}
.vset{display:flex;justify-content:center;gap:10px;padding:18px 6px 10px;background:rgba(255,255,255,.65);border:2px dashed #b9c6de;border-radius:12px;cursor:pointer;font:inherit}
.vset .lbk{font-size:19px;padding:10px 12px 9px}
.vset.ok{border-style:solid;border-color:var(--green);background:#e2f2e8}.vset.bad{border-color:var(--red)}.vset.dim{opacity:.5}
.gstage.arena.vx{justify-content:flex-start}
.vstrips{display:flex;flex-direction:column;gap:10px}
.vstrip{background:#fffdf3;border:2px solid #d9cfa8;border-radius:4px;padding:11px 12px;font:inherit;font-size:15px;font-weight:600;color:#26304b;text-align:left;box-shadow:0 3px 0 rgba(0,0,0,.15);cursor:pointer}
.vstrip.ok{border-color:var(--green);background:#e2f2e8}.vstrip.bad{border-color:var(--red);background:#fbe7e6}.vstrip.dim{opacity:.5}
.vstrip.big{font-size:17px;padding:20px 14px;animation:gpopin .3s;touch-action:pan-y;cursor:grab}
.vdone{display:flex;gap:6px;justify-content:center;min-height:22px}.vdone span{width:26px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:12px;color:#fff}.vdone .ok{background:var(--green)}.vdone .bad{background:var(--red)}
.strip{touch-action:none}
.gsc{position:fixed;z-index:70;pointer-events:none;font-size:30px;transform:translate(-50%,-60%) rotate(-90deg);filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.gslash{position:fixed;z-index:69;pointer-events:none;height:3px;background:var(--red);border-radius:2px;transform-origin:left;animation:gslash .35s ease-out forwards}
@keyframes gslash{from{transform:scaleX(0);opacity:1}to{transform:scaleX(1);opacity:0}}
.vcrates{display:flex;flex-direction:column;gap:12px}
.vcrate{position:relative;text-align:left;background-color:#e8c896;background-image:repeating-linear-gradient(0deg,transparent 0 17px,rgba(125,86,52,.22) 17px 19px);border:2px solid #9a6b3a;border-radius:6px;padding:12px;font:inherit;font-size:14.5px;font-weight:600;color:#3b2a14;box-shadow:0 4px 0 #7d5634;cursor:pointer}
.vcrate:active:not([disabled]){transform:translateY(3px);box-shadow:none}
.vcrate em{position:absolute;right:8px;top:-11px;font-style:normal;font-family:var(--f-disp);font-size:13px;color:#fff;background:var(--red);border-radius:5px;padding:1px 7px;transform:rotate(6deg)}
.vcrate.ok em{background:var(--green)}
.vcrate.ok{outline:3px solid var(--green)}.vcrate.bad{outline:3px solid var(--red)}.vcrate.dim{opacity:.7}
.vcrate s{text-decoration-color:var(--red);text-decoration-thickness:2px}
.gw.lb.wrongpick{background:#fbe7e6;border-color:var(--red)}

/* ================= Balok permainan v3: lego seragam, ukuran normal ================= */
/* area game lebih lebar di layar besar, ukuran huruf normal */
body[data-r="game"] .app{max-width:600px!important}
body[data-r="game"] .gq{font-size:19px}
body[data-r="game"] .gq.sm{font-size:16px}
body[data-r="game"] .gtip{font-size:13.5px}
body[data-r="game"] .ghint{font-size:14px;padding:9px 12px}
body[data-r="game"] .gsheet p{font-size:15px}
body[data-r="game"] .gsheet>b{font-size:21px}
body[data-r="game"] .gcount{font-size:13px}
body[data-r="game"] .gtalk,body[data-r="game"] .vbub{font-size:15px;line-height:1.5}
body[data-r="game"] .vlist li{font-size:14.5px;padding:9px 11px}
body[data-r="game"] .vsign b{font-size:18px}
body[data-r="game"] .vsign small{font-size:12.5px}
body[data-r="game"] .shop-sign{font-size:17px;padding:5px 14px}
body[data-r="game"] .gbtn{min-height:54px;font-size:18px}
body[data-r="game"] .gw{font-size:17px;padding:6px 11px}
body[data-r="game"] .gstage{padding:18px}
body[data-r="game"] .gstage.sky{padding:16px 16px 0}

/* balok lego: satu warna utuh (badan + tonjolan), tepi sedikit lebih gelap dari warnanya sendiri */
.bk,.gfloor.full{--b:color-mix(in srgb,var(--c) 58%,#fff);--e:color-mix(in srgb,var(--c) 86%,#000)}
.bk{--c:var(--blue);position:relative;display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;padding:12px 11px 12px 14px;text-align:left;font:inherit;font-size:15px;font-weight:600;line-height:1.5;color:#26304b;background:var(--b);border:2px solid var(--e);border-radius:9px;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 5px 0 var(--e);cursor:grab;-webkit-user-select:none;user-select:none;transition:transform .15s,box-shadow .15s}
.bk::before,.bk::after,.gfloor.full::before,.gfloor.full::after{content:"";position:absolute;top:-11px;width:26px;height:9px;background:var(--b);border:2px solid var(--e);border-bottom:0;border-radius:7px 7px 0 0;box-shadow:inset 0 2px 0 rgba(255,255,255,.45)}
.bk::before,.gfloor::before{left:20px}.bk::after,.gfloor::after{left:62px}
.bk .tx{flex:1;min-width:0}
.grip{flex:none;align-self:stretch;width:20px;min-height:30px;border-radius:5px;background:radial-gradient(circle,rgba(38,48,75,.28) 1.8px,transparent 2.3px) 1px 3px/9px 9px;touch-action:none}
.bk:active:not([disabled]){transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 2px 0 var(--e)}
.gpc.bk{border:2px solid var(--e);background:var(--b);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 5px 0 var(--e);padding:12px 11px 12px 14px;font-size:15px}
.gpc.bk.sel{transform:translateY(-5px);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 9px 0 var(--e),0 14px 18px rgba(31,42,77,.16);outline:3px solid #fff;outline-offset:0}
.gpc.bk.lifted{opacity:.25}
.gpool2.bkpool{gap:8px;padding:6px 2px 2px}
.gghost{border-color:var(--e,var(--pl))!important}

/* menara: lantai terisi = balok yang sama, lantai kosong = cetakan */
.gtower2{gap:6px}
.gtower2 .gfloor{margin-top:11px}
.gfloor{padding:10px 12px;min-height:50px;gap:10px;align-items:center}
.gfloor p{font-size:15px;line-height:1.5}
.gfloor span{width:28px;height:28px;font-size:14px;border-radius:7px}
.gfloor.full{background:var(--b);color:#26304b;border:2px solid var(--e);border-radius:9px;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 5px 0 var(--e)}
.gfloor.full p{font-weight:600}
.gfloor.full span{background:rgba(255,255,255,.75);border-color:var(--e)}
.gfloor.empty::before,.gfloor.empty::after{content:"";position:absolute;top:-11px;width:26px;height:9px;border-radius:7px 7px 0 0;background:rgba(159,182,220,.35)}
.gfloor.empty{min-height:58px;background:rgba(255,255,255,.55)}
.gfloor.empty.ready{background:#fff}
.gfloor.empty.ready::before,.gfloor.empty.ready::after{background:color-mix(in srgb,var(--blue) 35%,#fff)}
.gfloor.empty.over{background:#eef4ff;border:2px solid var(--blue);transform:scale(1.02)}
.gfloor.miss::before,.gfloor.miss::after{display:none}
.vnew.gfloor.full{cursor:grab;touch-action:none}
.vnew .grip{margin-left:auto}
.vnew.lifted{opacity:.3;animation:none}
.vgap{min-height:38px;font-size:13.5px;transition:all .15s}
.vgap.over{min-height:58px;background:#fff8d6;border:2px solid #d9b13a;color:#8a6a12}
.vtwr{padding:16px 8px 12px}

/* zona taruh */
.gdrop{--c:var(--blue);display:flex;align-items:center;justify-content:center;gap:10px;min-height:62px;padding:8px 12px;border:2px dashed color-mix(in srgb,var(--c) 45%,#fff);border-radius:14px;background:rgba(255,255,255,.6);color:color-mix(in srgb,var(--c) 60%,#26304b);font-size:14px;font-weight:700;transition:transform .15s,background .15s,border-color .15s}
.gdrop .ic{font-size:26px;line-height:1}
.gdrop.over{border-style:solid;border-color:color-mix(in srgb,var(--c) 70%,#fff);background:#fff;transform:scale(1.03)}
.gdrop.over .ic{animation:bhop .6s ease-in-out infinite}
.gdrop.jail{--c:var(--red)}.gdrop.truck{--c:#b07a45}.gdrop.gift{--c:var(--pink)}

/* Tangkap Penyusup varian 1: warga berbaris (gelembung sama seperti versi klasik) */
.vrows{display:flex;flex-direction:column;gap:10px}
.vrow{--c:var(--blue);display:flex;align-items:flex-end;gap:8px;width:100%;padding:0;border:0;background:none;font:inherit;text-align:left;cursor:grab;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.vrow .vwho.sm{width:50px;height:54px}
.vrow .vwho.sm svg{width:100%;height:100%}
.vrow .vbub{font-size:15px;position:relative;flex:1;margin:0;background:color-mix(in srgb,var(--c) 14%,#fff);border:2px solid color-mix(in srgb,var(--c) 60%,#fff);border-radius:14px 14px 14px 5px;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 45%,#fff);padding:11px 13px;font-weight:600;line-height:1.5;color:#26304b}
.vrow:active:not([disabled]) .vbub{transform:translateY(2px);box-shadow:none}
.vrow.caught .vbub{background:#fff1f0;border-color:color-mix(in srgb,var(--red) 70%,#fff);box-shadow:0 3px 0 #f3b9b5}
.vrow.miss .vbub{background:#f5f6f9;border-color:#d5dbe7;box-shadow:none;text-decoration:line-through;text-decoration-color:#a3acc0;color:#7a849b}
.vrow.dim{opacity:.6}
.vrow.lifted{opacity:.3}
.vrow .gbadge{display:inline-block;margin-left:6px}

/* Bengkel: alat bisa diseret ke meja kerja */
.gtool{touch-action:none;cursor:grab}
body[data-r="game"] .gtool{font-size:17px;min-height:54px}
.gtool.lifted{opacity:.3}
.bench-slot{min-width:96px;height:46px;transition:all .15s}
.bench-slot.over{border-style:solid;border-color:var(--green);background:#eaf6ef;color:var(--green);transform:scale(1.08)}
/* peti kayu, warnanya lembut */
.vcrates{gap:14px}
.vcrate{padding:14px 16px 13px;background-color:#e6c08c;background-image:radial-gradient(circle at 10px 10px,#b5895a 2px,transparent 2.6px),radial-gradient(circle at calc(100% - 10px) 10px,#b5895a 2px,transparent 2.6px),radial-gradient(circle at 10px calc(100% - 10px),#b5895a 2px,transparent 2.6px),radial-gradient(circle at calc(100% - 10px) calc(100% - 10px),#b5895a 2px,transparent 2.6px),repeating-linear-gradient(0deg,#e6c08c 0 23px,#d9ad74 23px 25px);border:2px solid #b5895a;border-radius:8px;box-shadow:0 5px 0 #b5895a;touch-action:pan-y;cursor:grab}
.vcrate .lbl{display:block;background:#fffaf0;border-radius:5px;padding:9px 11px;box-shadow:0 1px 0 rgba(120,80,40,.2);font-size:15px;font-weight:600;line-height:1.5;color:#3b2a14}
.vcrate.lifted{opacity:.3}
.vcrate.ok{outline:0;border-color:var(--green);box-shadow:0 5px 0 color-mix(in srgb,var(--green) 80%,#000)}
.vcrate.bad{outline:0;border-color:var(--red);box-shadow:0 5px 0 color-mix(in srgb,var(--red) 80%,#000)}

/* Pangkas: pita */
.vstrips{gap:14px}
.vstrip,.vstrip.big{--c:var(--pink);position:relative;border:0;border-radius:0;padding:15px 34px;background:color-mix(in srgb,var(--c) 28%,#fff);border-top:3px solid color-mix(in srgb,var(--c) 70%,#fff);border-bottom:3px solid color-mix(in srgb,var(--c) 70%,#fff);clip-path:polygon(0 0,100% 0,calc(100% - 16px) 50%,100% 100%,0 100%,16px 50%);box-shadow:none;font-size:15px;font-weight:600;line-height:1.5;color:#26304b;text-align:center;cursor:grab;touch-action:pan-y}
.vstrip.big{font-size:17px;padding:28px 38px}
.vstrip.ok{--c:var(--green)}.vstrip.bad{--c:var(--red)}
.vstrip.lifted{opacity:.3}
.strip{--c:var(--pink);background:color-mix(in srgb,var(--c) 22%,#fff);border:0;border-top:3px solid color-mix(in srgb,var(--c) 65%,#fff);border-bottom:3px solid color-mix(in srgb,var(--c) 65%,#fff);border-radius:0;padding:16px 28px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 50%,100% 100%,0 100%,14px 50%);box-shadow:none;row-gap:12px;column-gap:4px}
.strip.done{--c:var(--green);box-shadow:none}
.strip .gw.pc{background:#fff;border:2px solid color-mix(in srgb,var(--c) 40%,#fff);box-shadow:0 3px 0 color-mix(in srgb,var(--c) 40%,#fff);border-radius:6px;padding:5px 9px;font-size:16px}
.strip .cutl{width:6px;align-self:stretch;border:0;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 45%,#fff) 50%,transparent 50%) center/2px 6px repeat-y}
.strip .gw.must{background:#fff1f0;border-color:color-mix(in srgb,var(--red) 70%,#fff);outline:0}
.scrap .gw.cut{background:#fff;border:2px dashed color-mix(in srgb,var(--pink) 50%,#fff);opacity:.75}

/* Relasi Kilat: keping puzzle */
body[data-r="game"] .pz{font-size:15.5px;padding:12px 13px}
.pz.a{background:#eef4ff;border-color:color-mix(in srgb,var(--blue) 55%,#fff)}
.pz.b{background:#eef9f2;border-color:color-mix(in srgb,var(--green) 55%,#fff)}
.pz.a::after{background:#eef4ff;border-color:color-mix(in srgb,var(--blue) 55%,#fff)}
.pz.b::before{background:#eef9f2;border-color:color-mix(in srgb,var(--green) 55%,#fff)}
.pz.slot{border-color:color-mix(in srgb,var(--purple) 55%,#fff);min-height:56px;font-size:22px}
.pz.slot.over{background:#f3efff;transform:scale(1.03)}
.pzp{font-size:17px;padding:12px 16px;min-width:100px}
.vtray .pzp:nth-child(4n+2){--purple:#6f9be6}
.vtray .pzp:nth-child(4n+3){--purple:#e0956a}
.vtray .pzp:nth-child(4n+4){--purple:#4fb39d}
.pz.k small{display:block;font-family:var(--f-ui);font-size:12px;font-weight:700;opacity:.85;margin-top:2px}
.pz.k.over{transform:scale(1.04);box-shadow:0 0 0 4px #fff3c4}
.vrb,.vcard{--c:var(--blue);background:color-mix(in srgb,var(--c) 16%,#fff);border:2px solid color-mix(in srgb,var(--c) 55%,#fff);box-shadow:0 4px 0 color-mix(in srgb,var(--c) 55%,#fff);border-radius:12px;font-size:15px;min-height:54px;touch-action:pan-y;cursor:grab}
.vrb span{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;background:#fff;border:2px solid color-mix(in srgb,var(--c) 45%,#fff);font-size:19px}
.vrb.lifted{opacity:.3}
.vcards .vcard{--c:var(--orange)}.vcards .vcard:nth-child(2){--c:var(--blue)}.vcards .vcard:nth-child(3){--c:var(--green)}.vcards .vcard:nth-child(4){--c:var(--purple)}
.vrb.ok,.vcard.ok,.vcards .vcard.ok{--c:var(--green)}.vrb.bad,.vcard.bad,.vcards .vcard.bad{--c:var(--red)}
body[data-r="game"] .vlink{font-size:15px;padding:10px 12px}
body[data-r="game"] .pzk{font-size:15px}
.vlink.brk{border-style:dashed;border-color:color-mix(in srgb,var(--red) 60%,#fff);background:#fffafa}
.vlink.over{background:#fff8d6;border-color:#d9b13a;transform:scale(1.02)}
:root[data-theme="dark"] .bk,:root[data-theme="dark"] .gfloor.full,:root[data-theme="dark"] .vrow .vbub,:root[data-theme="dark"] .strip .gw.pc{color:#26304b}
/* balok yang sedang diseret: selalu mengambang di atas layar */
.gghost{position:fixed!important;z-index:999!important;margin:0!important;transition:none!important;animation:none!important;opacity:.97!important;cursor:grabbing!important;box-shadow:0 16px 28px rgba(31,42,77,.28)!important;outline:0!important}
.gghost.lifted{opacity:.97!important}
/* sentuhan jari langsung menyeret (tidak menggulir halaman) */
.vrow,.vcrate,.vstrip:not(.big),.vrb,.pzp,.gtool,.bk,.gpc,.vnew{touch-action:none}
/* ===== v4: ikuti tema lego aplikasi (sama seperti kartu menu Mini game) ===== */
.bk,.gpc.bk,.gfloor.full{--e:color-mix(in srgb,var(--c) 62%,#1f2a4d);--s:color-mix(in srgb,var(--c) 70%,#1f2a4d);background:var(--c);color:#fff;border:2px solid var(--e);border-radius:12px;box-shadow:0 5px 0 var(--s);font-weight:500}
.bk::before,.bk::after,.gfloor.full::before,.gfloor.full::after{top:-9px;width:18px;height:7px;background:var(--c);border:2px solid var(--e);border-bottom:0;border-radius:5px 5px 0 0;box-shadow:none}
.bk::before,.gfloor.full::before{left:14px}.bk::after,.gfloor.full::after{left:40px}
.gfloor.empty::before,.gfloor.empty::after{top:-9px;width:18px;height:7px;border-radius:5px 5px 0 0}
.gfloor.empty::before{left:14px}.gfloor.empty::after{left:40px}
.gtower2 .gfloor,.bk{margin-top:10px}
.gfloor.full p{font-weight:500}
.gfloor.full span{background:#fff;color:color-mix(in srgb,var(--c) 75%,#1f2a4d);border:2px solid var(--e)}
.bk[style*="yellow"],.bk[style*="lime"],.gfloor.full[style*="yellow"],.gfloor.full[style*="lime"]{color:var(--ink,#26304b)}
.grip{background:radial-gradient(circle,rgba(255,255,255,.55) 1.6px,transparent 2.1px) 1px 3px/9px 9px}
.bk[style*="yellow"] .grip,.bk[style*="lime"] .grip,.vnew .grip{background:radial-gradient(circle,rgba(38,48,75,.3) 1.6px,transparent 2.1px) 1px 3px/9px 9px}
.bk:active:not([disabled]){transform:translateY(4px);box-shadow:0 1px 0 var(--s)}
.gpc.bk.sel{transform:translateY(-4px);box-shadow:0 9px 0 var(--s),0 14px 18px rgba(31,42,77,.18);outline:3px solid #fff;outline-offset:0}
:root[data-theme="dark"] .bk,:root[data-theme="dark"] .gfloor.full{color:#fff}
/* teks kalimat tidak tebal (panggung game mewarisi huruf tebal) */
.vrow .vbub,.vcrate .lbl,.vstrip,.vstrip.big,.strip .gw.pc,.pz,.vlink,.vlist li{font-weight:500}
/* pita & lencana: kartu lego berwarna utuh, teks putih */
.vstrip,.vstrip.big{background:color-mix(in srgb,var(--c) 22%,#fff);color:#26304b}
.vrb,.vcard,.vcards .vcard{background:var(--c);color:#fff;border:2px solid color-mix(in srgb,var(--c) 62%,#1f2a4d);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 70%,#1f2a4d);border-radius:12px;font-weight:500}
.vrb span{background:#fff;border:2px solid color-mix(in srgb,var(--c) 62%,#1f2a4d);color:color-mix(in srgb,var(--c) 75%,#1f2a4d)}
.vrb[style*="lime"],.vrb[style*="yellow"]{color:var(--ink,#26304b)}
.vrb.dim,.vcard.dim{opacity:.45}

/* ===== LEGO RAPI · Tahap 1: tata letak & presisi ===== */
/* layar game: konten mulai dari atas (HUD tidak melompat); layar pembuka & skor tetap di tengah */
body[data-r="game"] main{justify-content:flex-start;padding-top:12px}
body[data-r="game"] main:has(>.gintro),body[data-r="game"] main:has(>.gover){justify-content:center}
/* HUD: pelat lego putih yang menempel di atas, tidak tertutup awan */
body[data-r="game"] .ghud{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:20;background:#fff;border:2px solid var(--pl);border-radius:14px;box-shadow:0 4px 0 var(--sh);padding:6px 10px 6px 6px;min-height:54px}
body[data-r="game"] .ghud .gquit{box-shadow:0 3px 0 var(--sh)}
body[data-r="game"] .gpips{flex:1;justify-content:center}
body[data-r="game"] .gpnum{font-family:var(--f-disp);font-size:15px;color:var(--ink)}
body[data-r="game"] .gtime{margin-top:-4px;height:10px;border-radius:5px;background:#fff;border:2px solid var(--pl)}
body[data-r="game"] .gtime i{border-radius:0}
/* efek "+poin / −1 nyawa": lencana lego menggantung di bawah HUD, tidak menutupi nyawa atau teks soal */
.gfx{position:fixed!important;top:calc(60px + env(safe-area-inset-top,0px))!important;bottom:auto!important;left:50%!important;right:auto!important;z-index:40;margin:0;padding:4px 14px!important;border-radius:10px!important;font-family:var(--f-disp);font-size:16px!important;line-height:1.2;color:#fff!important;text-shadow:none!important;white-space:nowrap;pointer-events:none;animation:gchip 1.2s ease-out forwards!important}
.gfx.bad{background:var(--red)!important;border:2px solid color-mix(in srgb,var(--red) 62%,#1f2a4d)!important;box-shadow:0 3px 0 color-mix(in srgb,var(--red) 62%,#1f2a4d)!important}
.gfx.ok{background:var(--green)!important;border:2px solid color-mix(in srgb,var(--green) 62%,#1f2a4d)!important;box-shadow:0 3px 0 color-mix(in srgb,var(--green) 62%,#1f2a4d)!important}
@keyframes gchip{0%{opacity:0;transform:translate(-50%,8px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.08)}25%{transform:translate(-50%,0) scale(1)}75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px);visibility:hidden}}
/* sesi soal (drill, teks, kartu kata baku): menu bawah disembunyikan agar tidak menutupi soal */
body.sess:not([data-r="game"]) nav.bottom{display:none!important}
body.sess:not([data-r="game"]) .app{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))!important}
/* bacaan di layar sempit: rata kiri agar jarak antarkata tidak renggang */
@media (max-width:600px){.cbt-passage p{text-align:left;-webkit-hyphens:manual;hyphens:manual}}

/* ===== LEGO RAPI · Tahap 2: layar soal ===== */
/* pilihan A–E: balok putih; warna balok huruf ikut mewarnai pilihan yang dipilih */
.ropt:nth-child(1){--rc:var(--yellow)}.ropt:nth-child(2){--rc:var(--red)}.ropt:nth-child(3){--rc:var(--blue)}.ropt:nth-child(4){--rc:var(--green)}.ropt:nth-child(5){--rc:var(--orange)}
.ropts{gap:12px}
.ropt{min-height:54px;padding:11px 12px 11px 12px;gap:12px;border-radius:12px;box-shadow:0 4px 0 var(--sh);font-weight:500;line-height:1.45;transition:transform .08s,box-shadow .08s}
.ropt .radio{margin-top:5px;align-self:flex-start}
.ropt .t{flex:1;min-width:0}
.ropt:not([disabled]):active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
.ropt.sel{background:color-mix(in srgb,var(--rc) 14%,#fff);border-color:color-mix(in srgb,var(--rc) 62%,#1f2a4d);box-shadow:0 4px 0 color-mix(in srgb,var(--rc) 60%,#1f2a4d);transform:none}
.ropt.right{background:color-mix(in srgb,var(--green) 14%,#fff);border-color:color-mix(in srgb,var(--green) 62%,#1f2a4d);box-shadow:0 4px 0 color-mix(in srgb,var(--green) 60%,#1f2a4d);opacity:1}
.ropt.wrong{background:color-mix(in srgb,var(--red) 12%,#fff);border-color:color-mix(in srgb,var(--red) 62%,#1f2a4d);box-shadow:0 4px 0 color-mix(in srgb,var(--red) 60%,#1f2a4d)}
.ropt.dim{opacity:.55;box-shadow:0 2px 0 var(--sh)}
.ropt .otag{align-self:center;font-family:var(--f-disp);font-weight:400;font-size:12px;padding:3px 8px;border-radius:7px;border:2px solid rgba(31,42,77,.25);box-shadow:0 2px 0 rgba(31,42,77,.2)}
.ropt .otag.ok{background:var(--green)}
.ropt .otag.bad{background:var(--red)}
/* isian nomor */
.cbt-isian input{width:96px;text-align:center}
.cbt-isian input::placeholder{font-family:var(--f-ui);font-size:14px;font-weight:500;color:var(--muted)}
/* kotak pembahasan: kartu lego berwarna sesuai hasil */
.pemb,.pemb.ok,.pemb.bad{--pc:var(--green);background:color-mix(in srgb,var(--pc) 7%,#fff);border:2px solid color-mix(in srgb,var(--pc) 62%,#1f2a4d);border-top-width:2px;border-radius:12px;box-shadow:0 4px 0 color-mix(in srgb,var(--pc) 60%,#1f2a4d);position:relative;margin-top:14px;padding-top:12px}
.pemb.bad{--pc:var(--red)}
.pemb::before,.pemb::after{content:"";position:absolute;top:-8px;left:16px;width:16px;height:8px;background:var(--pc);border:2px solid color-mix(in srgb,var(--pc) 62%,#1f2a4d);border-bottom:0;border-radius:4px 4px 0 0}
.pemb::after{left:40px}
.pemb-h{color:color-mix(in srgb,var(--pc) 70%,#1f2a4d)}
.pemb .rep{font-size:13px}
/* hasil drill: label kaidah panjang tidak lagi mendorong tombol keluar kartu */
.rule .row{flex-wrap:wrap;gap:8px;align-items:center}
.rule .chip{white-space:normal;min-width:0;max-width:100%;text-align:left}
.rule .row .mbtn{margin-left:auto}
/* kartu kata baku: warna hasil kembali tampil, tombol lebih jelas */
.swcard.fb.good{background:color-mix(in srgb,var(--green) 12%,#fff)!important;border-color:color-mix(in srgb,var(--green) 62%,#1f2a4d)!important;box-shadow:0 5px 0 color-mix(in srgb,var(--green) 60%,#1f2a4d)!important}
.swcard.fb.badc{background:color-mix(in srgb,var(--red) 10%,#fff)!important;border-color:color-mix(in srgb,var(--red) 62%,#1f2a4d)!important;box-shadow:0 5px 0 color-mix(in srgb,var(--red) 60%,#1f2a4d)!important}
.swcard .swverdict{font-family:var(--f-disp);font-size:20px}
.swbtns{gap:14px!important}
.swb{width:132px!important;height:60px!important;flex-direction:row!important;gap:8px!important;font-size:16px!important;font-weight:400}
.swb svg{width:22px!important;height:22px!important}
.swb:not([disabled]):active{transform:translateY(3px)}
/* notifikasi (toast): lebih lebar & mudah dibaca, tetap balok kuning */
.toast{width:max-content;max-width:min(340px,calc(100% - 32px));text-align:center;font-family:var(--f-ui);font-weight:700;font-size:14px;line-height:1.4;padding:10px 16px}
body.sess:not([data-r="game"]) .toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}

/* ===== LEGO RAPI · Tahap 3: layar pembuka & skor game ===== */
/* kartu pembuka dan skor: kartu lego berbingkai warna game, dengan tonjolan di atas pita */
.gintro,.gover{--cd:color-mix(in srgb,var(--c) 62%,#1f2a4d);position:relative;overflow:visible;background:#fff;border:2px solid var(--cd);border-top:14px solid var(--c);border-radius:16px;box-shadow:0 6px 0 var(--cd);margin-top:14px}
.gintro::before,.gintro::after,.gover::before,.gover::after{content:"";position:absolute;top:-24px;width:24px;height:10px;background:var(--c);border:2px solid var(--cd);border-bottom:0;border-radius:5px 5px 0 0}
.gintro::before,.gover::before{left:22px}
.gintro::after,.gover::after{right:22px}
.gintro{padding:30px 22px 22px;gap:10px}
.gintro .gi-ic{margin-top:-62px;width:64px;height:64px;border-radius:14px;border-color:var(--cd);box-shadow:0 4px 0 var(--cd)}
.gintro h2{font-size:28px;line-height:1.15}
.gintro .gi-tag{font-size:15px;line-height:1.45;max-width:30ch}
/* chip mode permainan: balok kecil */
.gi-chips{gap:8px;margin:4px 0 6px}
.gi-chips span{font-family:var(--f-disp);font-weight:400;font-size:13px;background:#fff;color:var(--ink);border:2px solid var(--pl);border-radius:8px;box-shadow:0 2px 0 var(--sh);padding:4px 10px}
.gi-chips span.new{background:var(--orange);color:#fff;border-color:color-mix(in srgb,var(--orange) 62%,#1f2a4d);box-shadow:0 2px 0 color-mix(in srgb,var(--orange) 62%,#1f2a4d)}
.gintro .btn.primary{margin-top:6px;min-height:52px;font-size:18px}
/* skor akhir */
.gover{padding:18px 18px 20px;gap:8px}
.gover h2{font-size:26px}
.gfinal{gap:10px;margin-top:4px}
.gfinal div{--fc:var(--blue);background:var(--fc);color:#fff;border:2px solid color-mix(in srgb,var(--fc) 62%,#1f2a4d);box-shadow:0 4px 0 color-mix(in srgb,var(--fc) 62%,#1f2a4d);border-radius:12px;padding:10px 4px 8px;gap:2px}
.gfinal div:nth-child(1){--fc:var(--blue)}.gfinal div:nth-child(2){--fc:var(--green)}.gfinal div:nth-child(3){--fc:var(--orange)}
.gfinal b{font-size:24px;line-height:1.1}
.gfinal span{color:#fff;opacity:.92;font-size:12px;font-weight:700}
.gnew{border:2px solid color-mix(in srgb,var(--red) 62%,#1f2a4d);box-shadow:0 3px 0 color-mix(in srgb,var(--red) 62%,#1f2a4d);border-radius:9px;padding:4px 14px;margin-top:4px}
.gbest{margin-top:4px}
.gmiss{justify-content:center}
.gmiss span{border:2px solid var(--pl);box-shadow:0 2px 0 var(--sh)}
/* tombol di bawah kartu skor: sejajar, tidak terlipat */
.gover~.gbtns{margin-top:12px}
.gover~.gbtns .gbtn.ghost{flex:0 0 auto;padding-inline:18px;white-space:nowrap}
.gover~.gbtns .gbtn.go{flex:1}

/* ===== LEGO RAPI · Tahap 4a: HUD kombo & Menara Paragraf ===== */
/* lencana kombo sejajar skor (HUD tidak membesar) */
body[data-r="game"] .gscore{flex-direction:row;align-items:center;gap:6px}
body[data-r="game"] .gscore em{border:2px solid color-mix(in srgb,var(--orange) 62%,#1f2a4d);box-shadow:0 2px 0 color-mix(in srgb,var(--orange) 62%,#1f2a4d);border-radius:7px;padding:1px 7px}
/* lantai kosong: bayangan balok bertonjolan putus-putus */
.gtower2 .gfloor.empty{border:2px dashed #8fa6d0;background:rgba(255,255,255,.6);border-radius:12px;color:#5d76a8}
.gtower2 .gfloor.empty::before,.gtower2 .gfloor.empty::after{background:rgba(255,255,255,.6);border:2px dashed #8fa6d0;border-bottom:0}
.gtower2 .gfloor.empty span{border:2px solid #8fa6d0;background:#fff;color:#5d76a8}
.gtower2 .gfloor.empty.ready{border-color:var(--blue);color:color-mix(in srgb,var(--blue) 75%,#1f2a4d)}
.gtower2 .gfloor.empty.ready::before,.gtower2 .gfloor.empty.ready::after{border-color:var(--blue);background:#fff}
/* lantai yang terlewat saat pembahasan: balok warna pudar, bukan kotak putih */
.gtower2 .gfloor.miss{--e:color-mix(in srgb,var(--c) 62%,#1f2a4d);background:color-mix(in srgb,var(--c) 20%,#fff);border:2px dashed var(--e);border-radius:12px;color:#26304b;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 30%,#fff)}
.gtower2 .gfloor.miss::before,.gtower2 .gfloor.miss::after{content:"";display:block;position:absolute;top:-9px;width:18px;height:7px;background:color-mix(in srgb,var(--c) 20%,#fff);border:2px dashed var(--e);border-bottom:0;border-radius:5px 5px 0 0}
.gtower2 .gfloor.miss::before{left:14px}.gtower2 .gfloor.miss::after{left:40px}
.gtower2 .gfloor.miss span{background:#fff;border:2px solid var(--e);color:var(--e)}
.gtower2 .gfloor.miss p{font-weight:500}
/* kotak petunjuk: kartu lego kuning */
.ghint{background:color-mix(in srgb,var(--yellow) 18%,#fff);border:2px solid color-mix(in srgb,var(--yellow) 55%,#6b4a00);box-shadow:0 3px 0 color-mix(in srgb,var(--yellow) 60%,#7a5200);border-radius:12px;color:#26304b;font-weight:500}
/* varian "Susunan mana yang kokoh?": kalimat & pilihan menara jadi balok */
.vlist li{border-radius:12px;box-shadow:0 3px 0 var(--sh);align-items:center}
.vlist li .nbk{align-self:flex-start;margin-top:1px}
.vtwr{background:#fff;border:2px solid var(--pl);box-shadow:0 4px 0 var(--sh);padding-top:18px}
.vtwr:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
.vtwr.ok{background:color-mix(in srgb,var(--green) 14%,#fff);border-color:color-mix(in srgb,var(--green) 62%,#1f2a4d);box-shadow:0 4px 0 color-mix(in srgb,var(--green) 60%,#1f2a4d)}
.vtwr.bad{background:color-mix(in srgb,var(--red) 12%,#fff);border-color:color-mix(in srgb,var(--red) 62%,#1f2a4d);box-shadow:0 4px 0 color-mix(in srgb,var(--red) 60%,#1f2a4d)}
/* varian "selipkan": celah tempat menyelipkan balok */
.vgap{border-radius:12px;border-color:#8fa6d0;color:#5d76a8;background:rgba(255,255,255,.7)}
/* lembar hasil ronde (semua game): kartu lego hijau/merah seperti kotak pembahasan */
.gsheet,.gsheet.ok,.gsheet.bad{--pc:var(--green);position:relative;overflow:visible;background:color-mix(in srgb,var(--pc) 7%,#fff);border:2px solid color-mix(in srgb,var(--pc) 62%,#1f2a4d);border-radius:14px;box-shadow:0 5px 0 color-mix(in srgb,var(--pc) 60%,#1f2a4d);margin-top:10px}
.gsheet.bad{--pc:var(--red)}
.gsheet::before,.gsheet::after{content:"";position:absolute;top:-10px;left:18px;width:18px;height:8px;background:var(--pc);border:2px solid color-mix(in srgb,var(--pc) 62%,#1f2a4d);border-bottom:0;border-radius:5px 5px 0 0}
.gsheet::after{left:44px}
.gsheet>b{color:color-mix(in srgb,var(--pc) 70%,#1f2a4d)}

/* ===== LEGO RAPI · Tahap 4b: Tangkap Penyusup ===== */
/* papan desa: balok kuning bertonjolan di atas dua tiang balok (bukan papan kayu) */
.vsign{--sc:var(--yellow);--sd:color-mix(in srgb,var(--yellow) 55%,#6b4a00);background:var(--sc);color:#26304b;border:2px solid var(--sd);border-radius:12px;box-shadow:0 4px 0 var(--sd);padding:8px 16px 9px;margin:10px 0 14px}
.vsign b{color:#26304b}
.vsign small{color:#4a4020;font-weight:600}
.vsign::before,.vsign::after{bottom:-17px;width:10px;height:13px;background:#8d99b8;border:2px solid #5b6d99;border-top:0;border-radius:0 0 3px 3px}
.vsign::before{left:22%}.vsign::after{right:22%}
/* tonjolan papan */
.gstage.village .vsign b::before{content:"";position:absolute;top:-10px;left:18px;width:20px;height:8px;background:var(--sc);border:2px solid var(--sd);border-bottom:0;border-radius:5px 5px 0 0;box-shadow:none}
.gstage.village .vsign b::after{content:"";position:absolute;top:-10px;right:18px;width:20px;height:8px;background:var(--sc);border:2px solid var(--sd);border-bottom:0;border-radius:5px 5px 0 0}
/* gelembung bicara: satu bentuk yang sama, sudut & bayangan seragam */
.vp .vbub,.vp.s1 .vbub,.vp.s2 .vbub,.vp.s3 .vbub,.vp.s4 .vbub,.vp.r.s1 .vbub{border-radius:12px;flex:1 1 auto;font-weight:500;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 60%,#1f2a4d)}
.vp .vbub::after{bottom:14px}
.gperson.vp:not([disabled]):active .vbub{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 60%,#1f2a4d)}
/* dicurigai: garis tegas merah (bukan putus-putus) & sedikit terangkat */
.vp.sel .vbub{background:color-mix(in srgb,var(--red) 10%,#fff);border:2px solid color-mix(in srgb,var(--red) 62%,#1f2a4d);box-shadow:0 4px 0 color-mix(in srgb,var(--red) 60%,#1f2a4d);transform:translateY(-2px)}
.vp.sel .vbub::after{border-color:color-mix(in srgb,var(--red) 62%,#1f2a4d)}
.vp.safe .vbub{background:color-mix(in srgb,var(--green) 8%,#fff);border-color:color-mix(in srgb,var(--green) 45%,#fff);box-shadow:0 3px 0 color-mix(in srgb,var(--green) 30%,#fff)}
.vp.caught .vbub{background:color-mix(in srgb,var(--red) 10%,#fff);border-color:color-mix(in srgb,var(--red) 62%,#1f2a4d);box-shadow:0 4px 0 color-mix(in srgb,var(--red) 60%,#1f2a4d)}
/* lencana warga asli / penyusup / dicurigai: balok mini */
.gbadge{font-family:var(--f-disp);font-weight:400;border:2px solid rgba(31,42,77,.28);box-shadow:0 2px 0 rgba(31,42,77,.22);border-radius:7px;padding:1px 7px;line-height:1.35}
.vbub .gbadge{top:-13px}
/* nomor warga */
.vno{border-radius:6px;box-shadow:0 2px 0 var(--sh)}
/* varian ketuk/seret & gerbang desa: gelembung seragam dengan versi utama */
.vrow .vbub{border-color:color-mix(in srgb,var(--c) 60%,#1f2a4d);border-radius:12px;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 60%,#1f2a4d)}
.vrow.caught .vbub{background:color-mix(in srgb,var(--red) 10%,#fff);border-color:color-mix(in srgb,var(--red) 62%,#1f2a4d);box-shadow:0 4px 0 color-mix(in srgb,var(--red) 60%,#1f2a4d)}
.vgate .vbub{border-radius:12px;font-weight:500}
.gdrop{border-radius:12px}

/* ===== LEGO RAPI · Tahap 4c: Bengkel Kata Baku ===== */
/* meja kerja: slot tujuan berupa bayangan balok, seperti lantai kosong di Menara Paragraf */
.bench{border-radius:12px;box-shadow:0 4px 0 var(--sh)}
.bench-l{font-size:14px;color:#5d76a8;text-align:center}
.bench-slot{border:2px dashed #8fa6d0;border-radius:10px;background:rgba(255,255,255,.7);color:#5d76a8}
/* kotak perkakas: semua alat balok biru yang sama (warna tidak membocorkan jawaban) */
.toolbox{border-radius:14px}
.toolbox .gtool.tl{--tc:var(--sky);position:relative;overflow:visible;background:var(--tc);color:#fff;border:2px solid color-mix(in srgb,var(--tc) 62%,#1f2a4d);box-shadow:0 4px 0 color-mix(in srgb,var(--tc) 62%,#1f2a4d);border-radius:10px;padding:10px 4px 8px;margin-top:8px}
.toolbox .gtool.tl::before,.toolbox .gtool.tl::after{content:"";position:absolute;top:-9px;width:16px;height:7px;background:var(--tc);border:2px solid color-mix(in srgb,var(--tc) 62%,#1f2a4d);border-bottom:0;border-radius:4px 4px 0 0}
.toolbox .gtool.tl::before{left:22%}.toolbox .gtool.tl::after{right:22%}
.toolbox .gtool.tl b{color:#fff;font-size:16px}
.toolbox .gtool.tl:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--tc) 62%,#1f2a4d)}
.toolbox .gtool.tl.shake{--c:var(--red)}
/* balok retak: abu tua agar tulisannya tetap terbaca */
.gw.lb.broken{background:#7d88a1;border-color:#4d566b}
.gw.lb.broken::before{background:#7d88a1}
/* varian Peti mulus: peti kayu diganti balok oranye bertonjolan berlabel putih */
.vcrate{--c:var(--orange);background:var(--c)!important;background-image:none!important;border:2px solid color-mix(in srgb,var(--c) 62%,#1f2a4d)!important;border-radius:12px!important;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 62%,#1f2a4d)!important;padding:12px!important;margin-top:8px;overflow:visible}
.vcrate::before,.vcrate::after{content:"";position:absolute;top:-10px;width:20px;height:8px;background:var(--c);border:2px solid color-mix(in srgb,var(--c) 62%,#1f2a4d);border-bottom:0;border-radius:5px 5px 0 0}
.vcrate::before{left:18px}.vcrate::after{left:46px}
.vcrate .lbl{border-radius:8px;box-shadow:none;background:#fff;color:#26304b}
.vcrate.ok{--c:var(--green)}.vcrate.bad{--c:var(--red)}
.vcrate em{border:2px solid rgba(31,42,77,.28);border-radius:7px;transform:none}
.gdrop.truck{--c:var(--orange)}

/* ===== LEGO RAPI · Tahap 4d: Pisah atau Sambung ===== */
/* dua balok kata selalu sejajar dalam satu baris; ukuran huruf menyesuaikan panjang kata */
.gcard3.lset .lbk{font-size:clamp(15px,calc(360px / (var(--n,10) + 1)),28px);padding:14px 12px 12px;white-space:nowrap;min-width:76px;text-align:center}
.gcard3.lset .lbk::before{left:10px}.gcard3.lset .lbk::after{right:10px}
.gcard3.lset{flex-wrap:nowrap!important}
.gcard3.lset .lq{flex:none}
/* varian "Kenapa begitu?": kartu alasan jadi balok bertonjolan */
.vcards{gap:14px 10px;margin-top:6px}
.vcards .vcard{position:relative;overflow:visible;margin-top:8px}
.vcards .vcard::before,.vcards .vcard::after{content:"";position:absolute;top:-10px;width:18px;height:8px;background:var(--c);border:2px solid color-mix(in srgb,var(--c) 62%,#1f2a4d);border-bottom:0;border-radius:5px 5px 0 0}
.vcards .vcard::before{left:20%}.vcards .vcard::after{right:20%}
.vcards .vcard:not([disabled]):active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 70%,#1f2a4d)}
/* varian "Mana yang salah rakit?": pilihan jadi alas balok putih, bukan kotak putus-putus */
.vset{background:#fff;border:2px solid var(--pl);box-shadow:0 4px 0 var(--sh);padding-top:20px}
.vset:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
.vset.ok{background:color-mix(in srgb,var(--green) 14%,#fff);border-color:color-mix(in srgb,var(--green) 62%,#1f2a4d);box-shadow:0 4px 0 color-mix(in srgb,var(--green) 60%,#1f2a4d)}
.vset.bad{background:color-mix(in srgb,var(--red) 12%,#fff);border-color:color-mix(in srgb,var(--red) 62%,#1f2a4d);box-shadow:0 4px 0 color-mix(in srgb,var(--red) 60%,#1f2a4d)}
/* kotak hasil kartu: kartu lego hijau/merah seperti lembar hasil ronde */
.lres,.lres.ok,.lres.bad{--pc:var(--green);background:color-mix(in srgb,var(--pc) 7%,#fff);border:2px solid color-mix(in srgb,var(--pc) 62%,#1f2a4d);box-shadow:0 4px 0 color-mix(in srgb,var(--pc) 60%,#1f2a4d)}
.lres.bad{--pc:var(--red)}
.lres .grule{font-weight:600}
.gcard3.lset[data-action="gnext"]{cursor:pointer}

/* ===== LEGO RAPI · Tahap 4e: Pangkas ===== */
/* kata di pita: balok putih bertonjolan, jarak antarkata seragam (garis potong hias dihapus agar tidak nyasar di awal baris) */
.strip{column-gap:10px;row-gap:16px;padding-top:22px}
.strip .cutl{display:none}
.strip .gw.pc{position:relative;overflow:visible;background:#fff;border:2px solid var(--pl);box-shadow:0 3px 0 var(--sh);border-radius:8px;padding:6px 10px;color:#26304b}
.strip .gw.pc::before{content:"";display:block;position:absolute;top:-8px;left:8px;width:14px;height:6px;background:#fff;border:2px solid var(--pl);border-bottom:0;border-radius:4px 4px 0 0}
.strip .gw.pc:not([disabled]):active{background:color-mix(in srgb,var(--red) 10%,#fff);transform:translateY(2px);box-shadow:0 1px 0 var(--sh)}
@media (hover:hover){.strip .gw.pc:not([disabled]):hover{background:color-mix(in srgb,var(--red) 10%,#fff)}}
.strip .gw.must{background:color-mix(in srgb,var(--red) 10%,#fff);border-color:color-mix(in srgb,var(--red) 62%,#1f2a4d);box-shadow:0 3px 0 color-mix(in srgb,var(--red) 60%,#1f2a4d)}
.strip .gw.must::before{background:color-mix(in srgb,var(--red) 10%,#fff);border-color:color-mix(in srgb,var(--red) 62%,#1f2a4d)}
/* varian Rapi atau pangkas: penanda hasil jadi balok mini */
.vdone span{border:2px solid rgba(31,42,77,.28);box-shadow:0 2px 0 rgba(31,42,77,.22);border-radius:6px}

/* ===== LEGO RAPI · Tahap 4f: Relasi Kilat ===== */
/* kepingan puzzle diganti balok lego: tiap bagian kalimat bertonjolan di atas, ditumpuk */
.pzs{gap:18px}
.pz,.pz.a,.pz.b{--bc:var(--blue);background:color-mix(in srgb,var(--bc) 12%,#fff);border:2px solid color-mix(in srgb,var(--bc) 62%,#1f2a4d);border-radius:12px;box-shadow:0 4px 0 color-mix(in srgb,var(--bc) 60%,#1f2a4d);color:#26304b}
.pz.b{--bc:var(--green)}
/* dua tonjolan di atas setiap balok (pseudo yang dulu jadi kait puzzle dipakai ulang) */
.pz.a::before,.pz.a::after,.pz.b::before,.pz.b::after,.pz.slot::before,.pz.slot::after,.pz.k::before,.pz.k::after{content:"";display:block;position:absolute;top:-10px;bottom:auto;margin:0;width:20px;height:8px;background:inherit;border:2px solid color-mix(in srgb,var(--bc) 62%,#1f2a4d);border-bottom:0;border-radius:5px 5px 0 0;z-index:1}
.pz.a::before,.pz.b::before,.pz.slot::before,.pz.k::before{left:22px}
.pz.a::after,.pz.b::after,.pz.slot::after,.pz.k::after{left:auto;right:22px}
.pz.slot{--bc:var(--purple);background:rgba(255,255,255,.7);border:2px dashed color-mix(in srgb,var(--purple) 55%,#fff);box-shadow:none;color:color-mix(in srgb,var(--purple) 70%,#1f2a4d)}
.pz.slot::before,.pz.slot::after{border-style:dashed;border-color:color-mix(in srgb,var(--purple) 55%,#fff);background:rgba(255,255,255,.7)}
.pz.k{--bc:var(--purple);background:var(--bc);color:#fff}
.pz.k.key,.pzs.locked .pz.k{--bc:var(--green);background:var(--bc)}
.pzs.locked{gap:0}
.pzs.locked .pz{border-color:color-mix(in srgb,var(--bc) 62%,#1f2a4d);box-shadow:none}
.pzs.locked .pz.b{box-shadow:0 4px 0 color-mix(in srgb,var(--bc) 60%,#1f2a4d)}
.pzs.locked .pz.k::before,.pzs.locked .pz.k::after,.pzs.locked .pz.b::before,.pzs.locked .pz.b::after{display:none}
/* kepingan konjungsi: balok warna palet aplikasi, tonjolan di atas saja */
.vtray{display:grid;grid-template-columns:1fr 1fr;gap:20px 12px;padding-top:14px}
.pzp,.vtray .pzp:nth-child(n){--pc:var(--purple);background:var(--pc);border:2px solid color-mix(in srgb,var(--pc) 62%,#1f2a4d);box-shadow:0 4px 0 color-mix(in srgb,var(--pc) 62%,#1f2a4d);border-radius:10px;min-height:52px;min-width:0}
.vtray .pzp:nth-child(4n+2){--pc:var(--blue)}.vtray .pzp:nth-child(4n+3){--pc:var(--orange)}.vtray .pzp:nth-child(4n+4){--pc:var(--green)}
.pzp::before,.pzp::after{top:-10px;bottom:auto;left:auto;margin:0;width:20px;height:8px;background:var(--pc);border:2px solid color-mix(in srgb,var(--pc) 62%,#1f2a4d);border-bottom:0;border-radius:5px 5px 0 0}
.pzp::before{left:22%}.pzp::after{right:22%}
.pzp:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--pc) 62%,#1f2a4d)}
/* varian Sambungan putus & Jenis sambungan: baris kalimat jadi balok putih */
.vlink{border-radius:12px;box-shadow:0 3px 0 var(--sh)}
.vlink.brk{border-style:solid;border-color:color-mix(in srgb,var(--red) 62%,#1f2a4d);box-shadow:0 3px 0 color-mix(in srgb,var(--red) 60%,#1f2a4d)}
.pzk{border-radius:7px}
.vrel{gap:14px 10px}

.ebsum b{font-family:var(--f-disp,inherit);font-weight:400;font-size:22px;color:var(--ink)}.ebsum span{font-size:11px;color:var(--muted);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ebdots{display:inline-flex;gap:3px;align-items:center}.ebdots i{width:9px;height:9px;border-radius:3px;border:1.5px solid var(--muted);background:var(--surface)}.ebdots i.on{background:var(--green);border-color:var(--green)}

.ebopts li.k{background:var(--ok-soft)}.ebopts li.x{background:var(--bad-soft)}
.ebcmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ebcmp>div{border-radius:9px;padding:7px 10px;border:2px solid;display:flex;flex-direction:column;font-size:14px}.ebcmp span{font-size:12px;color:var(--muted)}
.ebcmp .x{background:var(--bad-soft);border-color:var(--red)}.ebcmp .k{background:var(--ok-soft);border-color:var(--green)}
.ebmore summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
.ebpas{font-size:14px;line-height:1.6;margin-top:6px}.ebpas sup{color:var(--muted);font-weight:700}.ebbukti{background:#fff3b0}

.ebhome{flex-direction:row;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.ebhome .grow{flex:1;min-width:0}.ebhome .chev{width:8px;height:13px;flex:none;color:var(--muted)}

   ['Huruf pertama awal kalimat dalam petikan langsung ditulis kapital.','Ibu berpesan, "Berhati-hatilah, Nak!" · "Besok pagi," kata Rino, "mereka akan berangkat."','Jika petikan disela keterangan pengutip (kata Rino), lanjutan petikannya tidak diawali kapital karena masih satu kalimat.','"Besok pagi," kata Rino, "Mereka akan berangkat." → "Besok pagi," kata Rino, "mereka akan berangkat."','I.F.6'],
