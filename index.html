   jebakan:['Imbuhan sama belum tentu maknanya sama: bersepeda (naik), berduri (mempunyai), dan bertelur (menghasilkan). Bandingkan parafrasenya, bukan bentuknya.','pelatih (dari melatih, peng-) berbeda asal dari petani (dari bertani, per-).','tertinggal (tidak sengaja) berbeda dari ditinggalkan (sengaja); tidak terbeli = tidak dapat dibeli.','memperbesar (membuat lebih besar) berbeda dari membesarkan (membuat menjadi besar atau mengasuh).','penyuruh (yang menyuruh) berbeda dari pesuruh (yang disuruh).']},
 {sub:'Makna imbuhan: akhiran dan konfiks', ref:'Morfologi', src:'TBBI',
   def:'Akhiran (sufiks) dilekatkan di belakang bentuk dasar, misalnya -kan, -i, -an, dan -wan. Konfiks adalah pasangan awalan dan akhiran yang dilekatkan sekaligus dan membentuk satu makna, misalnya ke-…-an, peng-…-an, per-…-an, dan ber-…-an.',
   guna:'Kunci membaca makna akhiran dan konfiks adalah verba pasangannya: peng-…-an berpasangan dengan meng- (penyatuan ← menyatukan), per-…-an dengan ber- (persatuan ← bersatu), dan -an biasanya bermakna hasil dari verba (tulisan ← menulis).',
   aturan:[
   ['-kan pada verba: ‘membuat menjadi’ (kausatif), ‘melakukan untuk orang lain’ (benefaktif), ‘membawa atau memasukkan ke’, atau objeknya menjadi alat.','membersihkan, mengamankan (membuat menjadi) · membelikan, mengambilkan, membuatkan (untuk orang lain) · mengandangkan, mengemukakan, mengesampingkan (membawa ke) · memukulkan kayu (kayu sebagai alat)','Verba -kan benefaktif dapat diikuti dua nomina: Kakak mengambilkan ibu (O) air (Pel).','','4.2.2.5'],
   ['-kan pada adjektiva perasaan: ‘menimbulkan perasaan itu’ pada pihak lain, atau ‘merasakan’ oleh subjeknya.','memuaskan, mengagumkan, menyedihkan, memalukan (menimbulkan perasaan) · merindukan, membanggakan (subjek merasakan)','','','4.2.2.5.2'],
   ['-i: objeknya tempat atau sasaran tindakan; ‘memberi atau membubuhi’; perbuatan berulang; atau subjek berada pada posisi yang dinyatakan bentuk dasar.','mendatangi, menduduki, memasuki (tempat) · menggarami, meminyaki, mewarnai (memberi) · memukuli, menciumi, menebangi (berulang) · mendekati, menjauhi, mengatasi (posisi)','Bandingkan -i dan -kan: menerangi gua (memberi terang pada tempat) dengan menerangkan manfaat (menjelaskan); memberati tali (memberi beban) dengan memberatkan (membuat menjadi berat).','','4.2.2.6'],
   ['-an: ‘hasil’ atau ‘sesuatu yang di-’; ‘tempat’; ‘kelipatan’; atau ‘kumpulan’.','tulisan, kiriman, anjuran (hasil/yang di-) · belokan, tanjakan, daratan (tempat) · puluhan, ribuan (kelipatan) · kawanan, pasukan (kumpulan)','-an juga membentuk nomina untuk terbitan berkala: harian, mingguan.','','7.1.4.2 (4)'],
   ['peng-…-an: ‘perbuatan’, ‘proses’, atau ‘hasil atau hal’ dari verba meng- transitif pasangannya.','pemukulan, pemberhentian (perbuatan) · pembangunan, penulisan, pembelajaran (proses) · pemberitahuan, pengakuan (hasil/hal)','Uji dengan mengganti katanya: Pembangunan jembatan berlangsung dua tahun = proses membangun. Ada yang maknanya khusus dan harus dipelajari tersendiri: pemandangan, pendapatan, pendirian.','','7.1.4.2 (5)'],
   ['per-…-an: ‘hal’ atau ‘hasil’ dari verba ber- pasangannya, ‘perbuatan atau hasil’ dari verba memper-, atau ‘hal yang berkaitan dengan’ nomina dasarnya.','perjuangan, pertanian, peternakan (hal ber-) · percakapan, pertemuan, perjanjian (perbuatan/hasil ber-) · perhatian, pertunjukan (dari memper-) · perhotelan, perbukuan (hal yang berkaitan dengan)','Bandingkan persatuan (hal bersatu) dengan penyatuan (perbuatan menyatukan): Penyatuan Nusantara dilakukan oleh Hayam Wuruk berterima, sedangkan Persatuan Nusantara dilakukan oleh Hayam Wuruk tidak.','','7.1.4.2 (6)'],
   ['ke-…-an pembentuk nomina: ‘hal atau keadaan’ (dari verba dan adjektiva), ‘hal mengenai’, atau ‘kantor atau wilayah’ (dari nomina).','kedatangan, keberhasilan (hal) · keberanian, kekosongan (keadaan) · kemanusiaan, keuangan (hal mengenai) · kelurahan, kecamatan, kedutaan (kantor/wilayah) · ketidakhadiran (hal tidak hadir)','','','7.1.4.2 (7)'],
   ['ke-…-an pada verba dan adjektiva: ‘mengalami sesuatu yang tidak menyenangkan’ (adversatif), ‘terlalu’ (eksesif), atau ‘agak’ pada warna yang diulang.','kehujanan, kecopetan, kemalaman, ketiduran (mengalami) · kebesaran, kemahalan, kejauhan (terlalu) · kemerah-merahan, kekuning-kuningan (agak)','Konteks menentukan: Jas itu kebesaran = terlalu besar; kebesaran bangsa = keadaan besar (nomina).','','4.3.1.7; 5.4.1.4; 5.4.1.6'],
   ['ber-…-an: ‘banyak dan tidak teratur’ (dari verba) atau ‘saling, timbal balik’.','berdatangan, berjatuhan, beterbangan (banyak, tidak teratur) · berpandangan, bersalaman, berdekatan (saling)','Bedakan konfiks ber-…-an dari ber- + kata berakhiran -an: berhalangan berasal dari ber- + halangan.','','4.3.1.2'],
   ['-wan dan -wati: ‘orang yang ahli’, ‘orang yang bekerja di bidang’, atau ‘orang yang memiliki’; -wati khusus perempuan.','ilmuwan, sejarawan (ahli) · wartawan, karyawan (pekerjaan) · hartawan, dermawan, rupawan (memiliki/bersifat)','Pilihan bentuknya idiomatis: seniman, bukan peseni.','','7.1.4.2 (9)']
   ],
   jebakan:['penyatuan (perbuatan menyatukan) berbeda dari persatuan (hal bersatu).','kebesaran bisa bermakna ‘terlalu besar’ (jas itu kebesaran) atau ‘keadaan besar’ (kebesaran bangsa).','menerangi (memberi terang) berbeda dari menerangkan (menjelaskan).','Soal "imbuhan yang maknanya sama" menuntut parafrase: tulisan (hasil menulis) sejenis dengan kiriman (hasil mengirim), bukan dengan belokan (tempat).']},
 {sub:'Kelas kata dan frasa', ref:'Sintaksis', src:'TBBI',
   def:'Kelas kata (kategori leksikal) adalah golongan kata menurut perilakunya dalam kalimat: nomina, verba, adjektiva, adverbia, pronomina, numeralia, dan kata tugas (preposisi, konjungsi, artikula, interjeksi, partikel). Frasa adalah satuan dua kata atau lebih yang berpusat pada satu kata terpenting (inti); berbeda dengan klausa, frasa tidak membentuk hubungan subjek-predikat.',
   guna:'Nama frasa mengikuti kelas kata intinya: frasa nominal berinti nomina, frasa verbal berinti verba, dan seterusnya. Kelas sebuah kata ditentukan oleh perilakunya dalam kalimat, bukan oleh bentuknya saja.',
   aturan:[
   ['Nomina (kata benda): mengacu pada orang, benda, tempat, atau konsep; diingkar dengan bukan dan dapat diikuti yang + adjektiva.','anak · buku · Bogor · persatuan · bukan buku · buku yang tebal','','','2.2.3.2.1; 7.1'],
   ['Verba (kata kerja): menyatakan perbuatan, proses, atau keadaan; diingkar dengan tidak.','makan · tidur · bekerja · membaca · tidak membaca','','','2.2.3.2.1; 4.1'],
   ['Adjektiva (kata sifat): menyatakan sifat atau keadaan; dapat diberi pewatas sangat, agak, lebih, atau paling.','besar · cantik · rajin · gelap · sangat rajin · paling gelap','','','2.2.3.2.1; 5.4'],
   ['Adverbia (kata keterangan): menerangkan verba, adjektiva, atau kalimat.','amat · juga · lebih · sering · sudah','','','2.2.3.2.1; 6.1'],
   ['Pronomina, numeralia, dan kata tugas: kata ganti, kata bilangan, dan kata yang terutama bertugas gramatikal.','aku, mereka (pronomina) · dua, kedua, sepuluh (numeralia) · di, kepada (preposisi) · dan, bahwa (konjungsi) · si, sang (artikula) · aduh (interjeksi) · -lah, pun (partikel)','','','2.2.3.2.1; 8.1'],
   ['Satu bentuk kata dapat termasuk dua kelas atau lebih; kelasnya ditentukan oleh perilakunya dalam kalimat.','Kamarnya sudah saya sapu. (verba) · Jangan lupa membeli sapu. (nomina) · Sungai itu sangat dalam. (adjektiva) · Pekerjaan ini selesai dalam tiga minggu. (preposisi)','','','9.3.1'],
   ['Frasa dinamai menurut kelas kata intinya: frasa nominal, verbal, adjektival, adverbial, numeral, dan preposisional.','anak kecil, dua ekor sapi (FN) · mengirim surat, sudah pergi (FV) · amat senang, agak besar (FAdj) · jarang sekali (FAdv) · lima puluhan (FNum) · di atas meja (FPrep)','Tidak ada frasa yang intinya konjungsi, interjeksi, artikula, atau partikel.','','2.2.3.2.2; 9.3.1'],
   ['Frasa terdiri atas inti dan noninti (komplemen, pewatas, penentu). Frasa koordinatif tidak berinti: unsurnya setara dan dihubungkan dengan dan atau atau.','gambar anjing yang mereka bawa itu (inti: gambar) · sayuran, buah, dan ikan (koordinatif) · ayah dan ibu','','','2.2.3.3.1–3; 7.1.5.4.7'],
   ['Dalam frasa nominal, pewatas umumnya berada di belakang inti (diterangkan–menerangkan). Pewatas berupa nomina mendahului pewatas adjektiva atau verba.','buku baru · rumah kayu · buku pelajaran (yang) baru · kendaraan air (yang) bermotor','Penentu jumlah boleh di depan (kedua mahasiswa itu), tetapi pewatas tetap di belakang inti.','buku baru pelajaran → buku pelajaran baru · lemari tua besi → lemari besi tua','7.1.5.5'],
   ['Hubungan makna antara nomina inti dan nomina pewatas beragam, antara lain asal, bahan, dan peruntukan.','dodol garut, orang Medan (asal) · cincin emas, kursi rotan (bahan) · asrama putri, sepatu tenis (peruntukan) · lemari dinding (tempat)','Soal PPU sering menanyakan pola makna frasa: lemari besi ‘terbuat dari besi’, sedangkan lemari buku ‘untuk buku’.','','7.1.5.4.1'],
   ['Gabungan verba atau adjektiva dengan nomina yang sudah padu atau idiomatis berfungsi sebagai satu kesatuan; nominanya bukan objek atau pelengkap.','naik haji · turun tangan · keras kepala · meninggal dunia · tembus cahaya · kurang darah','Frasa biasa dapat disisipi yang (rumah besar → rumah yang besar); gabungan padu tidak dapat (rumah sakit).','','9.3.2.4']
   ],
   jebakan:['Kelas kata dilihat dari fungsinya di kalimat: dalam bisa adjektiva, preposisi, atau nomina.','Pewatas berada di belakang inti: buku pelajaran baru, bukan buku baru pelajaran.','Untuk soal pola makna frasa, cari hubungan inti–pewatas yang sama: kursi rotan sejenis dengan cincin emas (bahan).','naik haji dan keras kepala adalah satu kesatuan; jangan dipotong saat mencari kalimat inti.']},
 {sub:'Pola dan jenis kalimat', ref:'Sintaksis', src:'TBBI',
   def:'Kalimat adalah satuan bahasa yang mengungkapkan pikiran yang utuh; dalam tulisan diawali huruf kapital dan diakhiri tanda titik, tanya, atau seru. Unsur kalimat dinamai menurut fungsinya: subjek (S), predikat (P), objek (O), pelengkap (Pel), dan keterangan (Ket).',
   guna:'Predikat adalah pusat kalimat: jenis predikat menentukan unsur lain yang wajib hadir. Kalimat inti hanya memuat unsur wajib, sedangkan keterangan dan pewatas boleh dilepas.',
   aturan:[
   ['Predikat (P) adalah unsur pokok kalimat; dapat berupa frasa verbal, adjektival, nominal, numeral, atau preposisional.','Ayahnya guru bahasa Inggris. (FN) · Adiknya dua orang. (FNum) · Ibu sedang ke pasar. (FPrep) · Dia sedang tidur. (FV) · Gadis itu cantik sekali. (FAdj)','Jika subjek dan predikat sama-sama nomina, bagian yang diberi -lah adalah predikat: Dialah penulisnya.','','9.3.2.1'],
   ['Subjek (S) adalah unsur yang dibicarakan; umumnya frasa nominal di sebelah kiri predikat, dan dapat berupa klausa.','Kesalahannya jelas. · Bahwa dia bersalah jelas.','Subjek tidak didahului preposisi; preposisi di depan subjek membuat kalimat kehilangan subjek.','Di dalam rapat itu membahas anggaran. → Rapat itu membahas anggaran.','9.3.2.2'],
   ['Objek (O) hadir langsung sesudah verba transitif dalam kalimat aktif; dapat diganti -nya dan dapat menjadi subjek kalimat pasif.','Pembantu membersihkan ruangan saya. → Ruangan saya dibersihkan pembantu. · Saya sudah membacanya.','','','9.3.2.3'],
   ['Pelengkap (Pel) melengkapi predikat, tetapi tidak dapat menjadi subjek kalimat pasif dan tidak dapat diganti -nya.','Dia berjualan barang elektronik. · Orang itu bertubuh raksasa. · Dia menjadi ketua koperasi. · Ayah membelikan saya (O) baju (Pel).','Uji pemasifan: Dia menjual barang (O) dapat menjadi Barang dijual olehnya; Dia berjualan barang (Pel) tidak dapat dipasifkan.','','9.3.2.4'],
   ['Keterangan (Ket) memberi informasi tambahan (tempat, waktu, alat, tujuan, cara, sebab, akibat, dan lain-lain); letaknya dapat berpindah.','Dita membeli mangga kemarin. · Kemarin Dita membeli mangga. · Dita kemarin membeli mangga.','Kebanyakan keterangan tidak wajib. Pada verba seperti tinggal dan terletak, keterangan tempat wajib hadir: Buku itu terletak di meja.','','9.3.2.5; 9.4.1.1'],
   ['Enam pola kalimat dasar: S-P, S-P-O, S-P-Pel, S-P-Ket, S-P-O-Pel, dan S-P-O-Ket.','Dia tidur. (S-P) · Mahasiswa mengadakan seminar. (S-P-O) · Mereka belajar bahasa Inggris. (S-P-Pel) · Buku itu terletak di meja. (S-P-Ket) · Ayah membelikan saya baju. (S-P-O-Pel) · Dia meletakkan uang di atas meja. (S-P-O-Ket)','Verba predikat menentukan polanya: membeli menuntut objek, sedangkan membelikan menuntut objek dan pelengkap.','','9.4.1.1–2'],
   ['Kalimat inti hanya memuat unsur wajib; keterangan dan pewatas yang tidak wajib dilepas.','Para siswa kelas XII mengikuti ujian akhir di aula sejak pukul tujuh. → Para siswa mengikuti ujian akhir.','Jangan membuang unsur yang dituntut predikat: objek verba transitif, pelengkap verba menjadi, atau keterangan verba terletak. Gabungan padu seperti naik haji tetap utuh.','Para siswa mengikuti di aula. → Para siswa mengikuti ujian akhir.','9.2.2; 9.4.1'],
   ['Menurut jumlah klausanya, kalimat dibagi menjadi kalimat simpleks (tunggal), kompleks (majemuk bertingkat), majemuk (majemuk setara), dan majemuk kompleks.','Dia akan pergi. (simpleks) · Pak Bayu datang ketika rapat telah selesai. (kompleks) · Frida membaca dan adiknya bermain catur. (majemuk) · Partai A setuju, tetapi partai B menentangnya karena tidak sesuai aspirasi rakyat. (majemuk kompleks)','Kalimat simpleks dapat panjang asalkan hanya terdiri atas satu klausa. Dalam kalimat kompleks, klausa subordinatif (anak kalimat) tidak dapat berdiri sendiri.','','9.5.1'],
   ['Kalimat majemuk (setara) memakai dan, serta, atau, tetapi, sedangkan, padahal, atau melainkan; kalimat kompleks memakai konjungsi subordinatif seperti ketika, karena, jika, agar, meskipun, bahwa, atau yang.','Ibu memasak, sedangkan ayah membaca koran. (majemuk) · Yoga berkata bahwa ibunya akan datang. (kompleks) · Lukisan yang pernah menghebohkan itu dibuat Afgani. (kompleks)','','','9.5.1.2–3'],
   ['Menurut bentuk sintaktisnya, kalimat dibagi menjadi deklaratif (berita), imperatif (perintah), interogatif (tanya), dan eksklamatif (seru).','Dia sudah pulang. · Tutup pintu itu! · Kapan dia pulang? · Alangkah indahnya pantai ini!','','','9.5.3'],
   ['Kalimat pasif dibentuk dengan di- (pelaku sesudah verba, oleh boleh hadir) atau tanpa di- jika pelakunya pronomina persona (pelaku langsung di depan verba).','Seorang asisten diangkat (oleh) Pak Budi. · Mobil itu sudah saya cuci. · Buku ini perlu kaubaca.','oleh wajib hadir jika verba tidak langsung diikuti pelakunya: Rumah itu harus diperbaiki dengan segera oleh Pak Saleh. Kata seperti sudah dan akan diletakkan di depan pelaku.','Buku itu dibaca saya. → Buku itu saya baca. · Mobil itu saya sudah cuci. → Mobil itu sudah saya cuci.','9.5.2.1.3']
   ],
   jebakan:['Objek dapat menjadi subjek kalimat pasif; pelengkap tidak (berjualan barang, menjadi ketua).','Kalimat inti tidak boleh membuang objek atau pelengkap wajib.','Pasif dengan pronomina: Buku itu saya baca, bukan Buku itu dibaca saya.','Kalimat panjang belum tentu majemuk; hitung klausanya (pasangan subjek-predikat).','Preposisi di depan subjek menghilangkan subjek: Bagi siswa diwajibkan … → Siswa diwajibkan ….']},
 {sub:'Kalimat efektif: kesepadanan', ref:'Kalimat efektif', src:'',
   def:'Kalimat efektif adalah kalimat yang mewakili gagasan penulis secara tepat sehingga pembaca menangkap gagasan yang sama. Kesepadanan berarti struktur kalimat seimbang dengan gagasannya: unsur wajib, yaitu subjek dan predikat, hadir dan jelas.',
   guna:'Langkah memeriksa: cari predikatnya, cari subjeknya, lalu pastikan unsur yang dituntut predikat (objek, pelengkap, keterangan wajib) hadir. Sebagian besar kalimat tidak efektif di soal gagal pada langkah ini.',
   ruj:'TBBI edisi IV (9.2.2 unsur wajib, 9.3.2 fungsi sintaktis, 9.5.1.2 kalimat kompleks); contoh soal PBM dan PPU 2026 (KatKiel Project).',
   aturan:[
   ['Kalimat sekurang-kurangnya memiliki subjek dan predikat; keduanya unsur wajib.','Mereka menghadiri pertemuan itu kemarin sore.','Keterangan seperti barangkali dan kemarin sore boleh dihilangkan, sedangkan subjek dan predikat tidak.','Menghadiri pertemuan itu kemarin sore. → Mereka menghadiri pertemuan itu kemarin sore.','TBBI 9.2.2'],
   ['Klausa subordinatif (anak kalimat) tidak boleh berdiri sendiri; ia harus bergabung dengan klausa utama.','Acara ditunda karena hujan deras. · Karena hujan deras, acara ditunda.','Kalimat yang diawali karena, jika, agar, meskipun, atau ketika tanpa klausa utama adalah kalimat tidak lengkap. Soal PPU 2026 menyebutnya kalimat tidak logis.','Acara ditunda. Karena hujan deras. → Acara ditunda karena hujan deras. · Karena galur unggul dapat dipatenkan sehingga penggunaannya dilindungi undang-undang. → Galur unggul dapat dipatenkan sehingga penggunaannya dilindungi undang-undang.','TBBI 9.5.1.2'],
   ['Subjek tidak didahului preposisi (dalam, bagi, untuk, kepada, di, pada, dari). Preposisi mengubah subjek menjadi keterangan sehingga kalimat kehilangan subjek.','Rapat itu membahas anggaran. · Dalam rapat itu, peserta membahas anggaran. · Siswa diwajibkan memakai seragam.','Perbaikannya: hapus preposisinya, atau tambahkan subjek baru sesudah keterangan itu.','Dalam rapat itu membahas anggaran. → Rapat itu membahas anggaran. · Bagi siswa diwajibkan memakai seragam. → Siswa diwajibkan memakai seragam.','TBBI 9.3.2.2'],
   ['Menurut … tidak digabung dengan verba pelapor (mengatakan, menyampaikan, menyatakan) untuk pelaku yang sama.','Menurut ketua, rapat ditunda. · Ketua menyampaikan bahwa rapat ditunda.','Menurut X menjadikan X keterangan, sedangkan menyampaikan menuntut X sebagai subjek. Pakai salah satu saja.','Menurut ketua menyampaikan bahwa rapat ditunda. → Ketua menyampaikan bahwa rapat ditunda.','UTBK PBM 2026'],
   ['Dua subjek tidak menumpuk dalam satu klausa, dan pelaku pronomina pada kalimat pasif diletakkan langsung di depan verba.','Pemandu itu sangat ramah. · Tugas itu sudah kami selesaikan.','','Pemandu itu ia sangat ramah. → Pemandu itu sangat ramah. · Tugas itu kami sudah selesaikan. → Tugas itu sudah kami selesaikan.','TBBI 9.5.2.1.3'],
   ['Kata yang tidak diletakkan tepat di depan predikat; yang mengubah predikat menjadi pewatas subjek sehingga kalimat kehilangan predikat.','Siswa itu lulus tahun ini. · Siswa yang lulus tahun ini mendapat beasiswa.','Jika ada yang, pastikan masih ada predikat sesudah bagian yang itu.','Siswa yang lulus tahun ini. → Siswa itu lulus tahun ini.','TBBI 7.1.5.4.5'],
   ['Ketegasan: bagian yang dipentingkan dapat ditonjolkan dengan diletakkan di awal kalimat atau diberi partikel -lah, tanpa merusak struktur.','Dialah yang menulis laporan itu. · Kemarin Dita membeli mangga. (menekankan waktu)','TBBI mencatat bahwa keterangan di awal kalimat menambah informasi, misalnya peristiwa itu terjadi kemarin, bukan hari lain.','','TBBI 9.3.2.1; 9.4.1.1']
   ],
   jebakan:['Kalimat panjang yang diawali Dalam, Bagi, atau Menurut sering kehilangan subjek.','Kalimat yang diawali Karena tanpa klausa utama adalah kalimat tidak lengkap.','Menurut … menyampaikan: hapus salah satu.','Opsi perbaikan yang membuang preposisi tetapi mengubah makna juga salah.']},
 {sub:'Kalimat efektif: kehematan dan kecermatan', ref:'Kalimat efektif', src:'',
   def:'Kehematan berarti kalimat tidak memakai kata yang tidak perlu: tidak mengulang subjek, tidak memakai kata yang maknanya sudah terkandung dalam kata lain (pleonasme), dan tidak menjamakkan dua kali. Kecermatan berarti pilihan dan susunan kata tepat sehingga tidak menimbulkan tafsiran ganda.',
   guna:'Uji kehematan: hapus satu kata. Jika makna tidak berubah dan kalimat tetap gramatikal, kata itu mubazir. Kerangka acuan PBM 2026 menyebut "penentuan kata yang mubazir" dan "penentuan kalimat ringkas" secara eksplisit.',
   ruj:'Kerangka acuan UTBK 2026; TBBI edisi IV (4.1.2.6 preposisi tetap, 7.4 konsep jamak, 9.3.2.3 objek, 10.3 pelesapan); Chaer & Muliastuti, Semantik Bahasa Indonesia Modul 1 (makna kolokatif); contoh soal PBM 2026 (KatKiel Project).',
   aturan:[
   ['Subjek yang sama tidak diulang pada klausa kedua.','Ia langsung pulang setelah menerima kabar itu.','Subjek klausa kedua yang sama dengan klausa pertama lazim dilesapkan.','Ia langsung pulang setelah ia menerima kabar itu. → Ia langsung pulang setelah menerima kabar itu.','TBBI 10.3'],
   ['Hindari kata bermakna sama yang berderet (pleonasme).','agar · adalah · sejak · demi · naik · mundur · sangat indah','','agar supaya → agar · adalah merupakan → adalah · sejak dari → sejak · demi untuk → demi · naik ke atas → naik · mundur ke belakang → mundur · sangat indah sekali → sangat indah',''],
   ['Hindari jamak ganda: penanda jamak (para, banyak, semua, beberapa, bilangan) tidak digabung dengan bentuk ulang yang juga menyatakan jamak.','para siswa · banyak rumah · rumah-rumah · semua guru · dua ekor kucing','Bentuk ulang dan kata seperti para sudah menyatakan jamak.','para siswa-siswa → para siswa · banyak rumah-rumah → banyak rumah · semua guru-guru → semua guru','TBBI 7.4'],
   ['Verba transitif langsung diikuti objek, tanpa preposisi.','membahas masalah · mendiskusikan rencana · menyasar pelajar · mempelajari bahasa','Objek berada langsung sesudah predikat verba transitif.','membahas tentang masalah → membahas masalah · mendiskusikan mengenai rencana → mendiskusikan rencana · menyasar kepada pelajar → menyasar pelajar','TBBI 9.3.2.3'],
   ['Pakai preposisi tetap yang benar dan jangan menumpuk dua penanda untuk satu hubungan.','disebabkan oleh · bergantung pada · sesuai dengan · berbeda dengan · sehubungan dengan','','disebabkan karena hujan → disebabkan oleh hujan · tergantung dari cuaca → bergantung pada cuaca','TBBI 4.1.2.6'],
   ['Kalimat ringkas: pilih bentuk yang paling pendek dengan makna yang tetap sama.','memperbaiki jalan · meneliti dampak banjir · mengevaluasi program','Kalimat paling ringkas tidak boleh membuang informasi penting dari kalimat asal.','melakukan perbaikan terhadap jalan → memperbaiki jalan · mengadakan penelitian mengenai dampak banjir → meneliti dampak banjir','Kerangka acuan 2026'],
   ['Kecermatan: hindari susunan yang dapat ditafsirkan ganda.','kolonel yang istrinya nakal (jelas: yang nakal istrinya)','Ambiguitas muncul jika pewatas dapat merujuk ke dua kata.','istri kolonel yang nakal (siapa yang nakal?) → kolonel yang istrinya nakal',''],
   ['Kecermatan memilih kata: kata harus cocok makna dan pasangannya (kolokasinya) dengan konteks.','gadis cantik · pemuda tampan · pemandangan indah','Chaer menyebutnya makna kolokatif: cantik lazim untuk perempuan, tampan untuk laki-laki, indah untuk alam atau pemandangan.','pemuda yang cantik → pemuda yang tampan','Chaer M1 KB3']
   ],
   jebakan:['Kata mubazir yang paling sering diuji: adalah merupakan, agar supaya, sejak dari, para + bentuk ulang, membahas tentang.','Kalimat paling ringkas tetap harus mempertahankan semua informasi.','Opsi "dihilangkan" pada soal perbaikan kata hanya benar jika maknanya tidak berubah.']},
 {sub:'Kalimat efektif: keparalelan dan kelogisan', ref:'Kalimat efektif', src:'',
   def:'Keparalelan berarti unsur-unsur yang setara dalam satu kalimat, terutama dalam perincian, memakai bentuk yang sama. Kelogisan berarti makna kalimat dapat diterima nalar dan unsur-unsurnya serasi maknanya.',
   guna:'Pada soal perincian, cek bentuk setiap unsur: semuanya nomina (peng-…-an), semuanya verba aktif (meng-), atau semuanya pasif (di-). Pada soal kelogisan, cek apakah pelaku, sasaran, dan hubungan sebab-akibatnya masuk akal.',
   ruj:'TBBI edisi IV (8.2.2.2 korelatif, 9.2.3.1 keserasian makna, 9.2.3.2 keserasian bentuk, 10.2.3 hubungan antarklausa); Chaer & Muliastuti, Semantik Bahasa Indonesia Modul 1 (komponen makna); contoh soal PPU 2026 (KatKiel Project; Tambahan UTBK PPU 2026).',
   aturan:[
   ['Unsur sejajar dalam perincian berbentuk sama: sama-sama nomina, sama-sama verba aktif, atau sama-sama pasif.','memproduksi pupuk, mengolah minyak dan gas, dan memproduksi bahan petrokimia · mengikuti kursus daring, mengakses materi, dan melakukan konsultasi dengan guru','Soal PPU 2026 menanyakan perbaikan frasa perincian seperti ini: pilih opsi yang semua unsurnya berbentuk meng-.','memproduksi pupuk, pengolahan minyak dan gas, dan produksi bahan petrokimia → memproduksi pupuk, mengolah minyak dan gas, dan memproduksi bahan petrokimia · mengikuti kursus daring, mengakses materi, dan konsultasi dengan guru dapat dilakukan → mengikuti kursus daring, mengakses materi, dan melakukan konsultasi dengan guru','UTBK PPU 2026'],
   ['Keparalelan juga berlaku pada pasangan dua unsur dan pada konjungsi korelatif.','baik membaca maupun menulis · tidak hanya cepat, tetapi juga akurat','','baik membaca maupun penulisan → baik membaca maupun menulis','TBBI 8.2.2.2'],
   ['Keserasian makna: pelaku dan sasaran harus cocok dengan verbanya.','Kambing itu memakan rumput. · Nenek membaca koran. · Biaya membangun gedung bertingkat mahal sekali.','Verba membaca menuntut pelaku manusia, sehingga Kucing membaca koran janggal. Mahal cocok untuk biaya, bukan untuk waktu.','Waktu membangun gedung bertingkat mahal sekali. → Biaya membangun gedung bertingkat mahal sekali.','TBBI 9.2.3.1'],
   ['Keserasian bentuk: kata ganti harus sesuai jumlah yang digantikannya.','Pelamar banyak, tetapi mereka tidak memenuhi syarat. · Murid-murid itu menyelesaikan tugas mereka masing-masing.','','Pelamar banyak, tetapi dia tidak memenuhi syarat. → Pelamar banyak, tetapi mereka tidak memenuhi syarat.','TBBI 9.2.3.2'],
   ['Hubungan antarklausa harus logis: konjungsinya sesuai dengan hubungan sebab, hasil, pertentangan, atau urutan.','Jalan licin sehingga banyak kendaraan tergelincir.','','Jalan licin karena banyak kendaraan tergelincir. → Jalan licin sehingga banyak kendaraan tergelincir.','TBBI 10.2.3'],
   ['Ungkapan yang secara harfiah tidak masuk akal sebaiknya diganti.','Untuk menghemat waktu, … · Bapak kami persilakan.','Waktu tidak dapat dipersingkat, dan yang dipersilakan adalah orang, bukan waktu dan tempat.','Untuk mempersingkat waktu, … → Untuk menghemat waktu, … · Waktu dan tempat kami persilakan. → Bapak kami persilakan.',''],
   ['Di soal PPU, "kalimat tidak logis" juga mencakup kalimat yang strukturnya tidak utuh, bukan hanya yang maknanya mustahil.','Salah satunya adalah memperkenalkan robot pintar di kelas.','Contoh soal PPU 2026: kalimat yang strukturnya rusak atau diawali Karena tanpa klausa utama dianggap tidak logis.','Salah satunya bagi yang memperkenalkan robot pintar di kelas. → Salah satunya adalah memperkenalkan robot pintar di kelas.','UTBK PPU 2026']
   ],
   jebakan:['Pada perincian, satu unsur yang bentuknya berbeda (peng-…-an di antara meng-) adalah sumber kesalahannya.','"Tidak logis" di soal PPU juga mencakup kalimat tidak lengkap.','Sebab dan akibat yang tertukar (karena vs sehingga) membuat kalimat tidak logis.']},
 {sub:'Konjungsi', ref:'Kata tugas', src:'TBBI',
   def:'Konjungsi (kata hubung) adalah kata tugas yang menghubungkan dua satuan bahasa, baik yang setara maupun yang tidak setara: kata dengan kata, frasa dengan frasa, klausa dengan klausa, atau kalimat dengan kalimat.',
   guna:'Tentukan dulu hubungan makna kedua bagian yang dihubungkan (penambahan, pertentangan, sebab, hasil, syarat, tujuan, konsesif, waktu), baru pilih konjungsinya. TBBI membagi konjungsi menjadi empat kelompok: koordinatif, korelatif, subordinatif, dan antarkalimat.',
   aturan:[
   ['Konjungsi koordinatif menghubungkan unsur yang setara: dan, serta (penambahan), atau (pemilihan), tetapi, melainkan, padahal, sedangkan (perlawanan atau pertentangan).','Toni dan Ali sedang belajar. · Kamu mau ikut atau tinggal? · Anak itu pandai, tetapi malas. · Dia pura-pura tidak tahu, padahal tahu banyak. · Ibu memasak, sedangkan ayah membaca koran.','tetapi hanya menghubungkan dua unsur, sedangkan dan dan atau dapat lebih. melainkan dipakai sesudah bentuk ingkar bukan atau tidak.','Ini bukan milik saya, tetapi milik ayah saya. → Ini bukan milik saya, melainkan milik ayah saya.','8.2.2.1'],
   ['Dan dalam kalimat majemuk dapat bermakna ‘tambahan’, ‘akibat’, ‘urutan waktu’, atau ‘komentar’.','Dia berbaju putih dan memakai dasi. (tambahan) · Saya melihat anak itu menangis dan langsung memanggil ibunya. (akibat) · Dia memarkir mobil dan berjalan ke kantor. (urutan)','Pada makna akibat dan urutan waktu, kedua klausa tidak dapat dipertukarkan.','','8.2.2.1'],
   ['Atau dapat menyatakan pilihan eksklusif (salah satu saja) atau inklusif (salah satu atau keduanya); untuk makna inklusif dalam ragam formal dipakai dan/atau.','Anda pilih merah atau biru? (eksklusif) · Orang itu akan mendengar dan/atau melihat apa yang dikomunikasikan. (inklusif)','dan/atau tidak dipakai untuk pilihan eksklusif.','Anaknya laki-laki dan/atau perempuan? → Anaknya laki-laki atau perempuan?','8.2.2.1'],
   ['Konjungsi korelatif berpasangan dan harus dipakai lengkap dengan pasangan yang tepat.','baik … maupun … · tidak hanya … tetapi juga … · bukan hanya … melainkan juga … · demikian … sehingga … · entah … entah … · jangankan …, … pun','','baik guru dan murid → baik guru maupun murid · tidak hanya pandai, namun juga rajin → tidak hanya pandai, tetapi juga rajin','8.2.2.2'],
   ['Konjungsi subordinatif waktu, syarat, dan pengandaian.','sejak, ketika, selama, sambil, setelah, sebelum, hingga (waktu) · jika, kalau, apabila, asalkan (syarat) · seandainya, andaikan, sekiranya (pengandaian)','','','8.2.2.3'],
   ['Konjungsi subordinatif tujuan, konsesif, dan pembandingan.','agar, supaya, biar (tujuan) · meskipun, walaupun, biarpun, kendatipun, sekalipun (konsesif) · seperti, seolah-olah, seakan-akan, ibarat, daripada (pembandingan)','Konsesif menyatakan bahwa klausa utama tetap terjadi walaupun ada keadaan yang berlawanan dengannya: Pembangunan tetap berjalan meskipun dana menipis.','','8.2.2.3'],
   ['Konjungsi subordinatif sebab, hasil, alat atau cara, komplementasi, dan atributif.','karena, sebab, oleh karena (sebab) · sehingga, maka(nya), sampai-sampai (hasil) · dengan, tanpa (alat/cara) · bahwa (komplementasi) · yang (atributif)','karena menandai sebab, sedangkan sehingga menandai hasil. Jika keduanya ditukar, logika kalimat terbalik.','Jalan tergenang karena kendaraan tertahan. → Jalan tergenang sehingga kendaraan tertahan.','8.2.2.3'],
   ['Bentuk yang sama dapat menjadi preposisi (jika diikuti kata atau frasa) atau konjungsi (jika diikuti klausa).','karena masalah keuangan (preposisi) · karena uangnya habis (konjungsi) · sebelum pukul lima (preposisi) · sebelum saya datang (konjungsi)','','','8.2.2; 8.2.2.3'],
   ['Konjungsi antarkalimat menghubungkan kalimat dengan kalimat sebelumnya; selalu berada di awal kalimat baru, berhuruf awal kapital, dan diikuti koma.','Meskipun demikian, (pertentangan) · Kemudian, Setelah itu, (kelanjutan) · Selain itu, Lagi pula, (tambahan) · Sebaliknya, (kebalikan) · Bahkan, (penguatan) · Namun, Akan tetapi, (pertentangan) · Dengan demikian, (konsekuensi) · Oleh karena itu, (akibat)','sehingga, sedangkan, dan karena adalah konjungsi intrakalimat, jadi tidak dipakai untuk membuka kalimat baru.','Ia belajar keras. Sehingga ia lulus. → Ia belajar keras sehingga ia lulus. · Ia belajar keras. Sehingga ia lulus. → Ia belajar keras. Oleh karena itu, ia lulus.','8.2.2.4'],
   ['Penghubung di awal paragraf baru merujuk isi paragraf sebelumnya. TBBI menggolongkannya sebagai konjungsi antarkalimat; soal UTBK kerap menyebutnya konjungsi antarparagraf.','Adapun … · Di samping itu, … · Sehubungan dengan itu, … · Oleh karena itu, …','','','8.2.2.4']
   ],
   jebakan:['Tentukan relasinya dulu: sebab (karena) berbeda dari hasil (sehingga); pertentangan (tetapi, padahal) berbeda dari konsesif (meskipun).','Jangan memakai dua konjungsi untuk satu hubungan: Meskipun hujan, tetapi ia datang → Meskipun hujan, ia datang.','Korelatif harus berpasangan tepat: baik … maupun, bukan … melainkan.','sehingga, sedangkan, dan karena tidak membuka kalimat baru.','padahal menyatakan kenyataan yang bertentangan dengan pernyataan sebelumnya; sedangkan membandingkan dua hal yang berbeda.']},
 {sub:'Relasi makna', ref:'Semantik', src:'',
   def:'Relasi makna adalah hubungan makna antara satu kata atau satuan bahasa dengan kata atau satuan bahasa lain, misalnya kesamaan (sinonim), kebalikan (antonim), ketercakupan (hiponim), dan kegandaan makna (polisemi, homonim).',
   guna:'Soal PPU menguji relasi ini dalam konteks bacaan: "paling dekat maknanya", "berlawanan", "lebih luas atau lebih sempit", dan "variasi kata". Kuncinya selalu makna kata itu di kalimatnya, bukan makna pertama di kamus.',
   ruj:'Chaer & Muliastuti, Semantik Bahasa Indonesia, Modul 1 (Universitas Terbuka); TBBI edisi IV; contoh soal PPU 2026 (KatKiel Project; Tambahan UTBK PPU 2026). Modul relasi makna Chaer yang lebih rinci tidak terbuka untuk umum, jadi definisi istilah diringkas dari kaidah semantik yang umum dipakai.',
   aturan:[
   ['Sinonim: kata yang maknanya sama atau mirip. Sinonim jarang sama persis karena komponen maknanya bisa berbeda, sehingga tidak selalu dapat saling menggantikan.','kesulitan – kesusahan · mengusik – mengganggu · rumah, hotel, istana (sama-sama bangunan tempat tinggal)','Chaer membedakan sinonim dengan analisis komponen makna: rumah [+ tempat tinggal tetap], hotel [– tempat tinggal tetap], istana [+ kepala negara]. Bapak dapat dipakai menyapa orang yang dihormati, sedangkan ayah tidak.','Kami mohon kesediaan Ayah Lurah … → Kami mohon kesediaan Bapak Lurah …','Chaer M1 KB2'],
   ['Antonim: kata yang maknanya berlawanan, antara lain mutlak (hidup – mati), bertingkat (panas – dingin, ada tingkat di antaranya), dan relasional (membeli – menjual, guru – murid).','kompleks – sederhana · besar – kecil · hidup – mati','Cari lawan makna sesuai konteks: kompleks dalam "wadah yang besar dan kompleks" berarti rumit, jadi lawannya sederhana, bukan kuno.','','UTBK PPU 2026'],
   ['Hiponim dan hipernim: hiponim bermakna lebih sempit dan tercakup dalam hipernim yang bermakna lebih luas. Sesama hiponim disebut kohiponim.','komputer → teknologi · sekolah → lembaga · mawar → bunga · mawar dan melati (kohiponim)','Soal "makna lebih luas" mencari hipernim; soal "makna lebih sempit" mencari hiponim. Pengecohnya kata yang hanya berkaitan (sekolah – siswa), bukan yang mencakup.','','UTBK PPU 2026'],
   ['Polisemi: satu kata dengan beberapa makna yang masih berhubungan.','kepala (bagian tubuh; pemimpin: kepala sekolah) · memetik (bunga; manfaat)','Soal sinonim kontekstual sering memakai kata polisemi; pengecohnya sinonim dari makna lain kata itu.','','Chaer M1 KB3'],
   ['Homonim: bentuk sama, makna tidak berhubungan. Homofon: bunyi sama, tulisan berbeda. Homograf: tulisan sama, lafal berbeda.','bisa ‘racun’ – bisa ‘dapat’ · bank – bang · apel ‘buah’ – apel ‘upacara’','TBBI juga memakai istilah homonimi untuk imbuhan yang bentuknya sama tetapi fungsinya berbeda, misalnya per- pembentuk verba dan per- pembentuk nomina.','','TBBI 4.2.2.4'],
   ['Variasi kata: kata atau frasa lain yang dapat menggantikan kata di teks tanpa mengubah maknanya dalam konteks itu.','mengusik → mengganggu · dipatahkan (pendapat) → dibantah','Variasi kata harus dapat langsung menggantikan di kalimat itu; terjemahan harfiah atau kata yang hanya berkaitan bukan jawabannya.','','UTBK PBM/PPU 2026'],
   ['Asosiasi: kata yang sering dikaitkan dengan kata lain karena hubungan di luar bahasa, seperti lambang, sifat, atau kebiasaan.','melati – kesucian · merah – keberanian · kerbau – kebodohan','','','Chaer M1 KB3'],
   ['Ambiguitas: frasa atau kalimat yang dapat ditafsirkan lebih dari satu.','anak dosen yang nakal (anaknya atau dosennya?) · buku sejarah baru','Dalam tulisan, ambiguitas dapat dihindari dengan tanda hubung (buku-sejarah baru) atau dengan mengubah susunan.','','EYD V II.B.3b']
   ],
   jebakan:['Sinonim kontekstual: pengecoh utamanya sinonim kata itu dalam makna lain.','Hipernim harus mencakup, bukan sekadar berkaitan: sekolah termasuk lembaga, tetapi siswa bukan jenis sekolah.','Antonim dicari dari makna kata di kalimat itu.']},
 {sub:'Jenis dan perubahan makna', ref:'Semantik', src:'',
   def:'Ragam makna dibedakan menurut sudut pandangnya: leksikal x gramatikal, denotatif x konotatif, konseptual x asosiatif, kata x istilah, dan lugas x kias (Chaer & Muliastuti). Perubahan makna adalah bergesernya makna kata dari waktu ke waktu.',
   guna:'Untuk soal PPU "makna sebenarnya" atau "makna lain dari yang tertulis", gunakan pasangan lugas x kias: apakah kata itu dipakai menurut makna asalnya, atau diumpamakan.',
   ruj:'Chaer & Muliastuti, Semantik Bahasa Indonesia, Modul 1 Kegiatan Belajar 3 "Ragam Makna" (Universitas Terbuka). Bagian perubahan makna diringkas dari kaidah semantik yang umum dipakai karena modul lanjutannya tidak terbuka untuk umum.',
   aturan:[
   ['Makna leksikal: makna kata sesuai referennya, jelas tanpa konteks. Makna gramatikal: makna yang muncul dari proses afiksasi, reduplikasi, atau komposisi.','kepala ‘bagian tubuh’ (leksikal) · terangkat ‘dapat diangkat’ atau ‘tidak sengaja’ (gramatikal) · lebar-lebar ‘selebar mungkin’ (gramatikal) · sate kambing ‘bahannya’ vs sate Madura ‘asalnya’','Chaer mengingatkan bahwa menyebut makna leksikal sebagai "makna kamus" tidak sepenuhnya tepat, karena kamus juga memuat makna lain.','','Chaer M1 KB3'],
   ['Makna denotatif adalah makna sebenarnya. Makna konotatif adalah nilai rasa (positif, negatif, atau netral) yang menyertai kata.','kurus (netral) · langsing (positif) · kerempeng (negatif) · rombongan (netral) vs gerombolan (negatif)','Chaer menegaskan bahwa menyamakan konotasi dengan makna kias adalah kekeliruan. Konotasi dapat berbeda menurut daerah, waktu, dan kelompok sosial.','','Chaer M1 KB3'],
   ['Makna lugas adalah makna sebenarnya; makna kias adalah makna yang diumpamakan dengan hal lain.','berenang di sungai (lugas) · berenang dalam kekayaan (kias) · memetik mawar (lugas) · memetik manfaat (kias)','Soal PPU "kata yang bermakna sebenarnya": pilih kata yang dipakai menurut makna asalnya (memberikan dukungan, belajar), bukan yang diumpamakan (menguras waktu, memicu minat).','','Chaer M1 KB3'],
   ['Makna konseptual sama dengan makna denotatif. Makna asosiatif adalah makna yang muncul karena hubungan kata dengan hal di luar bahasa, termasuk makna kolokatif.','melati ‘kesucian’ · kerbau ‘kebodohan’ · cantik (untuk perempuan), tampan (untuk laki-laki), indah (untuk pemandangan)','','','Chaer M1 KB3'],
   ['Makna kata bersifat umum dan bergantung pada konteks; makna istilah pasti dan khusus di bidangnya.','tangan dan lengan bersinonim dalam bahasa umum, tetapi berbeda dalam kedokteran · istilah umum: imunisasi, deposito · istilah khusus: morfem, klorofil','Istilah juga menjelaskan mengapa gabungan seperti benda asing (istilah medis) termasuk pasangan tetap.','','Chaer M1 KB3'],
   ['Perubahan makna: meluas (cakupannya bertambah) dan menyempit (cakupannya berkurang).','saudara, bapak (meluas: kini juga untuk orang yang bukan kerabat) · sarjana, pendeta (menyempit)','','',''],
   ['Perubahan nilai rasa: ameliorasi (menjadi lebih halus atau positif) dan peyorasi (menjadi lebih kasar atau negatif). Pertukaran tanggapan indra disebut sinestesia.','kata-katanya pedas · suaranya manis (sinestesia)','Chaer mencatat contoh pergeseran konotasi dari waktu ke waktu: ceramah dulu berkonotasi negatif, sekarang positif.','','Chaer M1 KB3']
   ],
   jebakan:['Konotasi adalah nilai rasa, bukan makna kias (Chaer).','"Makna lain dari yang tertulis" berarti makna kias: manisan lahir pada 1950-an berarti mulai muncul.','Kata kerja yang biasanya untuk manusia lalu dipakai untuk benda atau hal (lahir, menguras, memicu) biasanya bermakna kias.']},
 {sub:'Hubungan kata (analogi)', ref:'Semantik', src:'',
   def:'Soal hubungan kata (analogi) meminta pasangan kata yang hubungan maknanya sama dengan pasangan di soal. Yang dibandingkan adalah jenis dan arah hubungannya, bukan topiknya.',
   guna:'Langkah: (1) rumuskan hubungan pasangan soal dalam satu kalimat yang spesifik; (2) uji kalimat itu ke setiap opsi; (3) jika lebih dari satu opsi cocok, buat kalimatnya lebih spesifik.',
   ruj:'Contoh soal PPU 2026 (KatKiel Project; Tambahan UTBK PPU 2026). Strateginya dirangkum dari pola soal karena topik ini tidak dibahas sebagai bab tersendiri dalam TBBI.',
   aturan:[
   ['Rumuskan hubungan dalam kalimat yang spesifik, lalu uji ke setiap opsi.','pembelajaran : teknologi = penerangan : lampu ("proses X memanfaatkan alat Y")','Kalimat yang terlalu umum ("X berhubungan dengan Y") membuat semua opsi tampak benar.','','UTBK PPU 2026'],
   ['Jenis hubungan yang sering muncul: sebab–akibat, proses–alat, bagian–keseluruhan, jenis–golongan, bahan–hasil, pelaku–alat, pelaku–hasil, tempat, fungsi, sinonim, dan antonim.','dehidrasi : stres (sebab–akibat) · jari : tangan (bagian–keseluruhan) · mawar : bunga (jenis–golongan) · benang : kain (bahan–hasil) · penjahit : jarum (pelaku–alat)','','',''],
   ['Arah dan urutan hubungan harus sama.','kayu : meja = benang : kain (bahan → hasil)','Membalik urutan berarti membalik hubungannya.','kayu : meja = kain : benang → kayu : meja = benang : kain',''],
   ['Muatan hubungan juga dibandingkan: positif atau negatif, pasti atau mungkin.','dehidrasi : stres (kondisi buruk memicu efek buruk) · tidur : segar (kondisi baik memicu efek baik)','Pembahas KatKiel menandai soal ini "ragu"; pastikan polanya konsisten di semua opsi sebelum memilih.','','UTBK PPU 2026'],
   ['Kata yang hanya satu topik dengan pasangan soal bukan jawaban.','gunting : penjahit (alat kerja) ≠ kain : penjahit (bahan kerja)','','','']
   ],
   jebakan:['Pengecoh paling umum: opsi yang topiknya mirip, tetapi jenis hubungannya berbeda.','Perhatikan arah: sebab → akibat tidak sama dengan akibat → sebab.']},
 {sub:'Ungkapan, idiom, dan pasangan tetap', ref:'Semantik', src:'',
   def:'Idiom adalah satuan bahasa (kata, frasa, atau kalimat) yang maknanya tidak dapat ditebak dari makna unsur-unsurnya. Pasangan tetap adalah gabungan kata yang lazim muncul bersama atau membentuk istilah, sehingga unsurnya tidak dapat diganti sembarangan.',
   guna:'Uji pasangan tetap: ganti salah satu unsurnya dengan sinonim. Jika gabungannya menjadi janggal atau maknanya berubah (benda asing → benda aneh), itu pasangan tetap.',
   ruj:'TBBI edisi IV (4.1.2.6 preposisi tetap, 9.3.2.4 gabungan padu); Chaer & Muliastuti, Semantik Bahasa Indonesia Modul 1 (makna kolokatif, makna istilah); contoh soal PPU 2026 (KatKiel Project; Tambahan UTBK PPU 2026).',
   aturan:[
   ['Idiom: maknanya tidak dapat ditebak dari unsur-unsurnya.','membanting tulang ‘bekerja keras’ · buah bibir ‘bahan pembicaraan’ · panjang tangan ‘suka mencuri’ · besar kepala ‘sombong’ · akar rumput ‘rakyat kecil’','','',''],
   ['Gabungan verba atau adjektiva dengan nomina yang sudah padu berfungsi sebagai satu kesatuan.','naik haji · turun tangan · lupa daratan · keras kepala · meninggal dunia','','','TBBI 9.3.2.4'],
   ['Pasangan tetap di soal PPU: gabungan kata yang membentuk istilah atau konsep khusus, sehingga unsurnya tidak dapat diganti sinonim.','ramah anak · benda asing (istilah medis) · rumah sakit · meja hijau ‘pengadilan’','Bandingkan dengan frasa bebas yang unsurnya dapat diganti: kesempatan bermain → peluang bermain; aspek kehidupan → segi kehidupan.','','UTBK PPU 2026'],
   ['Preposisi tetap: verba atau adjektiva tertentu selalu berpasangan dengan preposisi tertentu.','sesuai dengan · bergantung pada · berbeda dengan · sehubungan dengan · disebabkan oleh','','sesuai untuk aturan → sesuai dengan aturan · tergantung dari cuaca → bergantung pada cuaca','TBBI 4.1.2.6'],
   ['Peribahasa: kelompok kata atau kalimat yang susunannya tetap dan berisi perbandingan, nasihat, atau prinsip hidup.','bagai air di daun talas ‘tidak berpendirian’ · lain lubuk lain ikannya ‘lain tempat lain adatnya’','','',''],
   ['Makna kolokatif: kata tertentu lazim muncul bersama kata tertentu.','gadis cantik · pemuda tampan · pemandangan indah · arus deras · lalu lintas lancar','','pemuda yang cantik → pemuda yang tampan','Chaer M1 KB3']
   ],
   jebakan:['Uji ganti sinonim: jika gabungannya rusak, itu pasangan tetap.','Frasa dengan adjektiva biasa (harus relevan) atau keterangan (secara sadar) bukan pasangan tetap.']},
 {sub:'Majas', ref:'Stilistika', src:'',
   def:'Majas (gaya bahasa) adalah cara khas mengungkapkan pikiran melalui bahasa. Gorys Keraf membagi gaya bahasa berdasarkan langsung tidaknya makna menjadi gaya bahasa retoris (penyimpangan dari konstruksi biasa untuk efek tertentu) dan gaya bahasa kiasan (penyimpangan yang lebih jauh, terutama pada makna).',

Object.keys(SUB_KAT).forEach(k=>delete SUB_KAT[k]);
MATERI.forEach(b=>b.topik.forEach(t=>{ SUB_KAT[t.sub]=b.kat; }));

const KONSEP2 = MATERI[MATERI.length-1].topik.map(t=>({n:t.sub, subs:[t.sub], fokus:t.aturan.map(a=>a[0].split(':')[0]).slice(0,3).join('; ')}));

/* ---------- Bobot UTBK: urutan konsep berbobot ---------- */
const KONSEP_U=[], KONSEP2_U=[];
(function(){
  const K=KONSEP.slice();
  const w1=[[K[0],2],[K[1],2],[K[2],1],[K[3],1],[K[4],2],
    [{n:'Tanda petik dan tanda kurung',subs:['Tanda petik','Tanda kurung'],fokus:'petik ganda vs tunggal; judul puisi atau artikel memakai petik; kurung vs kurung siku'},1],
    [{n:'Garis miring, elipsis, tanya, seru, apostrof',subs:['Tanda garis miring','Tanda elipsis','Tanda tanya dan seru','Tanda apostrof'],fokus:'garis miring pengganti dan/atau/setiap; elipsis di akhir kalimat; tanda tanya dalam kurung; apostrof'},1],
    [K[6],2],[K[7],2],[K[8],1],[K[9],2],[K[10],2],[K[11],2],[K[12],1],[K[13],1],
    [{n:'Unsur serapan',subs:['Unsur serapan'],fokus:'c/cc/ch/ck/ct menjadi k, s, atau ks; ph, th, q, x; vokal ganda menurut lafal (tim, teater); konsonan ganda menjadi tunggal kecuali massa dan teller; bentuk lazim (napas, paham, pikir, telepon)'},1]];
  const W2={'Hubungan kata (analogi)':3,'Relasi makna':3,'Ungkapan, idiom, dan pasangan tetap':2,'Kalimat efektif: kesepadanan':2,'Konjungsi':2,'Makna imbuhan: akhiran dan konfiks':2};
  const w2=KONSEP2.map(k=>[k,W2[k.n]||1]);
  const swrr=list=>{ const cur=list.map(()=>0), total=list.reduce((a,x)=>a+x[1],0), seq=[]; for(let s=0;s<total;s++){ let bi=0; list.forEach((x,i)=>{ cur[i]+=x[1]; if(cur[i]>cur[bi]) bi=i; }); cur[bi]-=total; seq.push(list[bi][0]); } return seq; };
  w1.forEach(([k,w])=>{ k.w=w; KONSEP_U.push(k); }); w2.forEach(([k,w])=>{ k.w=w; KONSEP2_U.push(k); });
  const s1=swrr(w1), s2=swrr(w2);
  KONSEP.length=0; s1.forEach(k=>KONSEP.push(k)); KONSEP2.length=0; s2.forEach(k=>KONSEP2.push(k));
})();
function rotList(U,cur){ return '<ol class="rot">'+U.map(k=>'<li'+(k===cur?' class="now"':'')+'>'+esc(k.n)+(k.w>1?' <span class="w">'+k.w+' hari</span>':'')+'</li>').join('')+'</ol>'; }

function parseBaku(text){

    if(parts.length<2&&line.includes(',')) parts=line.split(/\s*,\s*/);
    if(parts.length<2){ bad.push((i+1)+': '+line); return; }

function humanCodes(s){

    const out=[]; inner.split(/,\s*/).forEach(tok=>{ const m=/^(I{1,3})\.([A-Z])(?:–[A-Z])?(?:\.(\d+)[a-z]?(?:–[a-z\d]+)?)?$/.exec(tok.trim());
      if(m){ const t=topicForCode(m[1],m[2],m[3]?+m[3]:null), nm=t?t.sub:'EYD V Bab '+m[1]; if(!out.includes(nm)) out.push(nm); } });
    return out.length?'(EYD V · '+out.join(', ')+')':all; });
}
/* Cari kaidah materi yang paling cocok dengan sebuah soal */
const STOPW=new Set('yang dan di ke dari pada untuk dengan atau dalam tidak adalah ini itu juga jika sebagai oleh karena kata kalimat ditulis dipakai huruf tanda bukan harus sama'.split(' '));
function toks(s){ return String(s||'').toLowerCase().replace(/[*"'()·.,;:!?/]/g,' ').split(/\s+/).filter(w=>w.length>=3&&!STOPW.has(w)); }
function bestRule(subs,text){ const q=new Set(toks(text)); let best=null,bs=0;
  MATERI.forEach(b=>b.topik.forEach(t=>{ if(!subs.includes(t.sub)) return; t.aturan.forEach((a,i)=>{ let sc=0; new Set(toks(a[0]+' '+a[1])).forEach(w=>{ if(q.has(w)) sc++; }); if(sc>bs){ bs=sc; best={sub:t.sub,i}; } }); }));
  return bs>=2?best:null; }
function itemText(it,isD){ const k=isD?(it.opsi?(it.opsi.find(o=>o.benar)||{}).teks:''):''; return (isD?it.kaidah:it.pembahasan)+' '+(k||''); }
function ruleBlock(t,rules,focus){
  const li=a=>{ const i=t.aturan.indexOf(a), f=focus&&focus.sub===t.sub&&focus.i===i; return '<li value="'+(i+1)+'"'+(f?' class="rfocus" id="rfocus"':'')+'>'+(f?'<span class="rtag">Sesuai soalmu</span>':'')+'<div>'+rich(a[0])+'</div><div class="ex">'+rich(a[1])+'</div></li>'; };
  const g=GRUP[t.sub];
  if(!g) return '<ol class="rules">'+rules.map(li).join('')+'</ol>';
  const groups=g.map(([lbl,ix],gi)=>({lbl,gi,rs:rules.filter(a=>ix.includes(t.aturan.indexOf(a)+1))})).filter(x=>x.rs.length);
  const used=new Set(groups.flatMap(x=>x.rs)), rest=rules.filter(a=>!used.has(a)); if(rest.length) groups.push({lbl:'Lainnya',gi:99,rs:rest});
  const gs=V.kaidah.gsel||{}; let sel=gs[t.sub];
  if(sel===undefined&&focus&&focus.sub===t.sub){ const fg=groups.find(x=>x.rs.includes(t.aturan[focus.i])); sel=fg?fg.gi:null; }
  if(sel!=null&&!groups.some(x=>x.gi===sel)) sel=null;
  const sv=esc(t.sub), chip=(v,lbl,n,on)=>'<button type="button" class="pchip'+(on?' on':'')+'" data-action="kgrp" data-sub="'+sv+'" data-v="'+v+'" aria-pressed="'+on+'">'+esc(lbl)+' <span>'+n+'</span></button>';
  const peta=groups.length>1?'<div class="peta" role="group" aria-label="Kategori '+sv+'">'+chip('all','Semua',rules.length,sel==null)+groups.map(x=>chip(x.gi,x.lbl,x.rs.length,sel===x.gi)).join('')+'</div>':'';
  const shown=sel==null?groups:groups.filter(x=>x.gi===sel);
  return peta+shown.map(x=>'<div class="kgrp"><div class="kgh">'+esc(x.lbl)+'</div><ol class="rules">'+x.rs.map(li).join('')+'</ol></div>').join('')+
    (sel!=null&&groups.length>1?'<div class="kmore">Hanya kategori ini yang ditampilkan. <button type="button" class="link" data-action="kgrp" data-sub="'+sv+'" data-v="all">Lihat semua kategori</button></div>':'');
}
function rich(s){ return esc(humanCodes(s)).replace(/\*\*\*([^*]+)\*\*\*/g,'<b><i>$1</i></b>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>'); }
function slug(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>{t.hidden=true},2400); }
function pct(a,b){ return b?Math.round(a*100/b):0; }
function dayKey(ts){ const d=new Date(ts); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function srsOf(id){ return S.srs[id]||{due:0,int:0,n:0,ok:0}; }
function todayCount(){ const k=dayKey(Date.now()); return S.dhist.filter(x=>dayKey(x.ts)===k).length+S.history.filter(x=>dayKey(x.ts)===k).length; }
function streak(){ const days=new Set(S.dhist.concat(S.history).map(x=>dayKey(x.ts))); let n=0, t=Date.now(); if(!days.has(dayKey(t))) t-=DAY; while(days.has(dayKey(t))){ n++; t-=DAY; } return n; }
function copyText(txt, ta){

/* ---------- Butir kata baku (dibuat dari daftar) ---------- */
function bakuItem(p){
  const id='kb-'+slug(p.baku);
  const others=shuffle(S.baku.filter(x=>x.baku!==p.baku));
  let perintah, opsi;
  const flip=(slug(p.baku).length%2===0)&&others.length>=4;
  if(others.length>=4 && !flip){
    perintah='Kata berikut yang baku adalah ....';
    opsi=[{teks:p.baku,benar:true},{teks:p.non[0]}].concat(others.slice(0,3).map(o=>({teks:o.non[0]})));
  } else if(flip){
    perintah='Kata berikut yang tidak baku adalah ....';
    opsi=[{teks:p.non[0],benar:true}].concat(others.slice(0,4).map(o=>({teks:o.baku})));
  } else {
    perintah='Kata baku yang tepat adalah ....';
    opsi=[{teks:p.baku,benar:true}].concat(p.non.map(n=>({teks:n})));
  }
  return {id,kategori:'baku',subkategori:'Kata baku',tipe:'PG',perintah,opsi:shuffle(opsi),kaidah:'Bentuk baku: '+p.baku+' (bukan '+p.non.join(', ')+').'};
}
function poolFor(mode){ return poolAll(mode).filter(d=>!S.bad[d.id]); }
function poolAll(mode){
  if(mode==='baku') return S.baku.map(bakuItem);
  if(mode==='campur') return S.drill.slice();
  if(mode==='tanda-baca'||mode==='ejaan'||mode==='kebahasaan') return S.drill.filter(d=>d.kategori===mode);
  if(mode.startsWith('sub:')){ const subs=mode.slice(4).split('|'); return S.drill.filter(d=>subs.includes(d.subkategori)); }
  return [];
}
function rankDue(items){
  const now=Date.now();
  const due=items.filter(d=>srsOf(d.id).due<=now);
  return shuffle(due).sort((a,b)=>{ const sa=srsOf(a.id), sb=srsOf(b.id); const ra=sa.n?(sa.ok<sa.n?0:2):1, rb=sb.n?(sb.ok<sb.n?0:2):1; return ra-rb; });
}
function dueCount(mode){ return rankDue(poolFor(mode)).length; }
function buildDrill(mode,label){
  let pool=rankDue(poolFor(mode)), extra=false;
  if(!pool.length){ pool=shuffle(poolFor(mode)); extra=true; }
  return initSessO({mode,label,items:pool.slice(0,DRILL_SIZE),res:[],extra});
}
function buildPaket(){
  const T=today(), m1='sub:'+T.k.subs.join('|'), m2='sub:'+T.k2.subs.join('|');
  const ids=new Set(); const items=[];
  const take=(arr,n)=>{ for(const d of arr){ if(items.length>=n) break; if(!ids.has(d.id)){ ids.add(d.id); items.push(d); } } };
  take(rankDue(poolFor(m1)),10); take(shuffle(poolFor(m1)),10);
  take(rankDue(poolFor(m2)),20); take(shuffle(poolFor(m2)),20);
  take(rankDue(S.drill.filter(d=>!S.bad[d.id])),20); take(shuffle(poolFor('campur')),20);
  return initSessO({mode:'paket',label:'Paket harian',items,res:[],extra:false});
}

/* ---------- Opsi acak (B10) ----------
   Opsi PG soal teks diacak saat sesi dimulai, kecuali: opsi berurutan (nomor kalimat, urutan, pengelompokan),
   opsi yang ditandai "acak": false (opsi baku), dan soal yang pembahasannya masih menyebut huruf opsi. */
function opsiUrut(t){ const x=String(t||'').toLowerCase().replace(/kalimat|nomor|paragraf|sampai|s\.d\.|\bdan\b/g,''); return /\d/.test(x)&&/^[\s()\d,.\-–—\/]+$/.test(x); }
const HURUF_PB=/(^|[\s;,(.])[A-E](\s*:|\s*\)|\s+dan\s+[A-E]\b|\s*[–-]\s*[A-E]\b|,\s*[A-E]\b)/;
function opsiAcakBoleh(q){ if(q.tipe!=='PG'||!Array.isArray(q.opsi)||q.opsi.length<2||q.acak===false) return false; if(['PPU-14','PBM-2026-urutan'].includes(kodeSoal(q))) return false; return !q.opsi.every(x=>opsiUrut(x&&x.teks)); }
function opsiAcak(q){ return opsiAcakBoleh(q)&&!HURUF_PB.test(String(q.pembahasan||'')); }

/* ---------- Validasi paket ---------- */
function validate(raw){
  const errs=[]; let data;
  const txt=raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
  if(!txt) return {errs:['Kolom masih kosong. Tempel keluaran prompt harian.'],data:null};
  try{ data=JSON.parse(txt); }catch(e){ return {errs:['JSON tidak valid: '+e.message+'. Cek koma berlebih atau tanda kutip yang tidak tertutup.'],data:null}; }
  const T=Array.isArray(data.teks)?data.teks:[], D=Array.isArray(data.drill)?data.drill:[];
  if(!T.length&&!D.length) return {errs:['Tidak ada "drill" maupun "teks" di dalam JSON.'],data:null};
  let nSoal=0;
  D.forEach((d,i)=>{
    const w='Drill '+(i+1)+(d.id?' ('+d.id+')':'');
    if(!d.id) errs.push(w+': "id" kosong.');
    if(!['tanda-baca','ejaan','kebahasaan'].includes(d.kategori)) errs.push(w+': kategori harus "tanda-baca", "ejaan", atau "kebahasaan".');
    else if(SUB_KAT[d.subkategori]&&SUB_KAT[d.subkategori]!==d.kategori) errs.push(w+': subkategori "'+d.subkategori+'" termasuk kategori "'+SUB_KAT[d.subkategori]+'".');
    if(!SUB_KAT[d.subkategori]) errs.push(w+': subkategori "'+(d.subkategori||'')+'" tidak ada di daftar materi.');
    if(!d.perintah) errs.push(w+': perintah kosong.');
    if(!d.kaidah) errs.push(w+': kaidah kosong.');
    if(d.tipe==='isian'){
      const k=d.kalimat||[]; if(k.length<2) errs.push(w+': isian butuh daftar "kalimat" bernomor.');
      const n=+d.kunci_isian; if(!(n>=1&&n<=k.length)) errs.push(w+': kunci_isian harus nomor kalimat 1–'+k.length+'.');
    } else if(d.tipe==='PG'){
      const o=d.opsi||[]; if(o.length!==5) errs.push(w+': PG harus punya 5 opsi (sekarang '+o.length+').');
      if(d.bentuk==='perbaiki'&&!(Array.isArray(d.kalimat)&&d.kalimat.length===1)) errs.push(w+': butir perbaiki butuh tepat 1 kalimat salah di "kalimat".');
      const b=o.filter(x=>x.benar===true).length; if(b!==1) errs.push(w+': harus ada tepat 1 opsi benar (sekarang '+b+').');
    } else errs.push(w+': tipe harus "PG" atau "isian".');
  });
  T.forEach((t,ti)=>{
    const where='Teks '+(ti+1);
    if(!t.id) errs.push(where+': "id" kosong.');
    const old=S.bank.find(b=>b.id===t.id);
    if(!Array.isArray(t.kalimat)&&old){ t=Object.assign({},t,{kalimat:old.kalimat,jenis:t.jenis||old.jenis}); }
    const jenis=t.jenis||'bernomor';
    if(!['bernomor','pendek','lepas','urutan'].includes(jenis)) errs.push(where+': jenis harus "bernomor", "pendek", "lepas", atau "urutan".');
    if(jenis==='urutan'&&Array.isArray(t.kalimat)&&t.kalimat.length!==5) errs.push(where+': soal urutan butuh tepat 5 kalimat (sekarang '+t.kalimat.length+').');
    if((jenis==='pendek'||jenis==='lepas')&&Array.isArray(t.soal)&&t.soal.some(q=>q&&q.subtes==='PBM')) errs.push(where+': soal PBM selalu berupa bacaan bernomor (bukan "'+jenis+'").');
    if(jenis==='lepas'&&!Array.isArray(t.kalimat)) t=Object.assign({},t,{kalimat:[]});
    if(jenis==='pendek'&&Array.isArray(t.kalimat)&&(t.kalimat.length<2||t.kalimat.length>4)) errs.push(where+': soal pendek butuh 2–4 kalimat.');
    if(jenis!=='bernomor'&&Array.isArray(t.soal)&&t.soal.length!==1) errs.push(where+': soal '+jenis+' berisi tepat 1 soal (sekarang '+t.soal.length+').');
    if(!Array.isArray(t.kalimat)||(!t.kalimat.length&&jenis!=='lepas')){ errs.push(where+': "kalimat" harus berupa daftar kalimat (perbaikan soal tanpa "kalimat" hanya bisa untuk teks yang sudah ada di bank).'); return; }
    const nK=t.kalimat.length;
    if(t.kalimat.some(k=>/^\s*\(\d{1,2}\)\s/.test(String(k)))) errs.push(where+(t.id?' ("'+t.id+'")':'')+': kalimat ditulis dengan nomor manual seperti "(1) ...". Hapus nomornya; aplikasi menomori kalimat sendiri.');
    (t.kata_uji||[]).forEach(k=>{ if(!(k.kalimat>=1&&k.kalimat<=nK)) errs.push(where+': kata uji "'+(k.kata||'?')+'" merujuk kalimat ('+k.kalimat+') yang tidak ada.'); });
    if(!Array.isArray(t.soal)||!t.soal.length){ errs.push(where+': tidak ada soal.'); return; }
    t.soal.forEach((q,qi)=>{
      nSoal++;
      const w=where+', soal '+(q.nomor||qi+1);
      if(q.subtes!=='PBM'&&q.subtes!=='PPU') errs.push(w+': subtes harus "PBM" atau "PPU".');
      if(!POLA_IDS.includes(q.pola_id)) errs.push(w+': pola_id "'+(q.pola_id||'')+'" tidak dikenali.');
      if(q.kode!=null&&q.kode!==''){ const K=kodeInfo(q.kode); if(!K) errs.push(w+': kode "'+q.kode+'" tidak dikenali.'); else if(!K.pola.includes(q.pola_id)) errs.push(w+': pola_id "'+(q.pola_id||'')+'" bukan bagian dari kode '+q.kode+' (pilihan: '+K.pola.join(', ')+').'); }
      if(q.mode!=null&&!MODE_LBL[q.mode]) errs.push(w+': mode harus "dasar", "geser", atau "2027".');
      if(q.jenis_soal!=null&&!JENIS_NAMA[q.jenis_soal]) errs.push(w+': jenis_soal harus "L", "G", "B", atau "M".');
      if(q.format!=null&&q.format!==''){ if(!FORMAT_TIPE[q.format]) errs.push(w+': format harus J1, J2, J3, J5, J6, atau J7.'); else if(FORMAT_TIPE[q.format]!==q.tipe) errs.push(w+': format '+q.format+' harus bertipe "'+FORMAT_TIPE[q.format]+'" (sekarang "'+(q.tipe||'')+'").'); }
      if(!q.perintah) errs.push(w+': kalimat perintah kosong.');
      (q.bukti||[]).forEach(b=>{ if(!(b>=1&&b<=nK)) errs.push(w+': bukti kalimat ('+b+') tidak ada di teks.'); });
      (q.drill_terkait||[]).forEach(s=>{ if(!SUB_KAT[s]) errs.push(w+': drill_terkait "'+s+'" tidak ada di daftar materi.'); });
      if(q.tipe==='PG'){
        const o=q.opsi||[];
        if(o.length!==5) errs.push(w+': PG harus punya 5 opsi (sekarang '+o.length+').');
        const benar=o.filter(x=>x.benar===true).length;
        if(benar!==1) errs.push(w+': harus ada tepat 1 kunci (sekarang '+benar+').');
      } else if(q.tipe==='isian'){
        const ki=String(q.kunci_isian==null?'':q.kunci_isian).trim();
        if(!/^\d+$/.test(ki)) errs.push(w+': isian harus punya kunci_isian berupa angka.');
        else if(kodeSoal(q)==='PBM-2026-tebal'){ const nU=(t.kata_uji||[]).length; if(!t.tebal_bernomor||nU<3) errs.push(w+': soal kata bercetak tebal bernomor butuh "tebal_bernomor": true dan minimal 3 "kata_uji".'); else if(!(+ki>=1&&+ki<=nU)) errs.push(w+': kunci_isian "'+ki+'" bukan nomor kata tebal (1–'+nU+').'); }
        else if(nK&&!(+ki>=1&&+ki<=nK)&&!(nK<10&&ki.length===nK&&ki.split('').sort().join('')===Array.from({length:nK},(_,i)=>i+1).join(''))) errs.push(w+': kunci_isian "'+ki+'" tidak ada di teks (kalimat 1–'+nK+').');
      } else if(q.tipe==='pgk'){
        const ps=q.pernyataan||[];
        if(ps.length<3||ps.length>4) errs.push(w+': pgk butuh 3–4 pernyataan (sekarang '+ps.length+').');
        if(ps.some(x=>!x||!x.teks||typeof x.benar!=='boolean')) errs.push(w+': setiap pernyataan pgk butuh "teks" dan "benar": true/false.');
        else if(ps.length&&(ps.every(x=>x.benar)||ps.every(x=>!x.benar))) errs.push(w+': pernyataan pgk harus campuran benar dan salah.');
        if(!(q.jenis_soal==='M'||(!q.jenis_soal&&q.mode==='2027'))) errs.push(w+': tipe pgk (tabel benar/salah) hanya untuk jenis M.');
      } else errs.push(w+': tipe harus "PG", "isian", atau "pgk".');
    });
  });
  /* ---------- Anti-tebak (aturan-opsi-setara.md) ----------
     Berat → errs (paket tidak bisa disimpan). Ringan → warns (boleh disimpan, tetap dilaporkan). */
  const warns=[];
  const wc=t=>String(t||'').trim().split(/\s+/).filter(Boolean).length;
  const PINTAS=/^(semua(nya)?(\s+(jawaban|pilihan|opsi|pernyataan))?(\s+di\s+atas)?\s+(benar|salah|tepat)|tidak\s+ada(\s+(jawaban|pilihan|opsi|pernyataan))?(\s+yang)?(\s+(benar|tepat|salah))?(\s+di\s+antaranya)?)\s*[.!]?$/i;
  const HATI=/\b(dapat|cenderung|sebagian|mungkin|umumnya|biasanya|sering|kerap|relatif|hampir)\b/i;
  const STOPW2=new Set(['yang','dalam','dengan','untuk','pada','adalah','kalimat','tersebut','berikut','paling','tepat','bacaan','teks','dari','kata','sebagai','merupakan','manakah','terdapat','nomor']);
  let nPG=0,nLong=0;
  const cekPG=(q,lbl,acak,seq)=>{ const o=q.opsi; if(!Array.isArray(o)||o.length!==5) return; const ki=o.findIndex(x=>x&&x.benar===true); if(ki<0) return;
    const T=o.map(x=>String(x&&x.teks||'').trim()), w=T.map(wc); seq.push([lbl,ki]);
    const jp=T.find(t=>PINTAS.test(t)); if(jp) errs.push(lbl+': ada opsi jalan pintas "'+jp+'". Ganti dengan pengecoh yang hampir benar.');
    if(!acak||kodeSoal(q)==='PBM-14'||q.pola_id==='PBM-diksi-seharusnya') return;
    const mx=Math.max(...w), mn=Math.min(...w), mxLain=Math.max(...w.filter((_,i)=>i!==ki));
    if(mx<4) return; nPG++;
    if(w[ki]===mx&&w.filter(x=>x===mx).length===1){ nLong++; if(w[ki]>=1.3*mxLain&&w[ki]-mxLain>=2) errs.push(lbl+': kunci jauh lebih panjang ('+w[ki]+' kata; opsi lain paling panjang '+mxLain+' kata). Samakan panjang opsi.'); }
    if((mx-mn)/mx>0.3) warns.push(lbl+': selisih panjang opsi '+mn+'–'+mx+' kata, lebih dari 30%.');
    if(HATI.test(T[ki])&&!T.some((t,i)=>i!==ki&&HATI.test(t))) warns.push(lbl+': hanya kunci yang memakai kata hati-hati ("'+T[ki].match(HATI)[0]+'"). Sebarkan ke pengecoh juga.');
    const stem=[...new Set((String(q.perintah||'').toLowerCase().match(/[a-z]{5,}/g)||[]).filter(x=>!STOPW2.has(x)))], has=t=>stem.filter(x=>t.toLowerCase().includes(x)), hk=has(T[ki]);
    if(hk.length&&T.every((t,i)=>i===ki||!has(t).length)) warns.push(lbl+': hanya kunci yang mengulang kata "'+hk[0]+'" dari kalimat perintah.'); };
  const tiga=(seq,nama)=>{ for(let k=2;k<seq.length;k++) if(seq[k][1]===seq[k-1][1]&&seq[k][1]===seq[k-2][1]){ errs.push(nama+': tiga kunci berturut-turut sama-sama '+('ABCDE'[seq[k][1]])+' ('+seq[k-2][0]+' sampai '+seq[k][0]+'). Sebar huruf kunci.'); break; } };
  const sqD=[], sqT=[], huruf=[];
  D.forEach((d,i)=>{ if(d.tipe==='PG') cekPG(d,'Drill '+(i+1)+(d.id?' ("'+d.id+'")':''),true,sqD); });
  T.forEach((t,ti)=>(Array.isArray(t.soal)?t.soal:[]).forEach((q,qi)=>{ if(q.tipe!=='PG') return; const lbl='Teks '+(ti+1)+(t.id?' ("'+t.id+'")':'')+', soal '+(q.nomor||qi+1);
    cekPG(q,lbl,opsiAcakBoleh(q),sqT);
    if(opsiAcakBoleh(q)&&HURUF_PB.test(String(q.pembahasan||''))) huruf.push(lbl); }));

## Pengecoh gaya UTBK (WAJIB, ini yang membuat soal tidak mudah ditebak)
P0. Setiap pengecoh mewakili SATU kesalahan bernama: pengecoh khas slotnya, atau salah satu dari: benar menurut teks tetapi tidak menjawab pertanyaan; cakupan terlalu luas atau terlalu sempit; modalitas atau kepastian bergeser; sebab-akibat terbalik; detail dari bagian atau teks lain; satu kata kunci diganti; masuk akal secara umum tetapi tidak ada di teks.
P1. Setiap opsi salah harus "hampir benar": terdengar masuk akal sekilas dan salah karena SATU alasan yang hanya terlihat jika teks dibaca teliti. Minimal 2 opsi per soal harus tampak benar bagi pembaca yang terburu-buru. Paling banyak satu pengecoh lemah per soal; tidak boleh ada opsi konyol, keluar topik, atau jelas bertentangan dengan teks.
P2. Opsi sejajar: panjang, struktur, dan tingkat formalitas mirip. Selisih jumlah kata opsi terpanjang dan terpendek paling banyak 30%. Dalam satu paket, kunci menjadi opsi terpanjang paling banyak 1 dari 5 soal; kunci boleh menjadi salah satu opsi terpendek. Kunci tidak boleh menjadi opsi yang paling lengkap atau paling formal. Kalau satu opsi memuat alasan ("karena …"), semua opsi memuat alasan. Kata hati-hati (dapat, cenderung, sebagian, mungkin) dan kata mutlak (pasti, selalu, semua, satu-satunya) tersebar di kunci DAN pengecoh; kunci tidak boleh menjadi satu-satunya opsi yang berhati-hati.
P3. Pengecoh per tipe soal:
   - Makna kata/sinonim/antonim kontekstual: pakai kata yang bermakna polisemi; pengecoh utama = sinonim kata itu dalam MAKNA LAIN (makna kamus yang tidak cocok dengan konteks kalimat).
   - Ungkapan kembali/makna sama: satu opsi per modalitas (pasti, biasanya, seharusnya, sepertinya); tukar pelaku dan sasaran; pindahkan induk klausa "yang"; kunci mempertahankan isi DAN kadar kepastian.
   - Imbuhan: pengecoh memakai imbuhan yang sama tetapi makna berbeda (pe-an 'proses' vs 'hal' vs 'tempat'); kunci tidak boleh bisa dipilih hanya dari bentuk katanya.
   - Konjungsi/penggabungan: pengecoh adalah konjungsi yang relasinya mirip (sehingga vs karena vs maka; tetapi vs padahal vs meskipun).
   - Perbaikan/kalimat efektif: pengecoh memperbaiki separuh masalah, atau memperbaiki kesalahan tetapi menimbulkan kesalahan baru. Pada perincian sejajar, pengecoh hanya menyeragamkan sebagian unsur (misalnya dua unsur meng- dan satu unsur peng-…-an).
   - Kalimat inti/informasi utama: pengecoh membuang unsur wajib atau ikut membawa keterangan.
   - Rumpang dua kata: pengecoh = kata pertama benar & kedua salah, dan sebaliknya.
   - Judul/gagasan: pengecoh hanya mencakup satu paragraf atau terlalu umum.
   - Sisipan/urutan: pengecoh = satu posisi lebih awal atau lebih akhir.
   - Ejaan/tanda baca (isian nomor kalimat): selain satu kalimat yang memang salah, tanam 1–2 "kalimat umpan" yang tampak salah tetapi sebenarnya benar menurut EYD V (misalnya koma setelah keterangan awal yang panjang, kata baku yang jarang dipakai, huruf kapital nama jenis yang benar ditulis kecil).
P4. Uji anti-tebak sebelum mengirim. Untuk tiap soal tanyakan: (a) apakah bisa dijawab tanpa membaca teks? (b) apakah ada opsi yang bisa dicoret dalam 2 detik karena topiknya lain, tata bahasanya rusak, atau jelas absurd? (c) apakah kunci menonjol karena panjang atau gayanya? Jika salah satu jawabannya "ya", ganti opsi atau soalnya.
P5. Sebar kunci A–E merata dan jangan lebih dari 2 kunci sama berturut-turut.
P6. Kunci berupa parafrase, bukan salinan kalimat teks; pengecoh boleh memakai kata persis dari teks. Hindari petunjuk dari luar isi: kunci yang menjadi satu-satunya opsi yang mengulang kata dari kalimat perintah, dua opsi yang saling berlawanan sehingga kunci pasti salah satunya, dan opsi "semua benar", "semua salah", "tidak ada yang benar", atau "tidak ada".
P7. Aplikasi mengacak urutan opsi PG, jadi "pembahasan" TIDAK BOLEH menyebut huruf opsi; rujuk opsi dengan kutipan singkat isinya. Opsi yang urutannya bermakna (nomor kalimat, urutan kalimat, pengelompokan kalimat) ditulis berurutan naik dan tidak diacak; opsi baku disalin persis dan soalnya diberi "acak": false.

function tasksOn(date){

function lastTs(id,sub){ const h=S.history.filter(x=>x.teksId===id&&(!sub||x.subtes===sub)); return h.length?Math.max(...h.map(x=>x.ts)):0; }
function nextTexts(sub,n,preferSim){
  const pool=S.bank.filter(t=>t.soal.some(q=>!sub||q.subtes===sub)); if(!pool.length) return [];
  const rank=t=>(preferSim?(t.paket==='simulasi'?0:1e15):(t.paket==='simulasi'?1e15:0))+lastTs(t.id,sub);
  return pool.slice().sort((a,b)=>rank(a)-rank(b)).slice(0,n);
}
function startTeksMulti(texts,opt){
  opt=opt||{}; const sub=opt.sub, qs=[];
  texts.forEach(t=>t.soal.forEach((q,i)=>{ if(S.bad[t.id+'#'+q.nomor]) return; if(!sub||sub==='campur'||q.subtes===sub) qs.push([t.id,i]); }));
  const lim=opt.max?qs.slice(0,opt.max):qs; if(!lim.length){ location.hash='#bank'; return; }
  const perm=lim.map(([tid,i])=>{ const tt=texts.find(t=>t.id===tid), q=tt&&tt.soal[i]; return q&&opsiAcak(q)?shuffle(q.opsi.map((_,j)=>j)):null; });
  V.run=initSess({teksId:texts[0].id,teksIds:texts.map(t=>t.id),sub,qs:lim,perm,label:opt.label||null,cek:opt.cek||null,started:Date.now(),limit:opt.timed?Math.round(lim.length*(PACE[sub]||60)*1000):0,res:[]},lim.length); V.confirmEnd=false;
  if(location.hash==='#soal') render(); else location.hash='#soal';
}
function startTeks(sub, teksId){
  const t=teksId?S.bank.find(x=>x.id===teksId):nextTeks(sub==='campur'?null:sub); if(!t){ location.hash='#bank'; return; }
  startTeksMulti([t],{sub});
}
/* paket teks harian: ambil teks (utama, pendek, lepas) sampai sekitar 10 soal */
function dailyTexts(sub){ const out=[]; let n=0; for(const t of nextTexts(sub,999,false)){ if(n>=(SOAL_HARI[sub]||10)) break; const k=t.soal.filter(q=>q.subtes===sub&&!S.bad[t.id+'#'+q.nomor]).length; if(!k) continue; out.push(t); n+=k; } return out; }
function startDailyTeks(sub){ const ts=dailyTexts(sub); if(!ts.length){ location.hash='#bank'; return; } startTeksMulti(ts,{sub,label:'Teks '+sub+(V.paket?' · '+(1+(V.paket.done||[]).length)+'/'+V.paket.total:'')}); }
/* langkah berikutnya paket harian: subtes yang belum dikerjakan di paket ini dan punya teks di bank */
function paketNext(){ const P=V.paket; if(!P) return null; for(const sub of ['PPU','PBM']){ if((P.done||[]).includes(sub)) continue; const ts=dailyTexts(sub); if(ts.length) return {sub,nq:ts.reduce((n,t)=>n+t.soal.filter(q=>q.subtes===sub&&!S.bad[t.id+'#'+q.nomor]).length,0)}; } return null; }
function simCount(sub){ let n=0; nextTexts(sub,99,true).forEach(t=>{ n+=t.soal.filter(q=>q.subtes===sub).length; }); return Math.min(20,n); }
function startSim(sub){
  const all=nextTexts(sub,99,true), pick=[]; let n=0;
  for(const t of all){ if(n>=20) break; pick.push(t); n+=t.soal.filter(q=>q.subtes===sub).length; }
  if(!pick.length){ toast('Belum ada teks '+sub+'. Tempel hasil prompt Simulasi dulu.'); location.hash='#prompt'; return; }
  V.paket=null; startTeksMulti(pick,{sub,max:20,label:'Simulasi '+sub,cek:'akhir',timed:true});
  if(n<20) setTimeout(()=>toast('Baru ada '+Math.min(n,20)+' soal '+sub+'. Tempel prompt Simulasi untuk 20 soal.'),300);
}
function renderSentence(t,i,focus,proof){

/* ---------- Kartu geser kata baku ---------- */
function pairId(p){ return 'kb-'+slug(p.baku); }
function swPick(){
  const W=V.sw, now=Date.now();
  let pool=W.onlyWrong?W.onlyWrong:S.baku;
  const recent=W.recent||[];
  let cand=pool.filter(p=>!recent.includes(pairId(p)));
  if(!cand.length) cand=pool;
  const rank=p=>{ const s=srsOf(pairId(p)); if(s.n&&s.ok<s.n&&s.due<=now) return 0; if(!s.n) return 1; if(s.due<=now) return 2; return 3; };
  const best=Math.min(...cand.map(rank));
  const top=shuffle(cand.filter(p=>rank(p)===best)).slice(0,1)[0];
  const showBaku=Math.random()<0.5;
  const word=showBaku?top.baku:top.non[Math.floor(Math.random()*top.non.length)];
  return {p:top,showBaku,word};
}
function startSwipe(onlyWrong){
  V.sw={seen:0,ok:0,wrong:[],recent:[],onlyWrong:onlyWrong||null,cur:null,fb:null,done:false};
  V.sw.cur=swPick(); go('swipe');
}
function swAnswer(saysBaku){
  const W=V.sw; if(!W||W.fb||!W.cur) return;
  const c=W.cur, ok=(saysBaku===c.showBaku), id=pairId(c.p), s=srsOf(id), int=ok?(s.int?Math.round(s.int*2.5):3):0;
  S.srs[id]={due:ok?Date.now()+int*DAY:0,int,n:s.n+1,ok:s.ok+(ok?1:0)};
  S.dhist.push({id,kat:'baku',sub:'Kata baku',correct:ok,ts:Date.now()}); save();
  W.seen++; if(ok) W.ok++; else if(!W.wrong.some(x=>x.baku===c.p.baku)) W.wrong.push(c.p);
  W.recent=(W.recent||[]).concat(id).slice(-6);
  W.fb={ok,dir:saysBaku?1:-1};
  const card=$('#swcard');
  if(card){ card.style.transition='transform .22s ease-out, opacity .22s'; card.style.transform='translateX('+(saysBaku?420:-420)+'px) rotate('+(saysBaku?18:-18)+'deg)'; card.style.opacity='0'; }
  setTimeout(()=>{ render(); },200);
}
function swNext(){ const W=V.sw; if(!W||W.done||!W.fb) return; clearTimeout(W._t); W.fb=null; W.cur=swPick(); if(route()==='swipe') render(); }

  const W=V.sw; if(!W) return viewBeranda();
  if(W.done) return viewSwipeDone();
  const c=W.cur;
  let h=navbar('Keluar',W.onlyWrong?'Ulang yang salah':'Kata baku',W.seen?W.ok+'/'+W.seen:'',null);
  h+='<div class="swstage">';

    const p=c.p;
    h+='<div class="swcard fb '+(W.fb.ok?'good':'badc')+'" id="swfb">'+
       '<div class="swverdict">'+(W.fb.ok?'Benar':'Belum tepat')+'</div>'+
       '<div class="swword">'+esc(p.baku)+'</div><div class="swsub">baku</div>'+
       '<div class="swnon">tidak baku: '+esc(p.non.join(', '))+'</div>'+
       '<div class="swhint">Geser ke mana saja atau ketuk Lanjut</div></div>';
  } else {
    h+='<div class="swcard" id="swcard"><span class="stamp yes" aria-hidden="true">BAKU</span><span class="stamp no" aria-hidden="true">TIDAK BAKU</span>'+

  }

const REL_IC={sebab:'⬅️',akibat:'➡️',pertentangan:'↔️',konsesif:'🛡️',syarat:'🔑',tujuan:'🎯',waktu:'⏱️',tambahan:'➕'};
const REL_S={sebab:'Sebab',akibat:'Akibat',pertentangan:'Pertentangan',konsesif:'Pengakuan',syarat:'Syarat',tujuan:'Tujuan',waktu:'Waktu',tambahan:'Tambahan'};
function gVRel1(c){ const others=shuffle(Object.keys(REL_N).filter(r=>r!==c.rel&&r!==REL_CONF[c.rel])).slice(0,3); return Object.assign(gMk([c.rel].concat(others),0),{id:c.id,a:c.a,b:c.b,k:c.k,rel:c.rel,pick:null}); }
function gVRel2(c){ const others=shuffle(RELASI.filter(x=>x[0]!==c.a)).slice(0,3), dec=shuffle(c.opts.filter(o=>o!==c.k))[0];
  const rows=[{a:c.a,k:dec,b:c.b}].concat(others.map(x=>({a:x[0],k:x[2],b:x[1]}))), m=gMk(rows,0);
  const fix=shuffle([c.k].concat(shuffle(c.opts.filter(o=>o!==c.k&&o!==dec)).slice(0,2)));
  return {id:c.id,rows:m.opts,ansI:m.ansI,dec,k:c.k,rel:c.rel,fix,step:'find',miss:0,pick:null}; }
/* Pisah atau Sambung */
const PISAH_AMB=new Set(['ke|luar kota','ada|pun','ke|dua']); /* bentuk salahnya juga kata yang benar dalam konteks lain */
function ruleConf(r){ return r===R_SATU?[R_GAB]:r===R_DUA?[R_PADU]:r===R_PADU?[R_DUA]:[]; } /* aturan yang juga benar untuk kata yang sama */
function ruleShort(r){ return ({[R_DEPAN]:'Kata depan di/ke/dari',[R_AWAL]:'Awalan di-/ke-',[R_TERIKAT]:'Bentuk terikat',[R_GAB]:'Gabungan kata',[R_PADU]:'Gabungan yang sudah padu',[R_DUA]:'Dapat awalan + akhiran',[R_SATU]:'Hanya awalan atau akhiran',[R_PUN]:'pun = "juga"',[R_PUNP]:'pun dalam penghubung',[R_PER]:'per = "tiap/mulai"',[R_PERA]:'Awalan per-',[R_LAH]:'Partikel -lah/-kah/-nya'})[r]||r; }
function gVPisah1(c){ const ban=ruleConf(c.rule), rules=[...new Set(PISAH.map(x=>x[3]))].filter(r=>r!==c.rule&&!ban.includes(r));
  return Object.assign(gMk([c.rule].concat(shuffle(rules).slice(0,3)),0),{id:c.id,a:c.a,b:c.b,join:c.join,rule:c.rule,pick:null}); }
function gVPisah2(c){ if(PISAH_AMB.has(c.a+'|'+c.b)) return null; const pick=[], seen=new Set([c.a+c.b]);
  for(const x of shuffle(PISAH)){ if(pick.length>=3) break; if(seen.has(x[0]+x[1])) continue; seen.add(x[0]+x[1]); pick.push({a:x[0],b:x[1],join:!!x[2],ok:true}); }
  const m=gMk([{a:c.a,b:c.b,join:!c.join,ok:false}].concat(pick),0);
  return {id:c.id,sets:m.opts,ansI:m.ansI,a:c.a,b:c.b,join:c.join,rule:c.rule,pick:null}; }
/* Pangkas */
function gEff(c){ return gJoinKept(c.words,c.groups.map(g=>g[g.length-1])); }
function gVPangkas1(c){ const keep=c.words.map((_,j)=>j).filter(j=>!c.groups.some(g=>g.includes(j))&&!c.opt.includes(j)), seen=new Set([gEff(c),c.s]), list=[gEff(c),c.s];
  for(const j of shuffle(keep)){ if(list.length>=4) break; const t=gJoinKept(c.words,[j]); if(!seen.has(t)){ seen.add(t); list.push(t); } }
  if(list.length<4) return null; return Object.assign(gMk(list,0),{id:c.id,why:c.why,pick:null}); }
function gVPangkas2(c){ const all=shuffle([c].concat(shuffle(PANGKAS.map(gRoundPangkas).filter(x=>x.id!==c.id)).slice(0,3))), items=[], bad=[], whys=[];
  all.forEach((x,j)=>{ const red=Math.random()<.5; items.push(red?x.s:gEff(x)); whys.push(red?x.why:''); if(red) bad.push(j); });
  return {id:c.id,items,bad,whys,seq:0,res:[],miss:0}; }
/* Bengkel Kata Baku */
function gBreak(x){ const nons=x.p.non.filter(n=>!/\s/.test(n)); if(!nons.length) return null; const non=nons[Math.floor(Math.random()*nons.length)], t=gSwap(x.teks,x.kata,non); if(t===x.teks) return null;
  const words=t.split(' '), bi=words.findIndex(w=>w.toLowerCase().replace(new RegExp('[^'+WCH+'-]','g'),'')===non.toLowerCase()); return bi<0?null:{t,words,bi,non}; }
function gVBaku1(G){ const used=new Set(), pk=[]; for(const x of shuffle(G.pool)){ if(pk.length>=4) break; if(used.has(x.p.baku)) continue; if(pk.length&&!gBreak(x)) continue; used.add(x.p.baku); pk.push(x); }
  if(pk.length<4) return null; const br=pk.slice(1).map(gBreak); if(br.some(b=>!b)) return null;
  const m=gMk([{t:pk[0].teks}].concat(br.map((b,j)=>({t:b.t,words:b.words,bi:b.bi,non:b.non,baku:pk[j+1].p.baku}))),0);
  return {id:pairId(pk[0].p),crates:m.opts,ansI:m.ansI,pick:null}; }
function gVBaku2(G){ const pool=shuffle(G.pool.filter(x=>x.p.non.some(n=>!/\s/.test(n)))); if(pool.length<2) return null; const a=pool[0], b=pool.find(x=>x.p.baku!==a.p.baku); if(!b) return null;
  let words=[]; const bad=[], fix=[]; [a,b].forEach(x=>{ const r=Math.random()<.55?gBreak(x):null, w=r?r.words:x.teks.split(' '); if(r){ bad.push(words.length+r.bi); fix.push([r.non,x.p.baku]); } words=words.concat(w); });
  return {id:pairId(a.p),items:words,bad,fix,picks:[],none:false}; }
function gRoundVar(G){ const v=(G.plan||[])[G.k]||0; let c=null;
  if(v){ try{
    if(G.kind==='susun'){ const P=G.paras[G.k]; c=v===2?(gRoundSisip(P)||gRoundUrut(P)):gRoundUrut(P); }
    else if(G.kind==='sumbang') c=gRoundTakPadu(G.paras[G.k],v===2);
    else if(G.kind==='baku') c=(v===1?gVBaku1:gVBaku2)(G);
    else { const F={relasi:[gVRel1,gVRel2],pisah:[gVPisah1,gVPisah2],pangkas:[gVPangkas1,gVPangkas2]}[G.kind]; c=F[v-1](G.pool[G.k]); }
  }catch(e){ console.error(e); c=null; } }
  if(c){ if(!c.v) c.v=v; c.chal=c.v>G.L; return c; }
  return G.kind==='susun'?gRoundSusun(G.paras[G.k]):G.kind==='sumbang'?gRoundSumbang(G.paras[G.k]):G.kind==='baku'?gRoundBaku(G):JSON.parse(JSON.stringify(G.pool[G.k])); }

  if(!WK_BASE){ WK_BASE={}; for(const k in WK_BANK) WK_BASE[k]=JSON.parse(JSON.stringify(WK_BANK[k]())); }
  const p=(S.wk||{})[I.cur];
  for(const k in WK_BANK){ const B=WK_BANK[k](), src=p&&Array.isArray(p.isi[k])&&p.isi[k].length?p.isi[k]:WK_BASE[k]; B.splice(0,B.length,...JSON.parse(JSON.stringify(src))); }
