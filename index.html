<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Latihan Kuantitatif</title>
<meta name="theme-color" content="#dcecff">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tampilan balok (mengikuti gaya Nalar Harian): latar langit, kartu berkancing, tombol berbayang, tab bar balok warna-warni */
:root{
  --red:#ef5f5a;--yellow:#ffd24f;--blue:#4b8ae8;--green:#3fb46e;--orange:#ff9d4d;--sky:#4fc0ec;--pink:#f47eab;--lime:#a2d058;--purple:#8f7ae8;--gray:#d3dcea;
  --ink:#28324d;--line:#5b6d99;--sh:rgba(52,78,150,.22);--plate:#fff;--text:#26304b;--muted:#64708e;--faint:#a3aec6;--edge:#e1e8f4;
  --acc:var(--blue);--acc-s:#e2ecfc;--ok:var(--green);--ok-s:#e2f2e8;--bad:var(--red);--bad-s:#fbe7e6;--base:#eef3fb;--soft:#cdd7ea;--soft2:#dbe3f1;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14.5px/1.5 "Rubik",-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
  background:linear-gradient(180deg,#dcecff 0%,#eaf4ff 45%,#f4f9ff 100%) fixed;padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 112px)}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
#view{max-width:560px;margin:0 auto;padding:0 14px}
h1,h2,.big,.ttl,.klq{font-family:"Lilita One","Rubik",sans-serif;font-weight:400;letter-spacing:.2px}
h1{font-size:25px;line-height:1.15;margin:14px 2px 4px}
h2{font-size:17px;line-height:1.2;margin:22px 2px 14px;display:flex;gap:8px;align-items:center}
h2 .cnt{font-family:"Rubik",sans-serif;font-size:11.5px;font-weight:700;background:var(--yellow);border:2px solid color-mix(in srgb,var(--yellow) 55%,#6b4a00);border-radius:6px;padding:0 7px}
p{margin:0 0 8px}
.lead{color:var(--muted);font-size:13px;margin:0 2px 8px}
.sm{font-size:12.5px;color:var(--muted);display:block}
.grow{flex:1;min-width:0}
.code{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);background:var(--base);border:1.5px solid var(--soft);border-radius:5px;padding:0 5px}

/* latar */
.scene{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.scene .cloud{position:absolute;opacity:.9}
.scene .fbrick{position:absolute;width:38px;opacity:.4;transform:rotate(var(--r));animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:rotate(var(--r)) translateY(-10px)}}
.scene .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:150px}

/* header balok merah */
.appbar{position:relative;display:flex;align-items:center;gap:10px;padding:11px 12px 11px 13px;margin:14px 0 6px;border-radius:14px;background:var(--red);
  border:2px solid color-mix(in srgb,var(--red) 62%,#1f2a4d);box-shadow:0 5px 0 color-mix(in srgb,var(--red) 68%,#1f2a4d)}
.appbar .logo{width:36px;height:36px;flex:none}
.appbar .ttl{font-size:22px;line-height:1;color:#fff;text-shadow:0 2px 0 color-mix(in srgb,var(--red) 65%,#1f2a4d)}
.appbar .sub{display:inline-block;margin-top:5px;font-size:11.5px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.45);border-radius:6px;padding:1px 7px}
.appbar .chip{font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--yellow);color:var(--ink);border:2px solid color-mix(in srgb,var(--yellow) 55%,#6b4a00);white-space:nowrap;box-shadow:none;cursor:default}
.ibtn{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;background:var(--blue);color:#fff;border:2px solid #2b4f99;box-shadow:0 3px 0 #2b4f99;flex:none;text-decoration:none}
.ibtn:active{transform:translateY(3px);box-shadow:none}
.ibtn svg{width:19px;height:19px}
.appbar .st i{background:var(--red);border-color:color-mix(in srgb,var(--red) 62%,#1f2a4d)}

/* maskot */
.hero{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:22px;min-height:150px;margin:-4px 0 8px}
.hero .mw{flex:none;display:block;transform-origin:50% 100%}
.hero .masc{width:160px;height:160px;display:block;animation:hop 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes hop{0%,100%{transform:none}45%{transform:translateY(-6px) rotate(-1.5deg)}55%{transform:translateY(-6px) rotate(1.5deg)}}
.hero .bubble{position:relative;align-self:center;margin-bottom:40px;background:#fff;border:2px solid #b9c9e6;border-radius:13px;padding:8px 11px;font-size:12.5px;font-weight:600;line-height:1.4;box-shadow:0 3px 0 #d3e0f3;max-width:54%}
.hero .bubble::after{content:'';position:absolute;right:-8px;bottom:16px;width:12px;height:12px;background:#fff;border-right:2px solid #b9c9e6;border-bottom:2px solid #b9c9e6;transform:rotate(-45deg);border-radius:0 0 4px 0}
.hero.L{flex-direction:row-reverse}
.hero.L .bubble::after{right:auto;left:-8px;transform:rotate(135deg)}
.hero.R.peek .mw{transform:translateX(38px) rotate(-16deg);margin-left:-30px}
.hero.L.tilt .mw{transform:rotate(9deg) translateY(4px)}
.hero.R.tilt .mw{transform:rotate(-8deg) translateY(4px)}
.hero.flip .mw .masc{transform:scaleX(-1);animation:none}

/* kartu berkancing */
.card{position:relative;background:var(--plate);border:2px solid var(--line);border-radius:12px;box-shadow:0 5px 0 var(--sh);padding:14px 15px;margin:0 0 22px}
.card.list{padding:4px 15px}
.st{position:absolute;top:-11px;left:14px;display:flex;gap:9px;pointer-events:none}
.st.r{left:auto;right:14px}
.st i{display:block;width:20px;height:9px;background:var(--plate);border:2px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0}
.card.note{display:flex;align-items:center;gap:10px;background:#fff6d6;margin-top:16px}
.card.note .st i{background:#fff6d6}
.note2{font-size:12px;color:var(--muted);margin:-12px 4px 6px}

.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:2px dashed var(--edge)}
.card.list>.row:first-of-type{border-top:0}
.row b{font-size:14.5px;font-weight:600;display:block}
.row.done b{color:var(--muted)}
.num{flex:none;width:36px;height:30px;border-radius:6px;display:grid;place-items:center;color:#fff;font-family:"Lilita One","Rubik",sans-serif;font-size:16px;
  --c:var(--blue);background:var(--c);border:2px solid color-mix(in srgb,var(--c) 62%,#1f2a4d);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 70%,#1f2a4d)}
.card.list>.row:nth-of-type(1) .num{--c:var(--yellow);color:var(--ink)}
.card.list>.row:nth-of-type(2) .num{--c:var(--red)}
.card.list>.row:nth-of-type(3) .num{--c:var(--blue)}
.card.list>.row.done .num{--c:var(--green);color:#fff;opacity:.8}
.stephd .num{--c:var(--yellow);color:var(--ink);width:30px;height:26px;font-size:14px}
.rev summary .num{width:28px;height:24px;font-size:13px}

.bar{display:block;height:12px;border-radius:6px;background:var(--plate);border:2px solid var(--line);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--yellow);transition:width .4s}
.bar.ok i{background:var(--green)}.bar.bad i{background:var(--red)}

/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:9px;font:600 14px "Rubik",sans-serif;color:var(--text);cursor:pointer;text-decoration:none;flex:none;
  background:var(--plate);border:2px solid var(--line);box-shadow:0 3px 0 var(--sh);transition:transform .05s,box-shadow .05s;-webkit-tap-highlight-color:transparent}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--sh)}
.btn.pri{background:var(--yellow);color:#2f333d;font-family:"Lilita One","Rubik",sans-serif;font-weight:400;font-size:15.5px;letter-spacing:.3px;
  border-color:color-mix(in srgb,var(--yellow) 55%,#6b4a00);box-shadow:0 3px 0 color-mix(in srgb,var(--yellow) 60%,#7a5200)}
.btn.danger{color:var(--red)}
.btn.ico{padding:0 11px;color:var(--muted)}
.btn.block{display:flex;width:100%;margin-top:12px}
.btn.grow{flex:1}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0 0}
.btns.foot{margin:16px 0 0}

/* label */
.bd{display:inline-flex;align-items:center;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;white-space:nowrap;flex:none;color:#fff;--c:var(--gray);background:var(--c);border:2px solid color-mix(in srgb,var(--c) 60%,#1f2a4d)}
.bd-mint{--c:var(--green)}.bd-blue{--c:var(--blue)}.bd-coral{--c:var(--red)}
.bd-lama{--c:var(--gray);color:var(--ink)}.bd-geser{--c:var(--yellow);color:var(--ink)}.bd-baru,.bd-varian{--c:var(--purple)}
.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:8px 0}
.chips b{font-family:"Lilita One","Rubik",sans-serif;font-weight:400;font-size:16px;margin-right:8px}
.chip{font:600 12.5px "Rubik",sans-serif;padding:5px 10px;border-radius:7px;border:2px solid var(--line);background:var(--plate);box-shadow:0 2px 0 var(--sh);cursor:pointer;color:var(--text)}
.chip.on{background:var(--blue);color:#fff;border-color:color-mix(in srgb,var(--blue) 60%,#1f2a4d)}
details summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--blue);padding:4px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
.resep{margin:8px 0 0;padding-left:22px;font-size:12.5px}
.resep li{margin-bottom:6px}.resep span:last-child{color:var(--muted)}

.seg{display:flex;gap:7px;margin:4px 0 22px;flex-wrap:wrap}
.seg button{flex:1;font:600 12.5px "Rubik",sans-serif;padding:7px 4px;border-radius:8px;border:2px solid var(--line);background:var(--plate);box-shadow:0 2px 0 var(--sh);color:var(--text);cursor:pointer}
.seg button.on{background:var(--blue);color:#fff;border-color:color-mix(in srgb,var(--blue) 60%,#1f2a4d)}
.stephd{display:flex;gap:9px;align-items:center;margin-bottom:8px}
.stephd b{font-family:"Lilita One","Rubik",sans-serif;font-weight:400;font-size:16px}
.ta{width:100%;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);background:var(--base);border:2px solid var(--line);border-radius:9px;padding:9px 10px;resize:vertical;outline:none}
.ta:focus,.isi input:focus{box-shadow:0 0 0 3px var(--yellow)}
.msg{border-radius:10px;padding:9px 11px;margin-top:10px;font-size:13px;border:1.5px dashed}
.msg ul{margin:4px 0;padding-left:18px}
.msg.bad{background:var(--bad-s);color:#a3302c;border-color:var(--red)}.msg.ok{background:var(--ok-s);color:#1f7a47;border-color:var(--green)}
.snip{font-size:13.5px;margin:8px 0 0}
.srow{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:2px dashed var(--edge)}
.card>.srow:first-of-type{border-top:0}
.srow .lb{font-size:13.5px;font-weight:600}
.sv{text-align:right;flex:none;min-width:86px}.sv b{font-family:"Lilita One","Rubik",sans-serif;font-weight:400;font-size:17px}

/* sesi soal */
.top{display:flex;align-items:center;gap:10px;min-height:38px;margin-top:10px}
.top.run{position:sticky;top:6px;z-index:5;background:var(--plate);border:2px solid var(--line);border-radius:12px;box-shadow:0 4px 0 var(--sh);padding:6px 10px;margin:12px 0 10px}
.hub{color:var(--blue);text-decoration:none;font-size:13px;font-weight:700;background:none;border:0;padding:6px 0;font-family:inherit;cursor:pointer}
.ttl{font-size:16px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--ink);background:var(--yellow);border:2px solid color-mix(in srgb,var(--yellow) 55%,#6b4a00);border-radius:7px;padding:2px 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cd.late{color:#fff;background:var(--red);border-color:color-mix(in srgb,var(--red) 60%,#1f2a4d)}
.dots{display:flex;gap:5px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.dots button{flex:none;width:30px;height:28px;border-radius:6px;border:2px solid var(--line);background:var(--plate);font:700 11.5px "Rubik",sans-serif;color:var(--muted);cursor:pointer;box-shadow:0 2px 0 var(--sh)}
.dots .ans{background:var(--acc-s);color:var(--blue)}
.dots .ok{background:var(--green);color:#fff;border-color:color-mix(in srgb,var(--green) 60%,#1f2a4d)}
.dots .no{background:var(--red);color:#fff;border-color:color-mix(in srgb,var(--red) 60%,#1f2a4d)}
.dots .cur{background:var(--yellow);color:var(--ink);border-color:color-mix(in srgb,var(--yellow) 55%,#6b4a00);transform:translateY(-2px)}
.qhd{display:flex;gap:8px;align-items:center;margin:2px 2px 12px}
.stim{background:#f3f6fc;border:1.5px dashed #b9c6de;box-shadow:none;font-size:15px}
.stim .st{display:none}
.stim>b{font-family:"Lilita One","Rubik",sans-serif;font-weight:400;font-size:16px;display:block;margin-bottom:4px}
.q{font-size:15px}
.q p,.stim p{margin-bottom:8px}
.ask{font-weight:600}
.tw{overflow-x:auto;margin:6px 0 10px}
table{border-collapse:collapse;font-size:13px;min-width:60%}
th,td{padding:5px 8px;text-align:left;border-bottom:2px dashed var(--edge)}
th{font-weight:700}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:14.5px/1.4 "Rubik",sans-serif;color:var(--text);background:var(--plate);border:1.5px solid var(--soft);box-shadow:0 2px 0 var(--soft2);border-radius:10px;padding:10px 12px;margin-top:9px;cursor:pointer;transition:transform .05s,box-shadow .05s}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.opt .lt{flex:none;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-family:"Lilita One","Rubik",sans-serif;font-size:13px;background:#eef2f9;color:var(--muted);border:1.5px solid var(--soft);margin-top:-1px}
.opt.sel{border-color:var(--blue);background:var(--acc-s)}.opt.sel .lt{background:var(--blue);color:#fff;border-color:var(--blue)}
.opt.good{background:var(--ok-s);border-color:var(--green);animation:snap .3s cubic-bezier(.3,1.7,.5,1)}.opt.good .lt{background:var(--green);color:#fff;border-color:var(--green)}
.opt.wrong{background:var(--bad-s);border-color:var(--red);animation:shake .3s}.opt.wrong .lt{background:var(--red);color:#fff;border-color:var(--red)}
.opt:disabled{cursor:default;color:var(--text);opacity:1}
@keyframes snap{0%{transform:translateY(-4px)}60%{transform:translateY(2px)}100%{transform:none}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.why{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.pq{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:6px 0 4px}
.pq div{background:var(--base);border:2px solid var(--line);border-radius:9px;padding:8px 11px;font-weight:600}
.pq .sm{font-family:"Lilita One","Rubik",sans-serif;font-size:13px;color:var(--blue)}
.pern{margin:6px 0 4px}
.pern p{margin:0 0 6px;padding:7px 10px;border-radius:9px;background:var(--base);border:1.5px solid var(--soft)}
.bs{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bsr{display:flex;gap:6px;align-items:center;padding:9px 10px;border-radius:10px;background:var(--plate);border:1.5px solid var(--soft);box-shadow:0 2px 0 var(--soft2);font-size:14px}
.bsr.good{background:var(--ok-s);border-color:var(--green)}.bsr.wrong{background:var(--bad-s);border-color:var(--red)}
.bsr button{font:700 11.5px "Rubik",sans-serif;border:1.5px solid var(--soft);background:#f6f8fc;color:var(--muted);border-radius:8px;padding:6px 9px;cursor:pointer;flex:none}
.bsr button.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.bsr button.key{box-shadow:0 0 0 2px var(--green)}
.bsr.wrong button.sel{background:var(--red);border-color:var(--red)}
.isi{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:8px}
.isi input{font:700 18px "Rubik",sans-serif;color:var(--text);background:var(--plate);border:2px solid var(--line);border-radius:9px;padding:8px 12px;width:180px;max-width:100%;outline:none}
.pb{font-size:14px}
.pb.good{border-color:var(--green);background:#f5fbf7}.pb.wrong{border-color:var(--red);background:#fef7f6}
.pb.good .st i{border-color:var(--green);background:#f5fbf7}.pb.wrong .st i{border-color:var(--red);background:#fef7f6}
.pb>b{font-family:"Lilita One","Rubik",sans-serif;font-weight:400;font-size:17px}.pb.good>b{color:var(--green)}.pb.wrong>b{color:var(--red)}
.kunci{font-weight:700;margin:6px 0}
.steps{margin:4px 0 8px;padding-left:20px}
.steps li{margin-bottom:2px}
.lbl{font-size:12px;color:var(--muted);margin:10px 0 0;padding-top:9px;border-top:2px dashed var(--edge)}
.score{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.big{font-size:38px;display:block;line-height:1.05}
.rev summary{display:flex;gap:8px;align-items:center;color:var(--text)}
.rev .pb{border:0;padding:8px 0 0;margin:0;background:none;box-shadow:none}
.rev.good{border-left:6px solid var(--green)}.rev.wrong{border-left:6px solid var(--red)}
.snip1{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ol{list-style:none;padding:0;margin:6px 0;font-size:14px}
.ol li{padding:5px 8px;border-radius:7px}.ol .k{background:var(--ok-s)}.ol .x{background:var(--bad-s)}

/* hitung cepat & game */
.kl{text-align:center;margin-top:14px}
.kl.good{border-color:var(--green)}.kl.wrong{border-color:var(--red)}
.kl.good .st i{border-color:var(--green)}.kl.wrong .st i{border-color:var(--red)}
.klq{font-size:30px;line-height:1.2;margin:12px 0}
.klq.sm2{font-size:21px}
.kl .isi{justify-content:center}.kl .steps{text-align:left}
.kl.wide{text-align:left}.kl.wide .klh{margin-top:6px}
.klo{text-align:left;margin-top:8px}
table.kisi{min-width:0;margin:6px auto;border-collapse:separate;border-spacing:0}
table.kisi td{border:0;padding:3px 6px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
table.kisi td.n{background:var(--yellow);border:2px solid color-mix(in srgb,var(--yellow) 55%,#6b4a00);border-radius:6px;min-width:32px;box-shadow:0 2px 0 color-mix(in srgb,var(--yellow) 60%,#7a5200)}
table.kisi td.o{color:var(--muted);font-size:13px}
table.kisi td.r{color:var(--blue);font-family:"Lilita One","Rubik",sans-serif;font-weight:400;font-size:16px}

/* tab bar balok */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:6px;padding:14px 8px 8px;border-radius:14px;z-index:20;width:min(440px,calc(100% - 20px));
  background:#3a4f86;border:2px solid #2e3f6e;box-shadow:0 5px 0 var(--sh)}
#nav a{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border-radius:7px;font-family:"Lilita One","Rubik",sans-serif;font-size:11.5px;letter-spacing:.3px;text-decoration:none;
  color:#fff;background:var(--c);border:2px solid color-mix(in srgb,var(--c) 62%,#1f2a4d);box-shadow:0 2px 0 var(--sh);transform:translateY(3px);transition:transform .15s,box-shadow .15s;opacity:.9}
#nav a.yk{color:var(--ink)}
#nav a svg{width:19px;height:19px}
#nav a::before,#nav a::after{content:'';position:absolute;top:-8px;width:14px;height:6px;background:var(--c);border:2px solid color-mix(in srgb,var(--c) 62%,#1f2a4d);border-bottom:0;border-radius:4px 4px 0 0;opacity:0;transition:opacity .15s}
#nav a::before{left:18%}#nav a::after{right:18%}
#nav a.on{transform:translateY(-3px);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 60%,#141c36);opacity:1}
#nav a.on::before,#nav a.on::after{opacity:1}
#nav i{position:absolute;top:-7px;right:-4px;font-style:normal;font-family:"Rubik",sans-serif;font-weight:700;font-size:10.5px;background:#fff;color:var(--red);border:2px solid var(--red);border-radius:8px;padding:0 4px;line-height:14px;z-index:2}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);z-index:50;padding:8px 14px;font-family:"Lilita One","Rubik",sans-serif;font-size:15px;border-radius:9px;
  background:var(--yellow);color:#2f333d;border:2px solid color-mix(in srgb,var(--yellow) 55%,#6b4a00);box-shadow:0 4px 0 color-mix(in srgb,var(--yellow) 60%,#7a5200);max-width:90vw;text-align:center}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.appbar .ttl{white-space:normal;text-align:left;font-size:21px;overflow:visible}

/* ===== revisi: pola referensi ===== */
.gap{height:18px}
.intro{background:rgba(255,255,255,.88);border:2px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--muted);margin:16px 0 26px;line-height:1.5}
.intro b{color:var(--text)}
.lbl{display:inline-block;font-family:"Lilita One","Rubik",sans-serif;font-weight:400;font-size:13.5px;line-height:1.2;color:var(--ink);background:var(--lc,var(--yellow));
  border:2px solid color-mix(in srgb,var(--lc,var(--yellow)) 55%,#1f2a4d);border-radius:6px;padding:2px 8px 3px;box-shadow:0 2px 0 color-mix(in srgb,var(--lc,var(--yellow)) 55%,#1f2a4d);margin:2px 0 10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding-top:2px}
.lbl.w,.lbl.g,.lbl.b,.lbl.o{color:#fff}
.lbl.g{--lc:var(--green)}.lbl.b{--lc:var(--blue)}.lbl.o{--lc:var(--orange)}
.lbl .cnt{font-family:"Rubik",sans-serif;font-size:11px;font-weight:700;background:rgba(255,255,255,.55);color:var(--ink);border-radius:4px;padding:0 5px;margin-left:4px}
.card.list.has-lbl{padding-top:12px}
.card.list.has-lbl>.lbl{margin-bottom:4px}
.meta{font-size:12px;color:var(--muted);margin:10px 0 0;padding-top:9px;border-top:2px dashed var(--edge)}
/* teks dan tombol lebih ringkas */
.row{padding:10px 0}
.row b{font-size:14px}
.sm{font-size:12px}
.row .btn,.btn.sm{min-height:32px;padding:0 11px;font-size:12.5px;border-radius:7px;box-shadow:0 2px 0 var(--sh)}
.row .btn.pri{font-size:14px;box-shadow:0 2px 0 color-mix(in srgb,var(--yellow) 60%,#7a5200)}
.btn.sm{text-decoration:none}
.bar{height:10px;margin-top:6px}
.card{padding:13px 14px}
.num{width:32px;height:28px;font-size:15px}
.skb{flex:none;width:38px;height:32px;border-radius:6px;background:var(--c);display:grid;place-items:center;color:#fff;font-family:"Lilita One","Rubik",sans-serif;font-size:14px;
  border:2px solid color-mix(in srgb,var(--c) 62%,#1f2a4d);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 70%,#1f2a4d)}
.tahap{display:flex;flex-direction:column-reverse;gap:2px;flex:none}
.tahap i{width:26px;height:8px;border-radius:2px;border:2px solid var(--line);background:var(--plate)}
.tahap i.on{background:var(--c);border-color:color-mix(in srgb,var(--c) 62%,#1f2a4d)}
.chips b{font-size:15px}
/* kepala sesi */
.top.run{position:sticky;top:0;background:linear-gradient(180deg,#e4f0ff 70%,rgba(228,240,255,0));border:0;box-shadow:none;border-radius:0;padding:10px 2px 12px;margin:0 -2px 4px}
.top.run .mid{display:flex;justify-content:center;min-width:0}
.top.run .lbl{margin:0}
/* ubin mini game */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px 12px;margin-top:14px}
.tile{position:relative;text-align:left;padding:13px;display:flex;flex-direction:column;gap:6px;min-height:150px;background:var(--c);color:#fff;border:2px solid color-mix(in srgb,var(--c) 62%,#1f2a4d);border-radius:12px;
  box-shadow:0 5px 0 color-mix(in srgb,var(--c) 70%,#1f2a4d);font:inherit;cursor:pointer;transition:transform .06s,box-shadow .06s}
.tile:active:not(:disabled){transform:translateY(5px);box-shadow:0 0 0 transparent}
.tile.yk{color:var(--ink)}
.tile .st i{background:var(--c);border-color:color-mix(in srgb,var(--c) 62%,#1f2a4d)}
.tile .ic{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;background:var(--plate);color:var(--text);border:2px solid var(--line)}
.tile .ic svg{width:18px;height:18px}
.tile b{font-family:"Lilita One","Rubik",sans-serif;font-weight:400;font-size:17px;line-height:1.1}
.tile .tiny{font-size:11.5px;line-height:1.4;opacity:.95}
.tile .best{margin-top:auto;font-size:11px;font-weight:700;background:rgba(0,0,0,.12);padding:2px 7px;border-radius:5px;align-self:flex-start}
.tile.off{filter:grayscale(.85);opacity:.6;cursor:default}
.grid2 .tile:last-child:nth-child(odd){grid-column:span 2;min-height:110px}
.kl.gm{text-align:left}
.kl.gm .klq{text-align:center}

/* ===== papan mini game ===== */
.kl.gm{text-align:left}
.kl.gm>.sm{margin-bottom:4px}
.gq{font-size:13.5px;line-height:1.45;margin:4px 0 12px;color:var(--text)}
.gq b{font-family:"Lilita One","Rubik",sans-serif;font-weight:400;font-size:15px;color:var(--blue)}
.cap{display:block;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}

/* keypad telepon */
.kp-scr{margin:14px auto 10px;max-width:260px;text-align:center;font:700 26px "Rubik",sans-serif;letter-spacing:1px;padding:8px 10px;border-radius:10px;background:#26304b;color:#ffe48a;border:2px solid #1f2a4d;box-shadow:inset 0 3px 0 rgba(0,0,0,.25);min-height:52px;font-variant-numeric:tabular-nums}
.kp-scr.empty{font-size:13px;font-weight:600;color:#8f9bb8;letter-spacing:0;line-height:34px}
.kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:0 auto}
.kpad button{height:46px;border-radius:10px;font:400 22px "Lilita One","Rubik",sans-serif;color:var(--text);background:var(--plate);border:2px solid var(--line);box-shadow:0 3px 0 var(--sh);cursor:pointer;-webkit-tap-highlight-color:transparent}
.kpad button:active{transform:translateY(3px);box-shadow:none}
.kpad button.fn{background:var(--base);font-size:19px;color:var(--muted)}
.kl.gm .btn.block{max-width:260px;margin-left:auto;margin-right:auto}
.kl.gm .kunci,.kl.gm .steps{text-align:left}

/* mesin */
.mlog{background:var(--base);border:1.5px dashed #b9c6de;border-radius:10px;padding:8px 10px;margin-bottom:12px}
.mrow{display:flex;align-items:center;gap:8px;padding:3px 0}
.tok{min-width:42px;text-align:center;padding:3px 8px;border-radius:7px;font:400 16px "Lilita One","Rubik",sans-serif;background:var(--yellow);border:2px solid color-mix(in srgb,var(--yellow) 55%,#6b4a00);color:var(--ink)}
.tok.o{background:var(--green);color:#fff;border-color:color-mix(in srgb,var(--green) 60%,#1f2a4d)}
.belt{flex:1;height:10px;border-radius:5px;background:repeating-linear-gradient(90deg,#c3cfe6 0 8px,#dbe3f1 8px 16px);position:relative;animation:belt 1s linear infinite;background-size:16px 10px}
.belt i{display:none}
@keyframes belt{to{background-position:16px 0}}
.mach{display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:end;gap:6px;margin:6px 0 2px}
.slot{text-align:center}
.slot b{display:block;margin:0 auto;min-width:58px;padding:8px 6px;border-radius:9px;font:400 22px "Lilita One","Rubik",sans-serif;background:var(--plate);border:2px solid var(--line);box-shadow:0 3px 0 var(--sh);color:var(--ink)}
.slot b.typed{background:#26304b;color:#ffe48a;border-color:#1f2a4d}
.chute,.tray{display:block;height:10px;margin:6px 8px 0;border-radius:0 0 8px 8px;background:#9fb0d2}
.mbox{position:relative;height:120px;border-radius:14px;background:var(--purple);border:2px solid color-mix(in srgb,var(--purple) 60%,#1f2a4d);box-shadow:0 5px 0 color-mix(in srgb,var(--purple) 65%,#1f2a4d);overflow:hidden}
.mbox .screen{position:absolute;left:10px;right:10px;top:10px;padding:6px 4px;border-radius:7px;background:#26304b;color:#9ff0c2;font:600 13px ui-monospace,Menlo,monospace;text-align:center;border:2px solid #1f2a4d}
.gear{position:absolute;color:#ffd24f;display:block}
.gear svg{width:100%;height:100%;display:block}
.gear.g1{width:46px;height:46px;left:14px;bottom:8px}
.gear.g2{width:32px;height:32px;left:54px;bottom:30px;color:#ffe9a3}
.mbox .lamp{position:absolute;right:12px;bottom:14px;width:16px;height:16px;border-radius:50%;background:#7c87a6;border:2px solid #1f2a4d}
.mach.run .gear.g1{animation:spin 1.2s linear 2}
.mach.run .gear.g2{animation:spin 1.2s linear reverse 2}
.mach.run .lamp{background:var(--green);box-shadow:0 0 10px var(--green)}
.mach.run.bad .lamp{background:var(--red);box-shadow:0 0 10px var(--red)}
@keyframes spin{to{transform:rotate(360deg)}}

/* kisi */
table.kisi2{min-width:0;margin:4px auto 8px;border-collapse:separate;border-spacing:0}
table.kisi2 td{border:0;padding:3px 3px;text-align:center;font-variant-numeric:tabular-nums}
table.kisi2 td.n{width:42px;height:42px;font:400 20px "Lilita One","Rubik",sans-serif;background:var(--plate);border:2px solid var(--line);border-radius:8px;box-shadow:0 3px 0 var(--sh)}
table.kisi2 td.eq{color:var(--muted);font-weight:700}
table.kisi2 td.r{min-width:42px;font:400 18px "Lilita One","Rubik",sans-serif;color:var(--ink);border-radius:8px;transition:background .2s}
table.kisi2 td.r.ok{background:var(--ok-s);color:var(--green)}
table.kisi2 td.r.no{background:var(--bad-s);color:var(--red)}
table.kisi2 td.r.q{background:var(--yellow);border:2px solid color-mix(in srgb,var(--yellow) 55%,#6b4a00);box-shadow:0 3px 0 color-mix(in srgb,var(--yellow) 60%,#7a5200)}
table.kisi2 td.r.q.typed{background:#26304b;color:#ffe48a;border-color:#1f2a4d}
.otok{width:30px;height:30px;border-radius:50%;font:400 16px "Lilita One","Rubik",sans-serif;color:var(--muted);background:var(--base);border:2px dashed #9fb0d2;cursor:pointer;padding:0}
.otok.set{background:var(--blue);color:#fff;border:2px solid color-mix(in srgb,var(--blue) 60%,#1f2a4d);box-shadow:0 2px 0 color-mix(in srgb,var(--blue) 65%,#1f2a4d)}
.olegend{display:flex;justify-content:center;gap:10px;font:400 15px "Lilita One","Rubik",sans-serif;color:var(--muted)}
.olegend span{background:var(--base);border-radius:7px;padding:2px 10px}

/* barisan */
.train{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 4px;margin:14px 0 8px}
.brk{position:relative;min-width:50px;height:46px;padding:0 8px;display:inline-grid;place-items:center;border-radius:7px;font:400 19px "Lilita One","Rubik",sans-serif;color:#fff;
  --c:var(--blue);background:var(--c);border:2px solid color-mix(in srgb,var(--c) 62%,#1f2a4d);box-shadow:0 3px 0 color-mix(in srgb,var(--c) 70%,#1f2a4d);cursor:default}
.brk:nth-of-type(3n+2){--c:var(--green)}.brk:nth-of-type(3n){--c:var(--orange)}
.brk::before,.brk::after{content:'';position:absolute;top:-7px;width:10px;height:5px;background:var(--c);border:2px solid color-mix(in srgb,var(--c) 62%,#1f2a4d);border-bottom:0;border-radius:3px 3px 0 0}
.brk::before{left:7px}.brk::after{right:7px}
.brk small{position:absolute;bottom:-17px;left:0;right:0;font:700 9.5px "Rubik",sans-serif;color:var(--muted)}
.brk.q{--c:var(--yellow);color:var(--ink);animation:bob 1.4s ease-in-out infinite}
.brk.blank{--c:var(--gray);color:var(--muted);opacity:.7}
.brk.pk{cursor:pointer}
.brk.sel{--c:var(--red);transform:translateY(-4px)}
.brk.sel em{position:absolute;top:-24px;font:600 10px "Rubik",sans-serif;color:var(--red);text-decoration:line-through;font-style:normal}
.brk.was{outline:3px solid var(--green);outline-offset:2px}
@keyframes bob{50%{transform:translateY(-3px)}}
.gap{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;background:var(--plate);border:2px dashed #9fb0d2;color:var(--muted);cursor:pointer;padding:0}
.gap svg{width:14px;height:14px}
.gap.on{width:auto;height:auto;border-radius:6px;border:2px solid var(--line);padding:1px 5px;font:700 10.5px "Rubik",sans-serif;color:var(--ink);background:#fff6d6;cursor:default}
.gap.x{width:10px;border:0;background:none}
.skipb{display:block;margin:14px auto 0}
.skips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.skips span{font-size:11.5px;background:var(--base);border:1.5px solid var(--soft);border-radius:6px;padding:2px 7px}
.lupc{text-align:center;margin-top:6px}

/* timbangan */
.scale{position:relative;height:178px;margin:6px 0 4px}
.scale .post{position:absolute;left:50%;top:26px;width:10px;height:120px;margin-left:-5px;background:#5b6d99;border-radius:5px}
.scale .foot{position:absolute;left:50%;bottom:10px;width:120px;height:14px;margin-left:-60px;background:#5b6d99;border-radius:8px 8px 4px 4px}
.beam{position:absolute;left:8%;right:8%;top:22px;height:10px;background:var(--orange);border:2px solid color-mix(in srgb,var(--orange) 60%,#1f2a4d);border-radius:6px;transform:rotate(var(--a));transition:transform .6s cubic-bezier(.3,1.5,.5,1);z-index:2}
.pan{position:absolute;top:2px;width:0;transform:rotate(calc(var(--a) * -1));transform-origin:0 0;transition:transform .6s cubic-bezier(.3,1.5,.5,1)}
.pan.l{left:14px}.pan.r{right:14px}
.pan::before{content:'';position:absolute;left:-1px;top:0;width:2px;height:26px;background:#5b6d99}
.cup{position:absolute;top:26px;left:-62px;width:124px;min-height:72px;padding:6px 6px 8px;border-radius:6px 6px 40px 40px;background:var(--plate);border:2px solid var(--line);box-shadow:0 3px 0 var(--sh);text-align:center;display:flex;flex-direction:column;justify-content:center;gap:1px}
.cup small{font:400 13px "Lilita One","Rubik",sans-serif;color:var(--blue)}
.cup b{font-size:13.5px;line-height:1.25;font-weight:700}
.cup em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--green)}
.scale.wob .beam{animation:wob 1.2s ease-in-out 2}
@keyframes wob{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.tests{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 6px}
.tests .cap{margin:0 4px 0 0}
.tests .chip{padding:4px 8px;font-size:11.5px}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.zone{height:42px;border-radius:9px;font:400 16px "Lilita One","Rubik",sans-serif;background:var(--plate);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--sh);cursor:pointer}
.zone.wide{grid-column:span 2;font-size:14px}
.zone:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.zone.good{background:var(--green);color:#fff;border-color:color-mix(in srgb,var(--green) 60%,#1f2a4d)}
.zone.wrong{background:var(--red);color:#fff;border-color:color-mix(in srgb,var(--red) 60%,#1f2a4d)}
.zone:disabled{cursor:default}

/* cukup nggak */
.ckhead{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin:2px 0 10px}
.ckhead .ask{font-size:15px;margin:0}
.ckst{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ckc{position:relative;padding:9px 10px 10px;border-radius:10px;background:var(--plate);border:2px solid var(--soft);font-size:13px;line-height:1.4;transition:transform .2s,border-color .2s}
.ckc b{display:block;font:400 15px "Lilita One","Rubik",sans-serif;color:var(--blue)}
.ckc.lit{border-color:var(--yellow);box-shadow:0 0 0 3px #fff2c2;transform:translateY(-2px)}
.ckc.yes{border-color:var(--green);background:var(--ok-s)}.ckc.no{border-color:var(--red);background:var(--bad-s)}
.ckc i{position:absolute;top:8px;right:8px;font-style:normal;font-size:10px;font-weight:700;color:var(--muted)}
.flow{margin-top:14px;text-align:center}
.flow p{margin:8px 0 10px;font-size:14px}
.fsteps{display:flex;align-items:center;justify-content:center;gap:4px}
.fsteps span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:400 13px "Lilita One","Rubik",sans-serif;background:var(--base);color:var(--muted);border:2px solid var(--soft)}
.fsteps span.cur{background:var(--yellow);color:var(--ink);border-color:color-mix(in srgb,var(--yellow) 55%,#6b4a00)}
.fsteps span.done{background:var(--blue);color:#fff;border-color:color-mix(in srgb,var(--blue) 60%,#1f2a4d)}
.fsteps i{width:22px;height:2px;background:var(--soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.row2 .btn{min-height:42px}

/* paling mendekati */
.expr{text-align:center;font:400 28px "Lilita One","Rubik",sans-serif;color:var(--ink);margin:4px 0 6px}
.nline{position:relative;height:96px;margin:6px 4px 0}
.nline .track{position:absolute;left:0;right:0;top:62px;height:8px;border-radius:4px;background:repeating-linear-gradient(90deg,#5b6d99 0 2px,transparent 2px 10%),#dbe3f1;border:2px solid var(--line)}
.flag{position:absolute;top:8px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;background:none;border:0;cursor:pointer;padding:0}
.flag b{font:400 14px "Lilita One","Rubik",sans-serif;padding:4px 7px;border-radius:7px;background:var(--plate);border:2px solid var(--line);box-shadow:0 3px 0 var(--sh);color:var(--ink);white-space:nowrap}
.flag i{width:2px;height:24px;background:var(--line);margin-top:2px}
.flag.good b{background:var(--green);color:#fff;border-color:color-mix(in srgb,var(--green) 60%,#1f2a4d)}
.flag.wrong b{background:var(--red);color:#fff;border-color:color-mix(in srgb,var(--red) 60%,#1f2a4d)}
.flag:active:not(:disabled) b{transform:translateY(3px);box-shadow:none}
.truev{position:absolute;top:58px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.truev::before{content:'';width:14px;height:14px;border-radius:50%;background:var(--yellow);border:2px solid #6b4a00}
.truev b{margin-top:3px;font-size:11px;font-weight:700;color:var(--ink);background:#fff6d6;border-radius:5px;padding:0 5px;white-space:nowrap}

.olegend .good{background:var(--ok-s);color:var(--green)}.olegend .bad{background:var(--bad-s);color:var(--red)}
.beam{left:17%;right:17%}
.cup{left:-54px;width:108px}

/* ===== revisi 2: jarak, papan di tengah, mesin sederhana ===== */
.gstage{min-height:calc(100vh - 150px);display:flex;flex-direction:column;justify-content:center;padding:18px 0 24px}
.gstage .card{margin:0}
.kl.gm{padding:18px 16px 18px}
.gq{margin:6px 0 16px}
.gq.c{text-align:center}
.kpwrap{margin-top:22px;padding-top:18px;border-top:2px dashed var(--edge)}
.kphint{text-align:center;margin:-4px 0 10px}
.kpad{max-width:244px;gap:9px}
.kpad button{height:44px;font-size:20px}
.kl.gm .btn.block{max-width:244px;margin-top:14px}
.kl.gm .kunci{margin-top:18px;padding-top:14px;border-top:2px dashed var(--edge)}
.kl.gm .steps{margin-bottom:6px}
/* mesin */
.mhist{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.mhist span{font:400 15px "Lilita One","Rubik",sans-serif;padding:4px 10px;border-radius:8px;background:var(--base);border:2px solid var(--soft);color:var(--ink)}
.mhist i{font-style:normal;color:var(--purple);margin:0 6px}
.mach{display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 0 0}
.mach .slot{min-width:56px;padding:9px 8px;text-align:center;border-radius:10px;font:400 22px "Lilita One","Rubik",sans-serif;background:var(--plate);border:2px solid var(--line);box-shadow:0 3px 0 var(--sh);color:var(--ink)}
.mach .slot.typed{background:#fff6d6;border-color:color-mix(in srgb,var(--yellow) 55%,#6b4a00);box-shadow:0 3px 0 color-mix(in srgb,var(--yellow) 60%,#7a5200)}
.mach .arw{font-style:normal;font-weight:700;color:var(--faint);font-size:18px}
.mbox{position:relative;width:96px;height:84px;border-radius:14px;background:var(--purple);border:2px solid color-mix(in srgb,var(--purple) 60%,#1f2a4d);box-shadow:0 4px 0 color-mix(in srgb,var(--purple) 65%,#1f2a4d);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:visible}
.mbox .gear{position:static;width:34px;height:34px;color:#ffd24f}
.mbox .screen{position:static;padding:1px 6px;border-radius:5px;background:#26304b;color:#9ff0c2;font:600 11px ui-monospace,Menlo,monospace;border:0;max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mach.run .gear{animation:spin 1s linear 2}
.mach.run .mbox{box-shadow:0 4px 0 color-mix(in srgb,var(--purple) 65%,#1f2a4d),0 0 0 4px var(--ok-s)}
.mach.run.bad .mbox{box-shadow:0 4px 0 color-mix(in srgb,var(--purple) 65%,#1f2a4d),0 0 0 4px var(--bad-s)}
/* kisi */
table.kisi2{border-spacing:2px 4px;margin:0 auto 14px}
table.kisi2 td.n{width:40px;height:40px}
table.kisi2 td.o{padding:0 4px}
.otok{width:28px;height:28px;font-size:15px}
.olegend{margin:6px 0 0}
table.kisi2 td.r.q.typed{background:#fff6d6;color:var(--ink);border-color:color-mix(in srgb,var(--yellow) 55%,#6b4a00)}
/* barisan */
.train{margin:10px 0 18px;gap:16px 5px}
.brk.q,.brk.sel{font-size:19px}
/* timbangan */
.scale{margin:10px 0 8px}
.zones{margin-top:16px}
/* cukup */
.ckst{gap:10px;margin-bottom:4px}
.flow{margin-top:20px}
.ckres{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--base);border:1.5px dashed #b9c6de;font-size:13px;line-height:1.45}
.ckres .cap{margin-bottom:3px}
/* paling mendekati */
.expr{margin:6px 0 18px}
.nline{margin:4px 4px 6px}
</style>

<script>
/* ---- util hitung + hitung cepat (dari versi lama) ---- */
const RN={
  int:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  chance:p=>Math.random()<p,
  shuf:a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
};
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a; }
function lcm(a,b){ return a/gcd(a,b)*b; }
function isPrime(n){ if(n<2) return false; for(let i=2;i*i<=n;i++) if(n%i===0) return false; return true; }
function factorize(n){ const f={}; for(let p=2;p*p<=n;p++) while(n%p===0){ f[p]=(f[p]||0)+1; n/=p; } if(n>1) f[n]=(f[n]||0)+1; return f; }
function nDiv(n){ return Object.values(factorize(n)).reduce((a,e)=>a*(e+1),1); }
function comb(n,k){ let r=1; for(let i=1;i<=k;i++) r=r*(n-k+i)/i; return Math.round(r); }
const MIN='−';
function fmt(x){
  if(typeof x!=='number') return String(x);
  const neg=x<0, r=Math.round(Math.abs(x)*100)/100;
  let [i,d]=r.toFixed(2).split('.');
  i=i.replace(/\B(?=(\d{3})+(?!\d))/g,'.'); d=d.replace(/0+$/,'');
  return (neg&&r!==0?MIN:'')+i+(d?','+d:'');
}
function rp(x){ return 'Rp'+fmt(x)+',00'; }
function sg(x){ return x<0?MIN+fmt(-x):fmt(x); }               // angka bertanda untuk ekspresi
function par(x){ return x<0?'('+MIN+fmt(-x)+')':fmt(x); }        // negatif dalam kurung
const SUPM={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻','−':'⁻','+':'⁺','n':'ⁿ','x':'ˣ','(':'⁽',')':'⁾'};
function sup(s){ return String(s).split('').map(c=>SUPM[c]||c).join(''); }
function lg(b,x){ return (b===10?'':sup(b))+'log '+x; }
/* pecahan */
function F(n,d){ if(d<0){ n=-n; d=-d; } const g=gcd(n,d)||1; return {n:n/g,d:d/g}; }
function fadd(a,b){ return F(a.n*b.d+b.n*a.d,a.d*b.d); }
function fsub(a,b){ return F(a.n*b.d-b.n*a.d,a.d*b.d); }
function fmul(a,b){ return F(a.n*b.n,a.d*b.d); }
function fdiv(a,b){ return F(a.n*b.d,a.d*b.n); }
function fv(f){ return f.n/f.d; }
function fs(f){ return f.d===1?sg(f.n):(f.n<0?MIN:'')+Math.abs(f.n)+'/'+f.d; }
function fmix(f){ if(f.d===1) return sg(f.n); const neg=f.n<0, a=Math.abs(f.n), w=Math.floor(a/f.d), r=a%f.d; return (neg?MIN:'')+(w?w+' ':'')+r+'/'+f.d; }
function dec2(x){ return Math.abs(Math.round(x*100)-x*100)<1e-7; }
const GENS=[];
function G(key,unit,lvl,pola,kind,fn){ GENS.push({key,unit,fn}); }
G('k-persen','MD-16','L',null,'kilat',()=>{ const p=RN.pick([5,10,12.5,15,20,25,30,40,45,60,75,80,120,150]), b=40*RN.int(1,40); const v=p*b/100; return {perintah:fmt(p)+'% dari '+fmt(b),kunci:v,langkah:[fmt(p)+'% × '+fmt(b)+' = '+fmt(p)+'/100 × '+fmt(b)+' = '+fmt(v)]}; });
G('k-pecahan','MD-13','L',null,'kilat',()=>{ const b=RN.pick([3,4,5,6,8,12]); let a; do{ a=RN.int(1,b-1); }while(gcd(a,b)!==1); const N=b*RN.int(3,40); const v=a*N/b; return {perintah:a+'/'+b+' dari '+fmt(N),kunci:v,langkah:[fmt(N)+' ÷ '+b+' = '+fmt(N/b),fmt(N/b)+' × '+a+' = '+fmt(v)]}; });
G('k-pec-persen','MD-16','L',null,'kilat',()=>{ const b=RN.pick([2,4,5,8,20,25,40]); let a; do{ a=RN.int(1,b-1); }while(gcd(a,b)!==1); const v=a*100/b; return {perintah:a+'/'+b+' = … %',kunci:v,langkah:[a+'/'+b+' × 100% = '+fmt(v)+'%']}; });
G('k-operasi','MD-02','L',null,'kilat',()=>{ const c=RN.int(2,9), b=c*RN.int(2,12), d=RN.int(2,6), a=RN.int(20,99), e=RN.int(1,20); const v=a-(b/c)*d+e; return {perintah:a+' − '+b+' ÷ '+c+' × '+d+' + '+e,kunci:v,langkah:['Bagi dan kali dulu dari kiri: '+b+' ÷ '+c+' × '+d+' = '+fmt(b/c*d),a+' − '+fmt(b/c*d)+' + '+e+' = '+fmt(v)]}; });
G('k-negatif','MD-02','L',null,'kilat',()=>{ const a=RN.int(2,12), b=RN.int(2,12), c=RN.int(5,60); const v=-a*b+c; return {perintah:'('+MIN+a+') × '+b+' − ('+MIN+c+')',kunci:v,langkah:['('+MIN+a+') × '+b+' = '+sg(-a*b),'Kurang negatif = tambah: '+sg(-a*b)+' + '+c+' = '+sg(v)]}; });
G('k-kali','MD-02','L',null,'kilat',()=>{ const [x,y]=RN.pick([[25,4],[125,8],[50,2],[4,25],[8,125]]), N=RN.int(11,99); const v=x*N*y; return {perintah:x+' × '+N+' × '+y,kunci:v,langkah:['Pasangkan dulu '+x+' × '+y+' = '+(x*y),(x*y)+' × '+N+' = '+fmt(v)]}; });
G('k-kuadrat','MD-22','L',null,'kilat',()=>{ const t=RN.int(0,2); if(t===0){ const n=RN.int(11,25); return {perintah:n+'²',kunci:n*n,langkah:[n+' × '+n+' = '+fmt(n*n)]}; } if(t===1){ const n=RN.int(5,10); return {perintah:'2'+sup(n),kunci:Math.pow(2,n),langkah:['2'+sup(n)+' = '+fmt(Math.pow(2,n))]}; } const n=RN.int(3,6); return {perintah:'3'+sup(n),kunci:Math.pow(3,n),langkah:['3'+sup(n)+' = '+fmt(Math.pow(3,n))]}; });
G('k-fpb','MD-02','L',null,'kilat',()=>{ const g=RN.int(2,12); let m,n; do{ m=RN.int(2,9); n=RN.int(2,9); }while(m===n||gcd(m,n)!==1); return {perintah:'FPB('+g*m+', '+g*n+')',kunci:g,langkah:[g*m+' = '+g+' × '+m+', '+g*n+' = '+g+' × '+n,'Faktor bersama terbesar = '+g]}; });
G('k-kpk','MD-02','L',null,'kilat',()=>{ let a,b; do{ a=RN.int(4,30); b=RN.int(4,30); }while(a===b||lcm(a,b)>300||lcm(a,b)===Math.max(a,b)); const v=lcm(a,b); return {perintah:'KPK('+a+', '+b+')',kunci:v,langkah:['KPK = '+a+' × '+b+' ÷ FPB = '+(a*b)+' ÷ '+gcd(a,b)+' = '+v]}; });
G('k-desimal','MD-15','L',null,'kilat',()=>{ if(RN.chance(.5)){ const a=RN.int(2,9)/10, b=RN.int(11,49)/10; const v=Math.round(a*b*100)/100; return {perintah:fmt(a)+' × '+fmt(b),kunci:v,langkah:[(a*10)+' × '+(b*10)+' = '+(a*10*b*10)+', lalu geser koma 2 tempat → '+fmt(v)]}; } const d=RN.pick([0.2,0.4,0.5,0.25,0.05]), k=RN.int(3,40); const n=Math.round(k*d*100)/100; return {perintah:fmt(n)+' ÷ '+fmt(d),kunci:k,langkah:['Kalikan pembilang dan penyebut dengan 100 agar pembagi bulat',fmt(Math.round(n*100))+' ÷ '+fmt(Math.round(d*100))+' = '+k]}; });
G('k-naik','MD-17','L',null,'kilat',()=>{ const b=20*RN.int(5,100), p=RN.pick([5,10,15,20,25,30]), up=RN.chance(.5); const v=b*(100+(up?p:-p))/100; return {perintah:fmt(b)+' '+(up?'naik':'turun')+' '+p+'%',kunci:v,langkah:[fmt(b)+' × '+(up?100+p:100-p)+'% = '+fmt(v)]}; });
G('k-akar','MD-24','L',null,'kilat',()=>{ const [a,b]=RN.pick([[2,8],[3,12],[2,18],[5,20],[3,27],[6,24],[2,32],[5,45],[3,48],[7,28]]); const v=Math.sqrt(a*b); return {perintah:'√'+a+' × √'+b,kunci:v,langkah:['√('+a+' × '+b+') = √'+(a*b)+' = '+v]}; });
G('k-satuan','MD-29','L',null,'kilat',()=>{ const t=RN.int(0,2); if(t===0){ const km=RN.int(11,49)/10, m=RN.int(1,9)*10+RN.int(0,9)*100; const v=km*1000+m; return {perintah:fmt(km)+' km + '+fmt(m)+' m = … m',kunci:v,langkah:[fmt(km)+' km = '+fmt(km*1000)+' m',fmt(km*1000)+' + '+fmt(m)+' = '+fmt(v)]}; }
  if(t===1){ const kw=RN.int(1,5), kg=RN.int(5,95), on=RN.int(1,9)*5; const v=kw*100+kg+on/10; return {perintah:kw+' kuintal + '+kg+' kg + '+on+' ons = … kg',kunci:v,langkah:['1 kuintal = 100 kg, 1 ons = 0,1 kg',fmt(kw*100)+' + '+kg+' + '+fmt(on/10)+' = '+fmt(v)]}; }
  const m3=RN.int(11,39)/10, L=RN.int(1,9)*50; const v=m3*1000+L; return {perintah:fmt(m3)+' m³ + '+L+' L = … L',kunci:v,langkah:['1 m³ = 1.000 L',fmt(m3*1000)+' + '+L+' = '+fmt(v)]}; });
G('k-log','MD-25','L',null,'kilat',()=>{ const b=RN.pick([2,3,5,10]), k=b===2?RN.int(3,8):b===3?RN.int(2,5):b===5?RN.int(2,4):RN.int(2,5); return {perintah:lg(b,fmt(Math.pow(b,k))),kunci:k,langkah:[fmt(Math.pow(b,k))+' = '+b+sup(k)+', jadi hasilnya '+k]}; });
G('k-sifat','MD-23','L',null,'kilat',()=>{ const a=RN.int(2,9), b=RN.int(2,9), c=RN.int(2,9); const e=a+b-c; if(e<0||e>10) return null; return {perintah:'2'+sup(a)+' × 2'+sup(b)+' ÷ 2'+sup(c),kunci:Math.pow(2,e),langkah:['Basis sama: pangkat '+a+' + '+b+' − '+c+' = '+e,'2'+sup(e)+' = '+Math.pow(2,e)]}; });
G('k-pec-op','MD-13','L',null,'kilat',()=>{ const b=RN.pick([2,4,5]), d=RN.pick([4,5,10,20]); const x=F(RN.int(1,b-1),b), y=F(RN.int(1,d-1),d); const s=fadd(x,y); const v=fv(s); if(!dec2(v)||Number.isInteger(v)) return null; return {perintah:fs(x)+' + '+fs(y)+' (tulis desimal)',kunci:v,langkah:['Samakan penyebut: '+fs(x)+' + '+fs(y)+' = '+fs(s)+' = '+fmt(v)]}; });
G('k-untung','BIL-19','L',null,'kilat',()=>{ const B=RN.pick([20,40,50,80,200])*1000, p=RN.pick([10,20,25,50]); const v=B*(100+p)/100; return {perintah:'Beli '+fmt(B)+', untung '+p+'% → harga jual',kunci:v,langkah:[fmt(B)+' × '+(100+p)+'% = '+fmt(v)]}; });
G('k-rata','DAT-09','L',null,'kilat',()=>{ const n=RN.pick([4,5]), m=RN.int(5,20); const xs=[]; for(let i=0;i<n-1;i++) xs.push(m+RN.int(-4,4)); const last=m*n-xs.reduce((a,b)=>a+b,0); if(last<1) return null; xs.push(last); return {perintah:'Rata-rata '+RN.shuf(xs).join(', '),kunci:m,langkah:['Jumlah '+(m*n)+' ÷ '+n+' = '+m]}; });
G('k-suku','ALJ-10','L',null,'kilat',()=>{ const a=RN.int(1,9), b=RN.int(2,9), n=RN.int(10,30); const v=a+(n-1)*b; return {perintah:'U'+n+' dari '+a+', '+(a+b)+', '+(a+2*b)+', …',kunci:v,langkah:[a+' + '+(n-1)+' × '+b+' = '+v]}; });

function lastDate(u,k,J){ let b=null; u.les.forEach(l=>{ const d=lesDate(l,J); if(d&&d<=k&&(!b||d>b)) b=d; }); return b; }
function fokusUnits(date){ const k=ymd(date||new Date()), J=phJadwal(); const now=UNITS.filter(u=>u.les.some(l=>lesDate(l,J)===k)).map(u=>u.id); if(now.length) return now;

const has=(...u)=>{ const p=eqUnits(); return u.some(x=>p.has(x)); };

function niceStep(v){ const a=Math.abs(v); const e=Math.pow(10,Math.floor(Math.log10(a||1))); const m=a/e; return (m<2?.1:m<5?.2:.5)*e*2; }

/* ---------- Estimasi "paling mendekati" ---------- */
function estimItem(){
  /* tiap templat mengembalikan e (soal), v (nilai sebenarnya), est (hasil pembulatan), s (langkah) */
  const r10=x=>Math.round(x/10)*10, T=[];
  T.push(()=>{ const a=RN.int(2,9)*10+RN.pick([-2,-1,1,2]), b=RN.int(2,9)*10+RN.pick([-2,-1,1,2]), A=r10(a), B=r10(b); return {e:a+' × '+b,v:a*b,est:A*B,s:['Bulatkan: '+a+' ≈ '+A+', '+b+' ≈ '+B,A+' × '+B+' = '+fmt(A*B)]}; });
  T.push(()=>{ const d=RN.int(2,9)*10+RN.pick([-1,1]), D=r10(d), q=RN.int(3,30), n=q*D+RN.int(-4,4); return {e:fmt(n)+' ÷ '+d,v:n/d,est:n/D,s:['Bulatkan pembagi: '+d+' ≈ '+D,fmt(n)+' ÷ '+D+' ≈ '+fmt(Math.round(n/D*10)/10)]}; });
  if(has('BIL-13','BIL-14')){
    T.push(()=>{ const a0=RN.pick([.25,.5,.75]), a=Math.round((a0+RN.pick([-.02,-.01,.01,.02]))*100)/100, b0=RN.int(4,30)*4, b=Math.round((b0+RN.pick([-.3,-.2,.2,.3]))*10)/10; return {e:fmt(a)+' × '+fmt(b),v:a*b,est:a0*b0,s:['Bulatkan: '+fmt(a)+' ≈ '+fmt(a0)+', '+fmt(b)+' ≈ '+b0,fmt(a0)+' × '+b0+' = '+fmt(a0*b0)]}; });
    T.push(()=>{ const p0=RN.pick([10,20,25,50]), p=p0+RN.pick([-.6,-.4,.4,.6]), N0=RN.int(2,9)*100, N=N0+RN.pick([-3,-2,2,3]); return {e:fmt(p)+'% dari '+fmt(N),v:p*N/100,est:p0*N0/100,s:['Bulatkan: '+fmt(p)+'% ≈ '+p0+'%, '+fmt(N)+' ≈ '+fmt(N0),p0+'% × '+fmt(N0)+' = '+fmt(p0*N0/100)]}; });
    T.push(()=>{ const [a,b]=RN.pick([[1,3],[2,3],[1,6],[5,6],[1,7],[3,7]]), M=RN.int(10,60)*b, N=M+RN.pick([1,2,-1,-2]); return {e:a+'/'+b+' dari '+fmt(N),v:a*N/b,est:a*M/b,s:['Bulatkan '+fmt(N)+' ke kelipatan '+b+' terdekat: '+fmt(M),fmt(M)+' ÷ '+b+' × '+a+' = '+fmt(a*M/b)]}; });
  }

    const k=RN.int(0,4), opsi=[]; for(let i=0;i<5;i++) opsi.push(rnd(T0+(i-k)*step)); if(opsi[0]<=0) continue;

}

function kilatMix(){

/* ---------- Game 1: Timbangan P–Q ---------- */
function exprOf(v){ /* ekspresi bilangan bulat bernilai v */

    if(k===0){ const a=RN.int(2,9), b=Math.floor(v/a), c=v-a*b; if(b>=2) return {s:a+' × '+b+(c>0?' + '+c:c<0?' − '+(-c):''),st:a+' × '+b+(c?(c>0?' + ':' − ')+Math.abs(c):'')+' = '+v}; }
    if(k===1){ const c=RN.int(2,9), a=RN.int(2,9), b=Math.round((v+c)/a); if(b>=2&&a*b-c===v) return {s:a+' × '+b+' − '+c,st:a*b+' − '+c+' = '+v}; }
    if(k===2){ const d=RN.int(2,6); return {s:fmt(v*d)+' ÷ '+d,st:fmt(v*d)+' ÷ '+d+' = '+v}; } }
  return {s:String(v),st:String(v)};
}
function zone5(p,q){ return p>=2*q-1e-9?0:p>q+1e-9?1:Math.abs(p-q)<1e-9?2:3; }
function zone4(p,q){ return Math.abs(p-q)<1e-9?2:p>q?0:1; }

}

    const P=exprOf(p), Q=exprOf(q); return {info:'Perhatikan dua kuantitas berikut.',P:P.s,Q:Q.s,smp:[{p,q}],st:['P = '+P.st,'Q = '+Q.st]}; });
  T.push(()=>{ const lo=RN.int(1,4), hi=lo+RN.int(2,4), k=RN.int(2,3), c=RN.int(1,6); const xs=[]; for(let x=lo;x<=hi;x++) xs.push(x);
    return {info:'x bilangan bulat dengan '+lo+' ≤ x ≤ '+hi+'.',P:k+'x',Q:'x + '+c,smp:xs.map(x=>({p:k*x,q:x+c,lab:'x = '+x})),st:null}; });

    return {info:'x bilangan bulat negatif.',P:f[0],Q:f[1],smp:xs.map(x=>({p:f[2](x),q:f[3](x),lab:'x = '+x})),st:null,edge:'Uji beberapa nilai negatif, termasuk yang dekat dan jauh dari nol.'}; });
  if(has('BIL-13')){
    T.push(()=>{ const [a,b]=RN.pick([[1,2],[2,3],[3,4],[2,5],[3,5]]), [c,d]=RN.pick([[1,3],[1,4],[3,8],[1,5],[4,5]]); const N=b*d*RN.int(2,8), M=b*d*RN.int(2,8); const p=a*N/b, q=c*M/d;

      return {info:'Perhatikan dua kuantitas berikut.',P:p1+'% dari '+A,Q:p2+'% dari '+B,smp:[{p,q}],st:['P = '+fmt(p),'Q = '+fmt(q)]}; });
  }
  if(has('BIL-15')) T.push(()=>{ const hi=RN.int(3,5); const xs=[]; for(let x=1;x<=hi;x++) xs.push(x); const f=RN.pick([['x²','2x',x=>x*x,x=>2*x],['x³','x²',x=>x*x*x,x=>x*x],['2^x','x + 1',x=>Math.pow(2,x),x=>x+1]]);
    return {info:'x bilangan bulat dengan 1 ≤ x ≤ '+hi+'.',P:f[0],Q:f[1],smp:xs.map(x=>({p:f[2](x),q:f[3](x),lab:'x = '+x})),st:null}; });
  if(has('ALJ-01','BIL-14')) T.push(()=>{ const S=RN.int(8,16); const xs=[]; for(let x=Math.floor(S/2)+1;x<S;x++) xs.push(x);
    return {info:'x dan y bilangan bulat positif, x + y = '+S+', dan x > y.',P:'x',Q:'y',smp:xs.map(x=>({p:x,q:S-x,lab:'x = '+x+', y = '+(S-x)})),st:null,edge:'Coba nilai x terkecil dan terbesar yang mungkin.'}; });
  T.push(T[0]); /* soal angka murni dibobot dua kali supaya opsi "sama" dan "dua kali" juga sering muncul */
  for(let t=0;t<20;t++){ const r=RN.pick(T)(); if(!r) continue; const j=pqJudge(r.smp), L=j.versi===5?PQ5:PQ4;
    const st=r.st||r.smp.slice(0,4).map(x=>x.lab+': P = '+fmt(x.p)+', Q = '+fmt(x.q)+' → '+L[(j.versi===5?zone5:zone4)(x.p,x.q)].replace(/^Kuantitas /,'').replace(/\.$/,''));
    const why=j.versi===4?'Q bisa nol atau negatif, jadi dipakai versi 4 opsi.':(j.kunci===4||j.kunci===3&&j.versi===4)?'Hubungannya berubah untuk nilai yang berbeda, jadi tidak dapat ditentukan.':'';
    return {perintah:r.info+' P: '+r.P+'. Q: '+r.Q+'.',pqv:{info:r.info,P:r.P,Q:r.Q,smp:r.smp,versi:j.versi},html:'<p class="sm">'+esc(r.info)+'</p><div class="pq"><div><span class="sm">P</span>'+mx(r.P)+'</div><div><span class="sm">Q</span>'+mx(r.Q)+'</div></div>',opsi:L,kunci:j.kunci,langkah:st.concat(r.edge&&!r.st?[r.edge]:[],why?[why]:[])}; }
}

/* ---------- Game 2: Cukup Nggak? ---------- */
const NAMA=['Ani','Budi','Cici','Dodi','Eka','Fajar','Gita','Hadi','Indah','Joko'];
function ckItem(i){
  const pu=i%2===0, T=[];
  T.push(()=>{ const [a,b,c]=RN.shuf(NAMA).slice(0,3), sf=RN.pick(['tinggi','berat','tua']), inv={tinggi:'pendek',berat:'ringan',tua:'muda'}[sf];
    const set=RN.pick([
      [a+' lebih '+sf+' daripada '+b+'.',c+' lebih '+sf+' daripada '+a+'.',2,'Gabungan: '+c+' > '+a+' > '+b+', jadi '+c+' paling '+sf+'. Masing-masing saja belum membandingkan ketiganya.'],
      [a+' lebih '+sf+' daripada '+b+' dan '+c+'.',b+' lebih '+sf+' daripada '+c+'.',0,'Pernyataan pertama langsung menunjukkan '+a+' paling '+sf+'. Pernyataan kedua tidak menyebut '+a+'.'],
      [a+' paling '+inv+' di antara mereka bertiga.',b+' lebih '+sf+' daripada '+a+'.',4,'Kedua pernyataan tidak membandingkan '+b+' dengan '+c+', jadi yang paling '+sf+' tidak dapat dipastikan.'],
      [b+' lebih '+sf+' daripada '+a+' dan '+c+'.',a+' dan '+c+' lebih '+inv+' daripada '+b+'.',3,'Kedua pernyataan sama isinya: '+b+' paling '+sf+'. Masing-masing cukup.'],
      [a+' lebih '+inv+' daripada '+b+'.',c+' lebih '+inv+' daripada '+a+'.',2,'Gabungan: '+b+' > '+a+' > '+c+', jadi '+b+' paling '+sf+'.']]);
    return {q:'Siapa yang paling '+sf+' di antara '+a+', '+b+', dan '+c+'?',s:[set[0],set[1]],k:set[2],w:set[3]}; });
  T.push(()=>{ const o=2*RN.int(1,5)+1, e=2*RN.int(1,5), m=2*RN.int(1,4)+1;
    const set=RN.pick([
      ['n + '+o+' bilangan ganjil.',m+'n bilangan genap.',3,'n + '+o+' ganjil berarti n genap. '+m+'n genap dengan '+m+' ganjil berarti n genap. Masing-masing cukup.'],
      ['n habis dibagi 3.','n + 1 bilangan ganjil.',1,'n + 1 ganjil berarti n genap. Habis dibagi 3 bisa genap (6) atau ganjil (9).'],
      ['n habis dibagi 3.','n lebih dari 10.',4,'Contoh 12 genap dan 15 ganjil memenuhi keduanya, jadi tidak cukup.'],
      ['n + m bilangan genap.','m bilangan ganjil.',2,'Gabungan: m ganjil dan n + m genap, jadi n ganjil. Masing-masing saja tidak cukup.'],
      ['2n bilangan genap.','n + '+e+' bilangan ganjil.',1,'2n selalu genap untuk n bulat, jadi pernyataan pertama tidak memberi informasi. n + '+e+' ganjil berarti n ganjil.']]);
    return {q:'n'+(set[0].includes('m ')||set[1].includes('m ')?' dan m':'')+' bilangan bulat. Apakah n genap?',s:[set[0],set[1]],k:set[2],w:set[3]}; });
  if(has('ALJ-11')) T.push(()=>{ const x=RN.int(2,12), y=RN.int(1,x-1), a=RN.int(2,5), b=RN.int(1,9);
    const set=RN.pick([
      ['x + y = '+(x+y)+'.','x − y = '+(x-y)+'.',2,'Dua persamaan dengan dua variabel: dijumlahkan, 2x = '+2*x+', jadi x = '+x+'. Masing-masing saja punya banyak penyelesaian.'],
      [a+'x + '+b+' = '+(a*x+b)+'.','x + y = '+(x+y)+'.',0,'Pernyataan pertama: x = '+x+'. Pernyataan kedua masih memuat y yang tidak diketahui.'],
      ['x + y = '+(x+y)+'.',2+'x + '+2+'y = '+2*(x+y)+'.',4,'Pernyataan kedua hanya kelipatan pernyataan pertama, jadi tetap satu persamaan dengan dua variabel.'],
      [a+'x = '+a*x+'.','x − '+b+' = '+(x-b)+'.',3,'Masing-masing langsung memberi x = '+x+'.']]);
    return {q:'Berapakah nilai x?',s:[set[0],set[1]],k:set[2],w:set[3]}; });

/* ---------- Game 3: Kisi Operasi ---------- */
const OPS={'+':(a,b)=>a+b,'−':(a,b)=>a-b,'×':(a,b)=>a*b};
function kisiItem(){
  const ok=Object.keys(OPS);
  for(let t=0;t<400;t++){ const g=[0,1,2].map(()=>[0,1,2].map(()=>RN.int(1,9))), o1=RN.pick(ok); let o2=RN.pick(ok); if(o2===o1) continue;
    const ev=(a,b,c,x,y)=>OPS[y](OPS[x](a,b),c);
    const rows=g.map(r=>ev(r[0],r[1],r[2],o1,o2)), cols=[0,1,2].map(j=>ev(g[0][j],g[1][j],g[2][j],o1,o2));
    const match=[]; ok.forEach(x=>ok.forEach(y=>{ if(x===y) return; let good=true; for(let i=0;i<3;i++){ if(ev(g[i][0],g[i][1],g[i][2],x,y)!==rows[i]||ev(g[0][i],g[1][i],g[2][i],x,y)!==cols[i]) good=false; } if(good) match.push(x+y); }));
    const hide=RN.int(0,5), isRow=hide<3, idx=hide%3, ans=isRow?rows[idx]:cols[idx];
    /* teka-teki harus tetap tunggal walau satu hasil disembunyikan */
    const match2=[]; ok.forEach(x=>ok.forEach(y=>{ if(x===y) return; let good=true; for(let i=0;i<3;i++){ if(!(isRow&&i===idx)&&ev(g[i][0],g[i][1],g[i][2],x,y)!==rows[i]) good=false; if(!(!isRow&&i===idx)&&ev(g[0][i],g[1][i],g[2][i],x,y)!==cols[i]) good=false; } if(good) match2.push(x+y); }));
    if(match.length!==1||match2.length!==1||Math.abs(ans)>150) continue;
    const alt=new Set([ans]); ok.forEach(x=>ok.forEach(y=>{ if(x!==y){ const v=isRow?ev(g[idx][0],g[idx][1],g[idx][2],x,y):ev(g[0][idx],g[1][idx],g[2][idx],x,y); alt.add(v); } }));
    let d=1; while(alt.size<5){ alt.add(ans+d); alt.add(ans-d); d++; }
    const opsi=[...alt].slice(0,5).sort((a,b)=>a-b); if(!opsi.includes(ans)){ opsi[RN.int(0,4)]=ans; opsi.sort((a,b)=>a-b); }
    const R=i=>isRow&&i===idx?'?':fmt(rows[i]), C=j=>!isRow&&j===idx?'?':fmt(cols[j]);
    let h='<p class="sm">Simbol # dan @ masing-masing mewakili satu operasi (+, −, atau ×), sama di semua baris dan kolom. Hitung dari kiri ke kanan dan dari atas ke bawah.</p><div class="tw"><table class="kisi">';
    for(let i=0;i<3;i++){ h+='<tr>'+g[i].map((v,j)=>'<td class="n">'+v+'</td>'+(j<2?'<td class="o">'+(j===0?'#':'@')+'</td>':'')).join('')+'<td class="o">=</td><td class="r">'+R(i)+'</td></tr>';
      if(i<2) h+='<tr>'+[0,1,2].map(j=>'<td class="o">'+(i===0?'#':'@')+'</td>'+(j<2?'<td></td>':'')).join('')+'<td></td><td></td></tr>'; }
    h+='<tr>'+[0,1,2].map(j=>'<td class="o">=</td>'+(j<2?'<td></td>':'')).join('')+'<td></td><td></td></tr><tr>'+[0,1,2].map(j=>'<td class="r">'+C(j)+'</td>'+(j<2?'<td></td>':'')).join('')+'<td></td><td></td></tr></table></div><p class="ask">Nilai yang tepat untuk ? adalah …</p>';
    const line=isRow?'('+g[idx][0]+' '+o1+' '+g[idx][1]+') '+o2+' '+g[idx][2]:'('+g[0][idx]+' '+o1+' '+g[1][idx]+') '+o2+' '+g[2][idx];
    const cek=isRow?(idx===0?1:0):-1, contoh=cek>=0?'Cek baris '+(cek+1)+': ('+g[cek][0]+' '+o1+' '+g[cek][1]+') '+o2+' '+g[cek][2]+' = '+fmt(rows[cek]):'Cek baris 1: ('+g[0][0]+' '+o1+' '+g[0][1]+') '+o2+' '+g[0][2]+' = '+fmt(rows[0]);
    return {perintah:'Kisi operasi: cari nilai ?',kisi:{g,rows,cols,isRow,idx},kp:1,kunci:ans,langkah:['# = '+o1+' dan @ = '+o2+' (satu-satunya pasangan yang cocok dengan semua hasil yang terlihat)',contoh,(isRow?'Baris ':'Kolom ')+(idx+1)+': '+line+' = '+fmt(ans)]}; }
  return null;
}

/* ---------- Game 4: Detektif Barisan ---------- */
function barisanItem(){
  const mode=RN.int(0,3);
  if(mode===0){ const a=RN.int(1,20), b=RN.int(20,60), d1=RN.int(2,9), d2=-RN.int(1,6); const t=[]; for(let i=0;i<4;i++){ t.push(a+i*d1,b+i*d2); }
    return {perintah:'Lanjutkan: '+t.slice(0,6).map(fmt).join(', ')+', …',kp:1,bar:{hint:'Lanjutkan barisannya. Ketuk lup di antara balok untuk melihat selisihnya.',cells:t.slice(0,6).map(v=>({v})).concat([{q:1}])},kunci:t[6],langkah:['Suku ganjil: '+[t[0],t[2],t[4]].map(fmt).join(', ')+' (beda '+sg(d1)+')','Suku genap: '+[t[1],t[3],t[5]].map(fmt).join(', ')+' (beda '+sg(d2)+')','Suku ke-7 = '+fmt(t[4])+' + '+d1+' = '+fmt(t[6])]}; }
  if(mode===1){ const s=RN.int(1,9), p=RN.int(1,6), q=RN.int(2,3); const t=[s]; for(let i=1;i<7;i++) t.push(i%2?t[i-1]+p:t[i-1]*q);
    return {perintah:'Lanjutkan: '+t.slice(0,6).map(fmt).join(', ')+', …',kp:1,bar:{hint:'Lanjutkan barisannya. Ketuk lup di antara balok untuk melihat perubahannya.',cells:t.slice(0,6).map(v=>({v})).concat([{q:1}])},kunci:t[6],langkah:['Polanya bergantian: + '+p+', × '+q,'Suku ke-7 = '+fmt(t[5])+' + '+p+' = '+fmt(t[6])]}; }
  if(mode===2){ const a=RN.int(2,30), d=RN.int(3,12); const t=[]; for(let i=0;i<7;i++) t.push(a+i*d); const k=RN.int(2,5), w=t[k]+RN.pick([-2,-1,1,2])*RN.int(1,Math.max(1,Math.floor(d/2))); const shown=t.slice(); shown[k]=w;
    return {perintah:'Satu suku salah catat: '+shown.map(fmt).join(', ')+'. Berapa nilai yang seharusnya?',kp:1,needSel:k,bar:{hint:'Satu balok salah catat. Ketuk balok itu, lalu ketik nilai yang benar.',pick:1,cells:shown.map(v=>({v}))},kunci:t[k],langkah:['Beda antarsuku yang konsisten: '+d,'Suku ke-'+(k+1)+' seharusnya '+fmt(t[k-1])+' + '+d+' = '+fmt(t[k])+', bukan '+fmt(w)]}; }
  const p=RN.int(2,7), q=RN.int(2,3), s=RN.int(1,8); const t=[s]; for(let i=1;i<7;i++) t.push(i%2?t[i-1]*q:t[i-1]+p);
  return {perintah:'Suku ke-4 sampai ke-7 suatu barisan: '+t.slice(3).map(fmt).join(', ')+'. Polanya bergantian × '+q+' dan + '+p+'. Suku pertamanya?',kp:1,bar:{hint:'Polanya bergantian × '+q+' dan + '+p+'. Mundur dari suku ke-4 sampai suku pertama.',cells:[{q:1},{blank:1},{blank:1}].concat(t.slice(3).map(v=>({v})))},kunci:s,langkah:['Mundur dari suku ke-4 ('+fmt(t[3])+'): kebalikan dari × dan + adalah ÷ dan −','Suku ke-3 = '+fmt(t[3])+' ÷ '+q+' = '+fmt(t[2]),'Suku ke-2 = '+fmt(t[2])+' − '+p+' = '+fmt(t[1]),'Suku ke-1 = '+fmt(t[1])+' ÷ '+q+' = '+fmt(t[0])]};
}

/* ---------- Game 6: Mesin Fungsi ---------- */
function mesinItem(){
  const R=[()=>{ const a=RN.int(2,6), b=RN.int(-9,9); return {f:x=>a*x+b,t:a+'x '+(b<0?'− '+(-b):'+ '+b),inv:y=>(y-b)/a}; },
           ()=>{ const a=RN.int(2,5), b=RN.int(1,7); return {f:x=>a*(x+b),t:a+'(x + '+b+')',inv:y=>y/a-b}; }];
  if(has('BIL-15')) R.push(()=>{ const b=RN.int(-5,9); return {f:x=>x*x+b,t:'x² '+(b<0?'− '+(-b):'+ '+b),inv:null}; });
  const r=RN.pick(R)(), xs=RN.shuf([1,2,3,4,5,6]).slice(0,3).sort((a,b)=>a-b), pairs=xs.map(x=>x+' → '+fmt(r.f(x))).join(', ');
  if(r.inv&&has('ALJ-08')&&RN.chance(.5)){ let x0; do{ x0=RN.int(7,15); }while(xs.includes(x0)); const y=r.f(x0);
    return {perintah:'Mesin: '+pairs+'. Input berapa yang menghasilkan '+fmt(y)+'?',kp:1,mesin:{pairs:xs.map(x=>[x,r.f(x)]),x:null,y,rule:r.t},kunci:x0,langkah:['Aturan mesin: '+r.t,'Jalankan mundur: '+r.t+' = '+fmt(y)+' → x = '+x0]}; }
  const x0=RN.int(7,12); return {perintah:'Mesin: '+pairs+'. Output untuk input '+x0+'?',kp:1,mesin:{pairs:xs.map(x=>[x,r.f(x)]),x:x0,y:null,rule:r.t},kunci:r.f(x0),langkah:['Aturan mesin: '+r.t,'Input '+x0+' → '+fmt(r.f(x0))]};
}

  if(rv){ const kE=(z.versi===5&&it.kunci===4)||(z.versi===4&&it.kunci===3); if(kE) wob=true; else { const x=z.smp[0]; ang=tilt(x.p,x.q,z.versi===5); if(!multi){ pv=fmt(x.p); qv=fmt(x.q); } } }

  h+='<details><summary>Lihat resep '+r.slots.length+' soal</summary><ol class="resep">'+r.slots.map(s=>'<li>'+badge(s.sub)+' '+jbadge(s.jenis)+' <span class="code">'+s.lvl+'</span> <span>'+esc(slotShort(s,r))+'</span></li>').join('')+'</ol></details></div>';
